
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FuelTrack">
<title>FuelTrack 2.0</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#22252c;--text:#f5f6f8;--muted:#a1a6b2;--line:#30343d;--accent:#a3e635;--accentText:#17210b;--red:#fb7185;--blue:#60a5fa;--orange:#fbbf24;--green:#4ade80;--shadow:0 10px 30px #0002}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--panel2:#edf0f4;--text:#181b22;--muted:#687080;--line:#dfe3e9;--accent:#65a30d;--accentText:#fff;--red:#e11d48;--blue:#2563eb;--orange:#b45309;--green:#15803d;--shadow:0 8px 25px #18202a0d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.header-inner,.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:22px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--accent)}
.version{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
main{max-width:760px;margin:auto;padding:18px 15px 30px}
nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 5px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);gap:2px}
nav button{border:0;background:transparent;color:var(--muted);padding:7px 1px;border-radius:12px;font-size:10px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .ico{font-size:19px;line-height:1.2}nav button.active{color:var(--accent);background:var(--panel2)}
h1{font-size:27px;letter-spacing:-.8px;margin:5px 0 4px}h2{font-size:18px;margin:0 0 12px;letter-spacing:-.3px}h3{font-size:14px;margin:0 0 8px}
p{margin:5px 0 12px}.muted,.hint{color:var(--muted)}.hint{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;min-width:0;box-shadow:var(--shadow);margin-bottom:12px}
.card.tight{padding:12px}.section{margin-top:23px}.big{font-size:28px;font-weight:850;letter-spacing:-1px;line-height:1.15}.unit{font-size:12px;color:var(--muted);font-weight:600}.stat-label{font-size:12px;color:var(--muted);margin-bottom:7px}.accent{color:var(--accent)}.red{color:var(--red)}.blue{color:var(--blue)}.orange{color:var(--orange)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0 6px}.progress>div{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.ringrow{display:flex;align-items:center;gap:14px}.ring{width:92px;height:92px;flex:none;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke:var(--panel2);stroke-width:9}.ring circle.value{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .3s}.ring .ringtext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:850}.ringtext strong{font-size:18px}.ringtext small{font-size:10px;color:var(--muted)}
.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px;border-radius:9px}.btn.full{width:100%}.iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:17px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px 12px;border-radius:11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 6px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid .wide{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:8px}.entry{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px}.entry .name{font-weight:750;overflow-wrap:anywhere}.entry .sub{font-size:11px;color:var(--muted)}.entry .cal{font-size:13px;font-weight:800;white-space:nowrap}
.mealhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:13px}
canvas,svg.chart{display:block;width:100%;height:auto;overflow:visible}
.chartbox{padding:12px 6px 2px}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px}.legend .bluekey:before{background:var(--blue)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.tabs button{white-space:nowrap}
.notice{border-radius:12px;background:var(--panel2);padding:11px 12px;font-size:12px;color:var(--muted);margin:10px 0}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
details{background:var(--panel2);border-radius:12px;padding:12px;margin:10px 0}summary{font-weight:750;cursor:pointer}
#scanner{width:100%;overflow:hidden;border-radius:12px;margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}
@media(min-width:620px){nav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,760px);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0;padding-left:12px;padding-right:12px}.grid.three .big{font-size:32px}}
@media(max-width:380px){main{padding-left:10px;padding-right:10px}.card{padding:12px}.big{font-size:24px}.ring{width:78px;height:78px}.grid.three{gap:7px}.grid.three .card{padding:10px}}
</style>
</head>
<body>
<header>
 <div class="header-inner">
  <div><div class="brand">Fuel<span>Track</span></div><div class="version">VERSION 2.0 · YOUR PROGRESS, CLEARER</div></div>
  <button class="iconbtn" id="themeQuick" aria-label="Toggle theme" title="Toggle dark/light mode">☼</button>
 </div>
</header>
<main id="app" aria-live="polite"></main>
<nav id="nav">
 <button data-page="today" class="active"><span class="ico">◉</span>Today</button>
 <button data-page="food"><span class="ico">♨</span>Food</button>
 <button data-page="weight"><span class="ico">↗</span>Weight</button>
 <button data-page="progress"><span class="ico">▥</span>Progress</button>
 <button data-page="weekly"><span class="ico">▦</span>Weekly</button>
 <button data-page="settings"><span class="ico">⚙</span>Settings</button>
</nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
"use strict";
const KEY="fueltrack-v1";
const defaults={targets:{calories:1800,protein:150,goalWeight:null,startWeight:null},foods:[],weights:[],activity:{}};
let data, page="today", searchResults=[], scanner=null, editingId=null, selectedMeal="Breakfast", weeklyOffset=0;
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString("en-CA");
const dateShift=(date,days)=>{let d=new Date(date+"T12:00:00");d.setDate(d.getDate()+days);return d.toLocaleDateString("en-CA")};
const dateObj=s=>new Date(s+"T12:00:00");
const num=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
const round=(v,n=0)=>Number(num(v).toFixed(n));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtDate=s=>dateObj(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const fmtLong=s=>dateObj(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
function normalize(raw){
 const d=raw&&typeof raw==="object"?raw:{};
 d.targets={...defaults.targets,...(d.targets||{})};
 d.foods=Array.isArray(d.foods)?d.foods:[];
 d.weights=Array.isArray(d.weights)?d.weights:[];
 d.activity=d.activity&&typeof d.activity==="object"?d.activity:{};
 d.foods=d.foods.map(f=>({...f,id:f.id||id(),date:f.date||today(),name:String(f.name||"Food"),calories:num(f.calories),protein:num(f.protein),meal:f.meal||"Snacks"}));
 d.weights=d.weights.map(w=>({...w,id:w.id||id(),date:w.date||today(),kg:num(w.kg)})).filter(w=>w.kg>0);
 for(const [date,a] of Object.entries(d.activity))d.activity[date]={steps:Math.max(0,num(a?.steps)),water:Math.max(0,num(a?.water))};
 d.favorites=Array.isArray(d.favorites)?d.favorites:[];
 d.savedMeals=Array.isArray(d.savedMeals)?d.savedMeals:[];
 d.settings=d.settings&&typeof d.settings==="object"?d.settings:{theme:"dark",reminders:false};
 return d;
}
function load(){
 try{const raw=localStorage.getItem(KEY);data=normalize(raw?JSON.parse(raw):defaults);}
 catch(e){data=normalize(defaults);console.error("Could not read saved FuelTrack data",e);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("FuelTrack could not save this change. Your browser storage may be full. Export a backup and try again.");return false}}
function theme(){document.documentElement.dataset.theme=data.settings.theme==="light"?"light":"dark";document.querySelector('meta[name="theme-color"]').content=data.settings.theme==="light"?"#f4f6f8":"#101114";$("themeQuick").textContent=data.settings.theme==="light"?"☾":"☼"}
function setTheme(v){data.settings.theme=v;save();theme();render()}
function dayFoods(date=today()){return data.foods.filter(f=>f.date===date)}
function sumFoods(list){return list.reduce((a,f)=>({calories:a+num(f.calories),protein:a+num(f.protein)}),{calories:0,protein:0})}
function activity(date=today()){return data.activity[date]||{steps:0,water:0}}
function allWeightSorted(){return [...data.weights].sort((a,b)=>a.date.localeCompare(b.date)||num(a.kg)-num(b.kg))}
function latestWeight(){return allWeightSorted().slice(-1)[0]}
function weightAtOrBefore(date){return allWeightSorted().filter(w=>w.date<=date).slice(-1)[0]}
function avg(a){return a.length?a.reduce((s,v)=>s+v,0)/a.length:null}
function pct(v,t){return t>0?Math.max(0,Math.min(100,v/t*100)):0}
function escText(v){return esc(v)}
function btn(text,action,cls=""){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}
function ring(value,target,label){
 const p=pct(value,target),dash=2*Math.PI*39;
 return `<div class="ring"><svg viewBox="0 0 100 100" aria-label="${esc(label)} progress"><circle cx="50" cy="50" r="39"/><circle class="value" cx="50" cy="50" r="39" stroke-dasharray="${dash*p/100} ${dash}"/></svg><div class="ringtext"><strong>${Math.round(p)}%</strong><small>${esc(label)}</small></div></div>`;
}
function progressBar(value,target){return `<div class="progress"><div style="width:${pct(value,target)}%"></div></div>`}
function statCard(label,value,unit,sub=""){return `<div class="card"><div class="stat-label">${label}</div><div class="big">${value}<span class="unit"> ${unit}</span></div>${sub?`<div class="hint">${sub}</div>`:""}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function chartSVG(points,opts={}){
 const W=340,H=170,L=35,R=10,T=14,B=28,iw=W-L-R,ih=H-T-B;
 const values=points.map(p=>num(p.value)).filter(Number.isFinite);
 if(!points.length||!values.length)return `<div class="chartbox">${empty("Add some entries to see your chart.")}</div>`;
 let min=opts.min!==undefined?opts.min:Math.min(...values),max=opts.max!==undefined?opts.max:Math.max(...values);
 if(min===max){min=Math.max(0,min-1);max=max+1}
 if(opts.min===undefined)min=Math.max(0,min-(max-min)*.12);
 if(opts.max===undefined)max=max+(max-min)*.12;
 const x=i=>L+(points.length===1?iw/2:i*iw/(points.length-1));
 const y=v=>T+ih-(v-min)/(max-min)*ih;
 const path=points.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(num(p.value)).toFixed(1)).join(" ");
 let grid="";
 for(let i=0;i<4;i++){const v=min+(max-min)*i/3,yy=y(v);grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${yy+3}" text-anchor="end" fill="var(--muted)" font-size="9">${round(v,1)}</text>`}
 const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(num(p.value))}" r="3" fill="${opts.color||"var(--accent)"}"><title>${esc(p.label)}: ${round(p.value,1)}</title></circle>`).join("");
 const labels=points.map((p,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="var(--muted)" font-size="9">${esc(p.label)}</text>`:"").join("");
 return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Progress chart")}">${grid}<path d="${path}" fill="none" stroke="${opts.color||"var(--accent)"}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg></div>`;
}
function dateRange(n,end=today()){return Array.from({length:n},(_,i)=>dateShift(end,i-(n-1)))}
function dailyData(days){
 return days.map(date=>({date,foods:dayFoods(date),totals:sumFoods(dayFoods(date)),activity:activity(date)}));
}
function pageTitle(title,sub=""){return `<div class="topline"><div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:""}</div></div>`}
function render(){
 theme();
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const app=$("app");
 if(page==="today")app.innerHTML=renderToday();
 else if(page==="food")app.innerHTML=renderFood();
 else if(page==="weight")app.innerHTML=renderWeight();
 else if(page==="progress")app.innerHTML=renderProgress();
 else if(page==="weekly")app.innerHTML=renderWeekly();
 else app.innerHTML=renderSettings();
}
function renderToday(){
 const foods=dayFoods(),t=sumFoods(foods),a=activity(),calTarget=num(data.targets.calories,1800),proTarget=num(data.targets.protein,150);
 const remain=calTarget-t.calories;
 const meals=["Breakfast","Lunch","Dinner","Snacks"];
 let mealHtml=meals.map(meal=>{
  const fs=foods.filter(f=>(f.meal||"Snacks")===meal);
  return `<div class="mealhead"><strong>${meal}</strong><span class="hint">${Math.round(sumFoods(fs).calories)} kcal</span>${btn("+ Add","addmeal:"+meal,"small")}</div>${fs.length?`<div class="list">${fs.map(foodRow).join("")}</div>`:empty("Nothing logged yet")}`;
 }).join("");
 const w=latestWeight();
 return `${pageTitle("Today",fmtLong(today()))}
 <div class="card">
  <div class="row between"><div><div class="stat-label">CALORIES CONSUMED</div><div class="big">${Math.round(t.calories)} <span class="unit">/ ${calTarget} kcal</span></div><div class="hint ${remain<0?"red":"accent"}">${Math.round(remain)} kcal ${remain>=0?"remaining":"over target"}</div></div>${ring(t.calories,calTarget,"Calories")}</div>
  ${progressBar(t.calories,calTarget)}
  <hr>
  <div class="row between"><div class="grow"><div class="stat-label">PROTEIN</div><div class="big">${round(t.protein)} <span class="unit">/ ${proTarget} g</span></div></div><div class="pill">${Math.round(pct(t.protein,proTarget))}% of goal</div></div>
  ${progressBar(t.protein,proTarget)}
 </div>
 <div class="grid three">
  ${statCard("STEPS",Math.round(a.steps).toLocaleString(),"","Daily activity")}
  ${statCard("WATER",round(a.water,1),"L","Daily intake")}
  ${statCard("LATEST WEIGHT",w?round(w.kg,1):"—",w?"kg":"","")}
 </div>
 <div class="row wrap">${btn("＋ Log food","gofood","primary")}${btn("＋ Log weight","goweight")}${btn("＋ Activity","activityform")}</div>
 <div class="section"><h2>Today's food</h2>${mealHtml}</div>
 <div class="section"><h2>Daily check-in</h2><div class="card"><p class="muted">Make a quick note of your steps and water.</p>${activityFormHTML(a)}</div></div>
 <div class="notice">Your daily totals use foods logged for today. Weight changes naturally day to day, so use longer-term trends to judge progress.</div>`;
}
function foodRow(f){
 return `<div class="entry"><div class="grow"><div class="name">${esc(f.name)} ${data.favorites.includes(f.name)?'<span class="accent">★</span>':""}</div><div class="sub">${esc(f.meal||"Snacks")} · ${round(f.protein)}g protein${f.date!==today()?" · "+fmtDate(f.date):""}</div></div><div class="cal">${Math.round(num(f.calories))} kcal</div><button class="iconbtn" data-action="editfood:${f.id}" aria-label="Edit ${esc(f.name)}">✎</button><button class="iconbtn" data-action="deletefood:${f.id}" aria-label="Delete ${esc(f.name)}">×</button></div>`;
}
function activityFormHTML(a){
 return `<form id="activityForm" class="formgrid"><div><label for="steps">Steps</label><input id="steps" name="steps" type="number" min="0" step="1" value="${num(a.steps)}"></div><div><label for="water">Water (litres)</label><input id="water" name="water" type="number" min="0" step=".1" value="${num(a.water)}"></div><div class="wide"><button class="btn primary full" type="submit">Save activity</button></div></form>`;
}
function renderFood(){
 const foods=dayFoods(),t=sumFoods(foods);
 return `${pageTitle("Food diary","Search foods, scan a barcode or log a meal.")}
 <div class="card"><div class="row between"><div><div class="stat-label">TODAY'S INTAKE</div><div class="big">${Math.round(t.calories)} <span class="unit">kcal</span></div><div class="hint">${round(t.protein)}g protein · ${foods.length} entries</div></div>${btn("＋ Manual entry","manualform","primary")}</div></div>
 <div class="card"><h2>Find a food</h2><form id="foodSearchForm"><div class="row"><input id="foodSearch" placeholder="Search food or brand…" autocomplete="off" required><button class="btn primary" type="submit">Search</button></div></form><div id="searchResults" class="list" style="margin-top:10px">${searchResults.length?searchResults.map(searchRow).join(""):empty("Search the Open Food Facts database to find packaged foods.")}</div><div class="hint">Nutrition information depends on the product listing. Check the label where possible.</div></div>
 <div class="card"><h2>Barcode scanner</h2><p class="muted">Allow camera access to scan a food barcode. If the camera does not start, use search or manual entry.</p><div class="row wrap">${btn("Start scanner","startscan","primary")}${btn("Stop scanner","stopscan")}</div><div id="scanner"></div><div id="scanMessage" class="hint"></div></div>
 <div class="card"><h2>Quick add</h2><div class="row wrap">${["Breakfast","Lunch","Dinner","Snacks"].map(m=>btn(m,"addmeal:"+m,"small")).join("")}</div></div>
 <div class="section"><div class="topline"><h2>Today's entries</h2><span class="hint">${fmtDate(today())}</span></div>${foods.length?`<div class="list">${foods.map(foodRow).join("")}</div>`:empty("No food logged today yet.")}</div>
 <div class="section"><h2>Favourites</h2>${data.favorites.length?`<div class="list">${data.favorites.map(name=>`<div class="entry"><div class="grow"><div class="name">★ ${esc(name)}</div><div class="sub">Saved favourite</div></div>${btn("Add","favadd:"+encodeURIComponent(name),"small primary")}${btn("Remove","favremove:"+encodeURIComponent(name),"small")}</div>`).join("")}</div>`:empty("Save foods as favourites from the manual entry form or search results.")}</div>
 <div class="section"><h2>Saved meals</h2>${data.savedMeals.length?`<div class="list">${data.savedMeals.map((m,i)=>`<div class="entry"><div class="grow"><div class="name">${esc(m.name)}</div><div class="sub">${Math.round(m.calories)} kcal · ${round(m.protein)}g protein</div></div>${btn("Add meal","savedmeal:"+i,"small primary")}${btn("×","delsavedmeal:"+i,"small")}</div>`).join("")}</div>`:empty("Save a meal after logging foods to add it quickly next time.")}</div>`;
}
function searchRow(p,i){
 return `<div class="entry"><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${Math.round(p.calories)} kcal · ${round(p.protein)}g protein per 100g/listed serving</div></div>${btn("Add","searchadd:"+i,"small primary")}</div>`;
}
function renderWeight(){
 const weights=allWeightSorted(),latest=weights.slice(-1)[0],first=weights[0],goal=num(data.targets.goalWeight,0);
 const delta=weights.length>1?latest.kg-first.kg:null;
 const recent=weights.filter(w=>w.date>=dateShift(today(),-6));
 return `${pageTitle("Weight","Log weigh-ins and follow the trend, not individual fluctuations.")}
 <div class="grid">
 ${statCard("LATEST WEIGHT",latest?round(latest.kg,1):"—",latest?"kg":"",latest?fmtDate(latest.date):"Add your first weigh-in")}
 ${statCard("CHANGE SINCE FIRST",delta===null?"—":(delta>0?"+":"")+round(delta,1),delta===null?"": "kg",weights.length>1?`${fmtDate(first.date)} to ${fmtDate(latest.date)}`:"Need two weigh-ins")}
 </div>

function renderProgress(){
 const days=dateRange(14),series=dailyData(days),weights=allWeightSorted(),goal=num(data.targets.goalWeight,0),latest=latestWeight();
 const weekW=weights.filter(w=>w.date>=dateShift(today(),-6)),weekAvg=avg(weekW.map(w=>w.kg));
 const start=weights[0],change=latest&&start?latest.kg-start.kg:null;
 let estimate="Add more weigh-ins";
 if(goal>0&&latest&&latest.kg===goal)estimate="You've reached your goal weight";
 else if(goal>0&&weights.length>=3){
  const first=weights[0],last=weights[weights.length-1],elapsed=(dateObj(last.date)-dateObj(first.date))/86400000;
  if(elapsed>=14&&last.date!==first.date){
   const rate=(last.kg-first.kg)/(elapsed/7),remaining=goal-last.kg;
   if(Math.abs(rate)<.02)estimate="Not enough recent change to estimate reliably";
   else if(remaining*rate<0)estimate="Your recent trend is moving away from your goal";
   else {const weeks=remaining/rate;if(weeks>=0&&weeks<520)estimate=`About ${Math.max(0,Math.round(weeks*7))} days at your recorded trend`;else estimate="Goal date is too uncertain to estimate";}
  }
 }
 const calTarget=num(data.targets.calories,1800),proTarget=num(data.targets.protein,150);
 return `${pageTitle("Progress","Your trends over time, using the records you've logged.")}
 <div class="grid">
 ${statCard("CURRENT WEIGHT",latest?round(latest.kg,1):"—",latest?"kg":"",latest?fmtDate(latest.date):"Log a weigh-in")}
 ${statCard("7-DAY WEIGHT AVG",weekAvg===null?"—":round(weekAvg,2),weekAvg===null?"":"kg",`${weekW.length} weigh-ins in range`)}
 </div>

 <div class="card"><h2>Calorie trend · last 14 days</h2>${chartSVG(series.map(d=>({label:fmtDate(d.date),value:d.totals.calories})),{aria:"Daily calorie intake",color:"var(--blue)",min:0})}<div class="legend"><span class="bluekey">Calories</span></div><p class="hint">Days without food entries appear as zero; they may be incomplete logs, not zero intake.</p></div>
 <div class="card"><h2>Protein trend · last 14 days</h2>${chartSVG(series.map(d=>({label:fmtDate(d.date),value:d.totals.protein})),{aria:"Daily protein intake",min:0})}<div class="legend"><span>Protein (g)</span></div></div>
 <div class="card"><h2>Goal projection</h2>${goal>0?`<div class="row between"><div><div class="stat-label">GOAL WEIGHT</div><div class="big">${round(goal,1)} <span class="unit">kg</span></div></div><div class="pill">${latest?`${round(Math.abs(latest.kg-goal),1)} kg ${latest.kg>goal?"to lose":"to gain"}`:"No current weight"}</div></div><p>${esc(estimate)}</p>`:`<p class="muted">Set your goal weight in Settings to see an estimate.</p>`}<div class="notice">Estimates are mathematical projections from your logged weights, not promises. Water, food, illness and other factors can shift your weight. If your goal is below your current weight, avoid aggressive restriction.</div></div>
 <div class="card"><h2>Targets</h2><div class="grid"><div><div class="stat-label">DAILY CALORIES</div><div class="big">${calTarget}</div><div class="hint">kcal target</div></div><div><div class="stat-label">DAILY PROTEIN</div><div class="big">${proTarget}g</div><div class="hint">protein target</div></div></div>${btn("Edit targets","gosettings","primary")}</div>`;
}
function getWeekStart(date){const d=dateObj(date);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toLocaleDateString("en-CA")}
function renderWeekly(){
 const start=getWeekStart(today()),offset=weeklyOffset*7,weekStart=dateShift(start,offset),weekEnd=dateShift(weekStart,6);
 const days=Array.from({length:7},(_,i)=>dateShift(weekStart,i)),rows=dailyData(days);
 const logged=rows.filter(d=>d.foods.length>0),wts=allWeightSorted().filter(w=>w.date>=weekStart&&w.date<=weekEnd);
 const calorieAvg=avg(logged.map(d=>d.totals.calories)),proteinAvg=avg(logged.map(d=>d.totals.protein)),stepsAvg=avg(rows.map(d=>d.activity.steps));
 const startW=weightAtOrBefore(weekStart),endW=weightAtOrBefore(weekEnd),weightChange=startW&&endW?endW.kg-startW.kg:null;
 const consistency=Math.round((logged.length/7)*100);
 return `${pageTitle("Weekly report",`${fmtDate(weekStart)} – ${fmtDate(weekEnd)}`)}
 <div class="row between">${btn("← Previous","weekprev")}${btn("This week","weektoday")}${btn("Next →","weeknext",weeklyOffset>=0?"":"")}</div>
 <div class="grid">
 ${statCard("AVG CALORIES",calorieAvg===null?"—":Math.round(calorieAvg),"kcal",`${logged.length} days with food entries`)}
 ${statCard("AVG PROTEIN",proteinAvg===null?"—":round(proteinAvg),"g","On logged-food days")}

 </div>
 <div class="card"><div class="row between"><h2>Logging consistency</h2><div class="big">${consistency}%</div></div>${progressBar(logged.length,7)}<p class="hint">${logged.length} of 7 days have food entries. This measures logging, not how well you ate.</p></div>
 <div class="card"><h2>Daily breakdown</h2><div class="list">${rows.map(d=>`<div class="entry"><div class="grow"><div class="name">${dateObj(d.date).toLocaleDateString(undefined,{weekday:"short"})} · ${fmtDate(d.date)}</div><div class="sub">${d.foods.length} food entries · ${Math.round(d.activity.steps).toLocaleString()} steps · ${round(d.activity.water,1)}L water</div></div><div class="cal">${Math.round(d.totals.calories)} kcal<br><span class="sub">${round(d.totals.protein)}g protein</span></div></div>`).join("")}</div></div>
 <div class="card"><h2>Weekly notes</h2><p class="muted">Use this report to spot patterns, not to judge a single day. Incomplete food logs can make averages look lower than they really are.</p>${btn("Export this week's report","exportweek","primary")}</div>`;
}

function addFood(obj){
 const f={id:id(),date:obj.date||today(),name:String(obj.name||"Food"),calories:Math.max(0,num(obj.calories)),protein:Math.max(0,num(obj.protein)),meal:obj.meal||selectedMeal||"Snacks"};
 data.foods.push(f);save();searchResults=[];page="food";render();
}
function openManual(f=null,meal=null){
 const old=f||{};
 const currentMeal=meal||old.meal||selectedMeal||"Snacks";
 const html=`<div class="card"><div class="row between"><h2>${f?"Edit food":"Manual food entry"}</h2>${btn("Cancel","cancelmanual","small")}</div>
 <form id="manualForm" class="formgrid">
 <div class="wide"><label for="foodName">Food name</label><input id="foodName" required maxlength="160" value="${esc(old.name||"")}" placeholder="e.g. Chicken breast"></div>
 <div><label for="foodCalories">Calories (kcal)</label><input id="foodCalories" type="number" min="0" max="100000" step="1" required value="${old.calories??""}"></div>
 <div><label for="foodProtein">Protein (g)</label><input id="foodProtein" type="number" min="0" max="10000" step=".1" required value="${old.protein??""}"></div>
 <div><label for="foodMeal">Meal</label><select id="foodMeal">${["Breakfast","Lunch","Dinner","Snacks"].map(m=>`<option ${m===currentMeal?"selected":""}>${m}</option>`).join("")}</select></div>
 <div><label for="foodDate">Date</label><input id="foodDate" type="date" value="${old.date||today()}" required></div>
 <div class="wide"><label><input id="makeFavorite" type="checkbox" style="width:auto;margin-right:7px" ${data.favorites.includes(old.name)?"checked":""}> Save this food as a favourite</label></div>
 <div class="wide"><button class="btn primary full" type="submit">${f?"Save changes":"Add food"}</button></div>

 editingId=f?.id||null;

function closeManual(){const el=$("editorOverlay");if(el)el.remove();editingId=null}
function saveManual(form){
 const name=$("foodName").value.trim(),cal=num($("foodCalories").value,-1),pro=num($("foodProtein").value,-1),meal=$("foodMeal").value,date=$("foodDate").value;
 if(!name||cal<0||pro<0||!date){alert("Please enter a food name, valid nutrition values and date.");return}
 const f={id:editingId||id(),name,calories:cal,protein:pro,meal,date};
 if(editingId){const idx=data.foods.findIndex(x=>x.id===editingId);if(idx>=0)data.foods[idx]=f;else data.foods.push(f)}
 else data.foods.push(f);
 if($("makeFavorite").checked&&!data.favorites.includes(name))data.favorites.push(name);
 if(!$("makeFavorite").checked)data.favorites=data.favorites.filter(n=>n!==name);
 save();closeManual();page="food";render();

function saveWeight(date,kg){
 const existing=data.weights.find(w=>w.date===date);
 if(existing)existing.kg=kg;else data.weights.push({id:id(),date,kg});
 data.weights.sort((a,b)=>a.date.localeCompare(b.date));save();page="weight";render();
}
function exportJSON(){
 const payload={...data,exportedAt:new Date().toISOString(),app:"FuelTrack",version:2};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=`fueltrack-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function importJSON(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result);
   if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.foods)||!Array.isArray(parsed.weights)||typeof parsed.activity!=="object")throw new Error("This doesn't look like a FuelTrack backup.");
   if(!confirm(`Restore this backup? This replaces the current records in this browser.\n\nFood entries: ${parsed.foods.length}\nWeigh-ins: ${parsed.weights.length}\n\nExport a backup of the current data first if you need it.`))return;
   data=normalize(parsed);save();page="today";searchResults=[];render();alert("Backup restored. Please check your records.");
  }catch(e){alert("Couldn't restore this file: "+e.message)}
  $("importFile").value="";
 };
 reader.onerror=()=>alert("Could not read this file. Try selecting the JSON backup again.");
 reader.readAsText(file);
}
async function searchFood(query){
 const box=$("searchResults");if(box)box.innerHTML=empty("Searching…");
 try{
  const url="https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(query)+"&search_simple=1&action=process&json=1&page_size=12";
  const res=await fetch(url);if(!res.ok)throw new Error("Search service unavailable");
  const json=await res.json();
  searchResults=(json.products||[]).map(p=>{
   const n=p.nutriments||{};
   return {name:p.product_name||p.product_name_en||p.generic_name||"Unknown food",calories:num(n["energy-kcal_100g"],num(n["energy-kcal_value"],num(n["energy_100g"])/4.184)),protein:num(n.proteins_100g),barcode:p.code||""};
  }).filter(p=>p.name!=="Unknown food");
  if(box)box.innerHTML=searchResults.length?searchResults.map(searchRow).join(""):empty("No results found. Try another search or add the food manually.");
 }catch(e){if(box)box.innerHTML=empty("Food search couldn't connect. Check your internet connection or use manual entry.")}
}
async function lookupBarcode(code){
 const msg=$("scanMessage");if(msg)msg.textContent="Looking up barcode…";
 try{
  const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json");
  const j=await r.json();const p=j.product;
  if(!p)throw new Error("Product not found");
  const n=p.nutriments||{};
  const calories=num(n["energy-kcal_100g"],num(n["energy-kcal_value"],num(n["energy_100g"])/4.184));
  const protein=num(n.proteins_100g);
  if(!p.product_name&&!p.product_name_en)throw new Error("Product has no name");
  if(confirm(`Found: ${p.product_name||p.product_name_en}\nPer 100g: ${Math.round(calories)} kcal, ${round(protein,1)}g protein.\n\nAdd this food?`)){
   addFood({name:p.product_name||p.product_name_en,calories,protein,meal:selectedMeal});
  }else if(msg)msg.textContent="Scan cancelled.";
 }catch(e){if(msg)msg.textContent="Couldn't find that product. Try searching by name or enter it manually."}
}
async function startScanner(){
 if(!window.Html5Qrcode){alert("Scanner library couldn't load. Use food search or manual entry.");return}
 try{
  await stopScanner();
  scanner=new Html5Qrcode("scanner");
  $("scanMessage").textContent="Requesting camera access…";
  await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:150}},async decoded=>{
   await stopScanner();await lookupBarcode(decoded);
  },()=>{});
  $("scanMessage").textContent="Point your camera at the product barcode.";
 }catch(e){$("scanMessage").textContent="Camera unavailable or permission denied. Use search or manual entry."}
}
async function stopScanner(){
 if(scanner){try{if(scanner.isScanning)await scanner.stop();scanner.clear()}catch(e){}scanner=null}
}
function saveMeal(){
 const fs=dayFoods();if(!fs.length){alert("Log at least one food today before saving a meal.");return}
 const name=prompt("Name this saved meal:");
 if(!name||!name.trim())return;
 const totals=sumFoods(fs);
 data.savedMeals.push({id:id(),name:name.trim(),foods:fs.map(f=>({name:f.name,calories:f.calories,protein:f.protein,meal:f.meal||"Snacks"})),calories:totals.calories,protein:totals.protein});
 save();render();
}
function addSavedMeal(index){
 const meal=data.savedMeals[index];if(!meal)return;
 if(Array.isArray(meal.foods)&&meal.foods.length)meal.foods.forEach(f=>addFood({name:f.name,calories:f.calories,protein:f.protein,meal:f.meal||"Snacks"}));
 else addFood({name:meal.name,calories:meal.calories,protein:meal.protein,meal:selectedMeal});
}
function exportWeek(){

 const rows=dailyData(days);
 const report={app:"FuelTrack",type:"weekly-report",weekStart:start,weekEnd:days[6],days:rows.map(d=>({date:d.date,calories:d.totals.calories,protein:d.totals.protein,foodEntries:d.foods.length,steps:d.activity.steps,water:d.activity.water})),exportedAt:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(report,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=`fueltrack-week-${start}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);

function handleAction(action){
 const [type,...rest]=action.split(":");const val=rest.join(":");
 if(type==="gofood"){page="food";render()}
 else if(type==="goweight"){page="weight";render();$("weightKg")?.focus()}
 else if(type==="gosettings"){page="settings";render()}
 else if(type==="activityform"){page="today";render();$("steps")?.focus()}
 else if(type==="addmeal"){selectedMeal=val;page="food";render();openManual(null,val)}
 else if(type==="manualform"){openManual()}
 else if(type==="cancelmanual")closeManual()
 else if(type==="editfood"){const f=data.foods.find(f=>f.id===val);if(f)openManual(f)}
 else if(type==="deletefood"){if(confirm("Delete this food entry?")){data.foods=data.foods.filter(f=>f.id!==val);save();render()}}
 else if(type==="deleteweight"){if(confirm("Delete this weigh-in?")){data.weights=data.weights.filter(w=>w.id!==val);save();render()}}
 else if(type==="searchadd"){const p=searchResults[Number(val)];if(p)addFood({...p,meal:selectedMeal})}
 else if(type==="favadd"){const name=decodeURIComponent(val);openManual({name,calories:"",protein:"",meal:selectedMeal})}
 else if(type==="favremove"){const name=decodeURIComponent(val);data.favorites=data.favorites.filter(n=>n!==name);save();render()}
 else if(type==="savedmeal")addSavedMeal(Number(val))
 else if(type==="delsavedmeal"){if(confirm("Delete this saved meal?")){data.savedMeals.splice(Number(val),1);save();render()}}
 else if(type==="savemeal")saveMeal()
 else if(type==="export")exportJSON()
 else if(type==="import")$("importFile").click()
 else if(type==="theme"){setTheme(val)}
 else if(type==="startscan")startScanner()
 else if(type==="stopscan"){stopScanner();if($("scanMessage"))$("scanMessage").textContent="Scanner stopped."}
 else if(type==="weekprev"){weeklyOffset--;render()}
 else if(type==="weeknext"){if(weeklyOffset<0)weeklyOffset++;render()}
 else if(type==="weektoday"){weeklyOffset=0;render()}
 else if(type==="exportweek")exportWeek();
}
document.addEventListener("click",e=>{

 if(e.target.id==="foodSearchForm"){e.preventDefault();const q=$("foodSearch").value.trim();if(q)searchFood(q)}
});
load();theme();render();
