
<!DOCTYPE html>

<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#22252c;--text:#f5f6f8;--muted:#a1a6b2;--line:#30343d;--accent:#c084fc;--accentText:#240a3d;--red:#fb7185;--blue:#60a5fa;--shadow:0 10px 30px #0002}
:root[data-theme=light]{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--panel2:#edf0f4;--text:#181b22;--muted:#687080;--line:#dfe3e9;--accent:#7e22ce;--accentText:#fff;--red:#e11d48;--blue:#2563eb;--shadow:0 8px 25px #18202a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}
:root:not([data-theme=light]) body{background:linear-gradient(145deg,#08070D 0%,#171023 50%,#29113E 100%);background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
:root:not([data-theme=light]) header{background:rgba(10,8,15,.92);backdrop-filter:blur(14px);border-bottom-color:rgba(192,132,252,.18)}
.header-inner,.row,.between{display:flex;align-items:center;gap:10px}.header-inner,.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.brand{font-size:22px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--accent)}.version{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
main{max-width:760px;margin:auto;padding:18px 15px 30px}
nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 7px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:rgba(25,27,32,.97);border-top:1px solid var(--line);backdrop-filter:blur(18px)}
:root:not([data-theme=light]) nav{background:linear-gradient(135deg,rgba(16,11,24,.97),rgba(33,19,47,.97));border-top-color:#382547}
nav button{min-width:0;min-height:56px;border:1px solid transparent;background:transparent;color:var(--muted);padding:6px 1px;border-radius:12px;font-size:10px;line-height:1.2;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center}nav button .ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconbtn svg,.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}.iconbtn{display:inline-flex;align-items:center;justify-content:center;flex:none}nav button .nav-label{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.active{color:#E0C3FF;background:linear-gradient(135deg,#302044,#48245F);border-color:rgba(192,132,252,.22)}
:root[data-theme=light] nav{background:rgba(255,255,255,.97)}:root[data-theme=light] nav button.active{color:#6B21A8;background:#F3E8FF;border-color:#E9D5FF}
h1{font-size:27px;letter-spacing:-.8px;margin:5px 0 4px}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}p{margin:5px 0 12px}.muted,.hint{color:var(--muted)}.hint{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;min-width:0;box-shadow:var(--shadow);margin-bottom:12px}
:root:not([data-theme=light]) .card{background:linear-gradient(145deg,rgba(23,18,31,.96),rgba(33,21,46,.96));border-color:#382547;box-shadow:0 10px 30px #0003}
.big{font-size:28px;font-weight:850;letter-spacing:-1px;line-height:1.2}.unit{font-size:12px;color:var(--muted);font-weight:600}.stat-label{font-size:12px;color:var(--muted);margin-bottom:7px}.accent{color:var(--accent)}.red{color:var(--red)}.pill{display:inline-flex;align-items:center;background:var(--panel2);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0 6px}.progress>div{height:100%;background:linear-gradient(90deg,#7136C8,#C05CE8);border-radius:99px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:linear-gradient(135deg,#7136C8,#B14DDE);color:#fff;border-color:transparent}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.btn.full{width:100%}.iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:17px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px 12px;border-radius:11px;outline:none;min-width:0}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 6px}input[type=checkbox]{width:auto}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}
.entry{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:10px;min-width:0;margin:7px 0}.entry .name{font-weight:750;overflow-wrap:anywhere}.entry .sub{font-size:11px;color:var(--muted)}.entry .cal{font-size:13px;font-weight:800;white-space:nowrap}.mealhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:13px}.section{margin-top:23px}.notice{border-radius:12px;background:var(--panel2);padding:11px 12px;font-size:12px;color:var(--muted);margin:10px 0}.water-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.chart{display:block;width:100%;height:auto}.chartbox{padding:12px 6px 2px}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}details{background:var(--panel2);border-radius:12px;padding:12px;margin:10px 0}summary{font-weight:750;cursor:pointer}#scanner{width:100%;overflow:hidden;border-radius:12px;margin-top:10px}footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.nutrient-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.nutrient-row:last-child{border-bottom:0}.nutrient-name{font-weight:750}.nutrient-meta{font-size:11px;color:var(--muted)}.nutrient-amount{font-size:12px;font-weight:800;text-align:right}.nutrient-row .progress{grid-column:1/-1;margin:0;height:6px}.nutrient-group{margin-top:18px}.tag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--muted)}
@media(min-width:620px){nav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,760px);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0;padding-left:10px;padding-right:10px}}
@media(max-width:380px){main{padding-left:10px;padding-right:10px}.card{padding:12px}.big{font-size:24px}.three{gap:7px}.three .card{padding:10px}nav{padding-left:3px;padding-right:3px;gap:1px}nav button{font-size:9px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><div class="brand">Fuel<span>Track</span></div><div class="version">VERSION 3.2 · NUTRITION & FITNESS</div></div><button class="iconbtn" id="themeQuick" aria-label="Toggle theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button></div></header>
<main id="app" aria-live="polite"></main>
<nav id="nav" aria-label="Main navigation">
<button data-page="today" class="active"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5M9 21v-7h6v7"/></svg></span><span class="nav-label">Today</span></button>
<button data-page="food"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18M5 11a7 7 0 0 1 14 0M4 11v2a8 8 0 0 0 16 0v-2M7 18l-1 3m11-3 1 3"/><path d="M12 4V2"/></svg></span><span class="nav-label">Food</span></button>
<button data-page="nutrition"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg></span><span class="nav-label">Nutrition</span></button>
<button data-page="weight"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h17"/><path d="m7 15 4-4 3 2 6-7"/><path d="M15 6h5v5"/></svg></span><span class="nav-label">Weight</span></button>
<button data-page="progress"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9M10 20V4h4v16M16 20v-7h4v7"/></svg></span><span class="nav-label">Progress</span></button>
<button data-page="weekly"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M7 14h3m4 0h3m-10 3h3"/></svg></span><span class="nav-label">Weekly</span></button>
<button data-page="settings"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"/></svg></span><span class="nav-label">Settings</span></button>
</nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
"use strict";
const KEY="fueltrack-v1";
const nutrientDefs=[
 {key:"carbs",label:"Carbohydrates",unit:"g",group:"Macros",target:225},
 {key:"fat",label:"Total fat",unit:"g",group:"Macros",target:60},
 {key:"fiber",label:"Fibre",unit:"g",group:"Macros",target:30},
 {key:"saturatedFat",label:"Saturated fat",unit:"g",group:"Macros",target:20},
 {key:"sugar",label:"Sugars",unit:"g",group:"Macros",target:null},
 {key:"sodium",label:"Sodium",unit:"mg",group:"Minerals",target:2000},
 {key:"potassium",label:"Potassium",unit:"mg",group:"Minerals",target:3500},
 {key:"calcium",label:"Calcium",unit:"mg",group:"Minerals",target:1000},
 {key:"iron",label:"Iron",unit:"mg",group:"Minerals",target:14},
 {key:"magnesium",label:"Magnesium",unit:"mg",group:"Minerals",target:300},
 {key:"zinc",label:"Zinc",unit:"mg",group:"Minerals",target:10},
 {key:"vitaminA",label:"Vitamin A",unit:"µg",group:"Vitamins",target:800},
 {key:"vitaminC",label:"Vitamin C",unit:"mg",group:"Vitamins",target:80},
 {key:"vitaminD",label:"Vitamin D",unit:"µg",group:"Vitamins",target:10},
 {key:"vitaminE",label:"Vitamin E",unit:"mg",group:"Vitamins",target:12},
 {key:"vitaminB12",label:"Vitamin B12",unit:"µg",group:"Vitamins",target:2.4},
 {key:"folate",label:"Folate",unit:"µg",group:"Vitamins",target:200}
];
const nutrientDefaults=Object.fromEntries(nutrientDefs.filter(n=>n.target!==null).map(n=>[n.key,n.target]));
const defaults={targets:{calories:1800,protein:150,water:2.5,goalWeight:null,startWeight:null,nutrients:nutrientDefaults},foods:[],weights:[],activity:{},favorites:[],savedMeals:[],settings:{theme:"dark"}};
let data,page="today",searchResults=[],scanner=null,editingId=null,selectedMeal="Breakfast",weeklyOffset=0;
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const shift=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dateObj=s=>new Date(s+"T12:00:00");
const fmt=s=>dateObj(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const longDate=s=>dateObj(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const num=(v,f=0)=>v===null||v===undefined||v===""?f:(Number.isFinite(Number(v))?Number(v):f);
const round=(v,n=0)=>Number(num(v).toFixed(n));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
const pct=(v,t)=>t>0?Math.max(0,Math.min(100,v/t*100)):0;
const btn=(text,action,cls="")=>`<button class="btn ${cls}" data-action="${action}">${text}</button>`;
const empty=s=>`<div class="empty">${s}</div>`;
function normalize(raw){
 const d=raw&&typeof raw==="object"?raw:{};
 d.targets={...defaults.targets,...(d.targets||{})};
 d.targets.nutrients={...nutrientDefaults,...(d.targets?.nutrients||{})};
 d.foods=Array.isArray(d.foods)?d.foods:[];d.weights=Array.isArray(d.weights)?d.weights:[];d.activity=d.activity&&typeof d.activity==="object"?d.activity:{};
 d.foods=d.foods.map(f=>({...f,id:f.id||id(),date:f.date||today(),name:String(f.name||"Food"),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),meal:f.meal||"Snacks"}));
 d.weights=d.weights.map(w=>({...w,id:w.id||id(),date:w.date||today(),kg:num(w.kg)})).filter(w=>w.kg>0);
 for(const [date,a] of Object.entries(d.activity))d.activity[date]={steps:Math.max(0,num(a?.steps)),water:Math.max(0,num(a?.water))};
 d.favorites=Array.isArray(d.favorites)?d.favorites:[];d.savedMeals=Array.isArray(d.savedMeals)?d.savedMeals:[];d.settings={...defaults.settings,...(d.settings||{})};return d;
}
function load(){try{data=normalize(JSON.parse(localStorage.getItem(KEY)||"null")||defaults)}catch(e){data=normalize(defaults);alert("Saved data could not be read. Do not clear browser data; use your backup if needed.")}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("FuelTrack couldn't save. Export a backup and check browser storage.");return false}}
function theme(){document.documentElement.dataset.theme=data.settings.theme==="light"?"light":"dark";$("themeQuick").innerHTML=data.settings.theme==="light"?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';document.querySelector('meta[name="theme-color"]').content=data.settings.theme==="light"?"#f4f6f8":"#101114"}
function setTheme(v){data.settings.theme=v;save();theme();render()}
function foodsOn(date=today()){return data.foods.filter(f=>f.date===date)}
function totals(fs){return fs.reduce((a,f)=>({calories:a+num(f.calories),protein:a+num(f.protein)}),{calories:0,protein:0})}
function nutrientTotals(fs){const out={};for(const n of nutrientDefs){let sum=0,count=0;for(const f of fs){if(f.nutrients&&f.nutrients[n.key]!==null&&f.nutrients[n.key]!==undefined&&f.nutrients[n.key]!==""&&Number.isFinite(Number(f.nutrients[n.key]))){sum+=Math.max(0,Number(f.nutrients[n.key]));count++}}out[n.key]={value:sum,count,entries:fs.length}}return out}
function activity(date=today()){return data.activity[date]||{steps:0,water:0}}
function weightsSorted(){return [...data.weights].sort((a,b)=>a.date.localeCompare(b.date))}
function latestWeight(){return weightsSorted().slice(-1)[0]}
function weightBefore(date){return weightsSorted().filter(w=>w.date<=date).slice(-1)[0]}
function progressBar(v,t){return `<div class="progress"><div style="width:${pct(v,t)}%"></div></div>`}
function stat(label,value,unit="",sub=""){return `<div class="card"><div class="stat-label">${label}</div><div class="big">${value}<span class="unit"> ${unit}</span></div>${sub?`<div class="hint">${sub}</div>`:""}</div>`}
function ring(v,t){let p=pct(v,t),c=2*Math.PI*39;return `<div style="width:86px;flex:none;position:relative"><svg viewBox="0 0 100 100" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="39" fill="none" stroke="var(--panel2)" stroke-width="9"/><circle cx="50" cy="50" r="39" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:850">${Math.round(p)}%</div></div>`}
function title(t,s=""){return `<h1>${t}</h1>${s?`<p class="muted">${s}</p>`:""}`}
function chart(points,color="var(--accent)",label="Progress"){if(!points.length)return empty("Log some entries to see your chart.");const W=340,H=165,L=35,R=10,T=12,B=25,vals=points.map(p=>num(p.value));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}min=Math.max(0,min-(max-min)*.1);max+=(max-min)*.1;const x=i=>L+(points.length===1?(W-L-R)/2:i*(W-L-R)/(points.length-1)),y=v=>T+(H-T-B)-(v-min)/(max-min)*(H-T-B);const path=points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.value)).join(" ");const grid=[0,1,2,3].map(i=>{let v=min+(max-min)*i/3,yy=y(v);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${round(v,1)}</text>`}).join("");const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="3" fill="${color}"><title>${esc(p.label)}: ${round(p.value,1)}</title></circle>`).join("");const labels=points.map((p,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(p.label)}</text>`:"").join("");return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg></div>`}
function foodRow(f){return `<div class="entry"><div class="grow"><div class="name">${esc(f.name)} ${data.favorites.includes(f.name)?"★":""}</div><div class="sub">${esc(f.meal)} · ${round(f.protein,1)}g protein${f.date!==today()?" · "+fmt(f.date):""}${f.nutrients&&Object.values(f.nutrients).some(v=>v!==null&&v!==undefined&&v!=="")?" · nutrition details saved":""}</div></div><div class="cal">${Math.round(f.calories)} kcal</div><button class="iconbtn" data-action="editfood:${f.id}" aria-label="Edit food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L9 19l-5 1 1-5Z"/></svg></button><button class="iconbtn" data-action="deletefood:${f.id}" aria-label="Delete food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button></div>`}
function render(){theme();document.querySelectorAll("#nav button").forEach(b=>{const active=b.dataset.page===page;b.classList.toggle("active",active);if(active)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});const views={today:renderToday,food:renderFood,nutrition:renderNutrition,weight:renderWeight,progress:renderProgress,weekly:renderWeekly,settings:renderSettings};$("app").innerHTML=(views[page]||renderToday)()}
function renderToday(){const fs=foodsOn(),t=totals(fs),a=activity(),w=latestWeight(),ct=num(data.targets.calories,1800),pt=num(data.targets.protein,150),wt=num(data.targets.water,2.5),remain=ct-t.calories;const meals=["Breakfast","Lunch","Dinner","Snacks"].map(m=>{const list=fs.filter(f=>f.meal===m);return `<div class="mealhead"><strong>${m}</strong><span class="hint">${Math.round(totals(list).calories)} kcal</span>${btn("+ Add","addmeal:"+m,"small")}</div>${list.length?`<div>${list.map(foodRow).join("")}</div>`:empty("Nothing logged yet")}`}).join("");const nt=nutrientTotals(fs),recorded=nutrientDefs.filter(n=>nt[n.key].count>0).length;return `${title("Today",longDate(today()))}<div class="card"><div class="between"><div><div class="stat-label">CALORIES CONSUMED</div><div class="big">${Math.round(t.calories)} <span class="unit">/ ${ct} kcal</span></div><div class="hint ${remain<0?"red":"accent"}">${Math.round(Math.abs(remain))} kcal ${remain>=0?"remaining":"over target"}</div></div>${ring(t.calories,ct)}</div>${progressBar(t.calories,ct)}<hr><div class="between"><div><div class="stat-label">PROTEIN</div><div class="big">${round(t.protein)} <span class="unit">/ ${pt} g</span></div></div><div class="pill">${Math.round(pct(t.protein,pt))}% of goal</div></div>${progressBar(t.protein,pt)}</div><div class="grid three">${stat("STEPS",Math.round(a.steps).toLocaleString(),"","Today")}${stat("WATER",round(a.water,2),"L",`${Math.round(pct(a.water,wt))}% of ${wt}L goal`)}${stat("WEIGHT",w?round(w.kg,1):"—",w?"kg":"",w?fmt(w.date):"Log a weigh-in")}</div><div class="row wrap">${btn("＋ Log food","gofood","primary")}${btn("＋ Log weight","goweight")}${btn("Nutrition dashboard","gonutrition")}</div><div class="card section"><div class="between"><h2>Nutrition coverage</h2><span class="pill">${recorded}/${nutrientDefs.length} tracked</span></div><p class="hint">Only nutrients with actual values are counted. Unavailable food data is not assumed to be zero.</p>${btn("Review nutrients","gonutrition","primary")}</div><div class="section"><h2>Today's food</h2>${meals}</div><div class="section"><h2>Daily check-in</h2><div class="card"><h3>Steps</h3><form id="stepsForm"><label for="steps">Steps today</label><input id="steps" type="number" min="0" step="1" value="${a.steps}" required><button class="btn primary full" style="margin-top:10px">Save steps</button></form><hr><h3>Water</h3><div class="between"><strong>${round(a.water,2)} / ${wt} litres</strong><span class="pill">${Math.round(pct(a.water,wt))}%</span></div>${progressBar(a.water,wt)}<form id="waterForm"><label for="water">Water consumed so far (litres)</label><input id="water" type="number" min="0" step=".05" value="${a.water}" required><button class="btn primary full" style="margin-top:10px">Save water</button></form><div class="water-buttons"><button class="btn" data-action="wateradd:0.25">+250 ml</button><button class="btn" data-action="wateradd:0.5">+500 ml</button><button class="btn" data-action="wateradd:1">+1 litre</button></div></div></div><div class="notice">Food totals reflect what you log, not necessarily everything eaten.</div>`}
function nutrientRows(fs,editableTargets=false){const sums=nutrientTotals(fs);return ["Macros","Minerals","Vitamins"].map(group=>{const list=nutrientDefs.filter(n=>n.group===group);return `<div class="nutrient-group"><h3>${group}</h3>${list.map(n=>{const s=sums[n.key],target=data.targets.nutrients[n.key],known=s.count>0;return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${known?`${s.count} of ${fs.length} food entries provide this value`:`No recorded values yet`}</div></div><div class="nutrient-amount">${known?`${round(s.value,1)} ${n.unit}`:"—"}${target?`<div class="nutrient-meta">Goal ${round(target,1)} ${n.unit}</div>`:""}</div>${target?progressBar(known?s.value:0,target):""}</div>`}).join("")}</div>`}).join("")}
function renderNutrition(){const fs=foodsOn(),t=totals(fs),sums=nutrientTotals(fs),count=nutrientDefs.filter(n=>sums[n.key].count>0).length,groups=["Macros","Minerals","Vitamins"];return `${title("Advanced nutrition","Track macros, minerals and vitamins from foods with available data.")}<div class="card"><div class="between"><div><div class="stat-label">TODAY'S NUTRITION DATA</div><div class="big">${count}<span class="unit"> / ${nutrientDefs.length} nutrients</span></div><p class="hint">Nutrients recorded across today's ${fs.length} food entries.</p></div><span class="tag">LOCAL ONLY</span></div><div class="notice">A dash means no values were recorded for that nutrient. It does not mean zero intake. Targets are general tracking references, not individual medical advice.</div></div><div class="card"><h2>Macronutrients</h2><div class="grid">${stat("CARBOHYDRATES",sums.carbs.count?round(sums.carbs.value,1):"—",sums.carbs.count?"g":"",sums.carbs.count?`${sums.carbs.count} entries with data`:"No data available")}${stat("FAT",sums.fat.count?round(sums.fat.value,1):"—",sums.fat.count?"g":"",sums.fat.count?`${sums.fat.count} entries with data`:"No data available")}${stat("FIBRE",sums.fiber.count?round(sums.fiber.value,1):"—",sums.fiber.count?"g":"",sums.fiber.count?`${sums.fiber.count} entries with data`:"No data available")}${stat("SATURATED FAT",sums.saturatedFat.count?round(sums.saturatedFat.value,1):"—",sums.saturatedFat.count?"g":"",sums.saturatedFat.count?`${sums.saturatedFat.count} entries with data`:"No data available")}</div></div><div class="card"><h2>Daily nutrient overview</h2>${nutrientRows(fs)}</div><div class="card"><h2>7-day nutrition averages</h2><p class="hint">Averages include only days where at least one food entry supplied that nutrient. Days with no data are excluded.</p>${weeklyNutrientSummary()}</div><div class="card"><h2>Set nutrient targets</h2><p class="hint">Targets are editable reference values. Choose what you want to monitor; leave optional targets unchanged if they are not relevant to you.</p><form id="nutrientTargetsForm" class="formgrid">${nutrientDefs.filter(n=>n.target!==null).map(n=>`<div><label for="nt_${n.key}">${n.label} (${n.unit})</label><input id="nt_${n.key}" type="number" min="0" max="100000" step=".1" value="${esc(data.targets.nutrients[n.key]??n.target)}"></div>`).join("")}<div class="wide"><button class="btn primary full">Save nutrient targets</button></div></form></div><div class="card"><h2>Improve nutrient data</h2><p>When adding or editing food, enter nutrient values for the portion you actually ate. Food search can fill values available from Open Food Facts; packaged-food data may be incomplete or user-submitted.</p>${btn("Open food diary","gofood","primary")}</div>`}
function weeklyNutrientSummary(){const days=Array.from({length:7},(_,i)=>shift(today(),i-6)),totalsByKey={};for(const n of nutrientDefs){const vals=[];for(const d of days){const fs=foodsOn(d),sum=nutrientTotals(fs)[n.key];if(sum.count)vals.push(sum.value)}totalsByKey[n.key]={value:avg(vals),days:vals.length}}return ["Macros","Minerals","Vitamins"].map(g=>`<div class="nutrient-group"><h3>${g}</h3>${nutrientDefs.filter(n=>n.group===g).map(n=>{const s=totalsByKey[n.key];return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${s.days} of 7 days with data</div></div><div class="nutrient-amount">${s.value===null?"—":`${round(s.value,1)} ${n.unit}`}</div></div>`}).join("")}</div>`).join("")}
function renderFood(){const fs=foodsOn(),t=totals(fs);return `${title("Food diary","Search foods, scan barcodes, and record detailed nutrition.")}<div class="card"><div class="between"><div><div class="stat-label">TODAY'S INTAKE</div><div class="big">${Math.round(t.calories)} <span class="unit">kcal</span></div><div class="hint">${round(t.protein,1)}g protein · ${fs.length} entries</div></div>${btn("＋ Manual entry","manualform","primary")}</div></div><div class="card"><h2>Find a food</h2><form id="foodSearchForm"><div class="row"><input id="foodSearch" placeholder="Search food or brand…" required><button class="btn primary">Search</button></div></form><div id="searchResults" style="margin-top:10px">${searchResults.length?searchResults.map(searchRow).join(""):empty("Search Open Food Facts for packaged foods.")}</div><p class="hint">Where available, search results include macros and micronutrients per 100g. You can choose a gram amount.</p></div><div class="card"><h2>Barcode scanner</h2><p class="muted">Allow camera access to scan a food barcode.</p><div class="row wrap">${btn("Start scanner","startscan","primary")}${btn("Stop scanner","stopscan")}</div><div id="scanner"></div><div id="scanMessage" class="hint"></div></div><div class="card"><h2>Quick add</h2><div class="row wrap">${["Breakfast","Lunch","Dinner","Snacks"].map(m=>btn(m,"addmeal:"+m,"small")).join("")}</div>${btn("Copy yesterday's food","copyyesterday")}</div><div class="section"><h2>Today's entries</h2>${fs.length?fs.map(foodRow).join(""):empty("No food logged today yet.")}</div><div class="section"><h2>Favourites</h2>${data.favorites.length?data.favorites.map(n=>`<div class="entry"><div class="grow"><strong>★ ${esc(n)}</strong></div>${btn("Add","favadd:"+encodeURIComponent(n),"small primary")}${btn("Remove","favremove:"+encodeURIComponent(n),"small")}</div>`).join(""):empty("Favourite a food from its entry form.")}</div><div class="section"><h2>Saved meals</h2>${data.savedMeals.length?data.savedMeals.map((m,i)=>`<div class="entry"><div class="grow"><strong>${esc(m.name)}</strong><div class="sub">${Math.round(m.calories)} kcal · ${round(m.protein,1)}g protein</div></div>${btn("Add meal","savedmeal:"+i,"small primary")}${btn("×","delsavedmeal:"+i,"small")}</div>`).join(""):empty("Save today's foods as a reusable meal in Settings.")}</div>`}
function searchRow(p,i){return `<div class="entry"><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${Math.round(p.calories)} kcal · ${round(p.protein,1)}g protein per 100g</div></div>${btn("Add","searchadd:"+i,"small primary")}</div>`}
function renderWeight(){const ws=weightsSorted(),latest=ws.at(-1),first=ws[0],delta=ws.length>1?latest.kg-first.kg:null,recent=ws.filter(w=>w.date>=shift(today(),-6));return `${title("Weight","Record weigh-ins and follow your longer-term trend.")}<div class="grid">${stat("LATEST WEIGHT",latest?round(latest.kg,1):"—",latest?"kg":"",latest?fmt(latest.date):"Add your first weigh-in")}${stat("CHANGE SINCE FIRST",delta===null?"—":(delta>0?"+":"")+round(delta,1),delta===null?"":"kg",ws.length>1?`${fmt(first.date)} to ${fmt(latest.date)}`:"Need two weigh-ins")}</div><div class="card"><h2>Log a weigh-in</h2><form id="weightForm" class="formgrid"><div><label for="weightDate">Date</label><input type="date" id="weightDate" value="${today()}" required></div><div><label for="weightKg">Weight (kg)</label><input type="number" id="weightKg" min="1" max="500" step=".1" required></div><div class="wide"><button class="btn primary full">Save weight</button></div></form></div><div class="card"><h2>Weight trend</h2>${chart(ws.slice(-30).map(w=>({label:fmt(w.date),value:w.kg})),"var(--accent)","Weight trend in kg")}</div><div class="card"><h2>Seven-day average</h2><div class="big">${recent.length?round(avg(recent.map(w=>w.kg)),2):"—"} <span class="unit">kg</span></div><p class="hint">${recent.length} weigh-ins in the last seven days.</p></div><div class="card"><h2>Weight history</h2>${ws.length?[...ws].reverse().map(w=>`<div class="entry"><div class="grow">${longDate(w.date)}</div><strong>${round(w.kg,1)} kg</strong>${btn("×","deleteweight:"+w.id,"small")}</div>`).join(""):empty("No weigh-ins yet.")}</div>`}
function renderProgress(){const ws=weightsSorted(),latest=latestWeight(),goal=num(data.targets.goalWeight,0),start=ws[0],days=Array.from({length:14},(_,i)=>shift(today(),i-13)),series=days.map(d=>({date:d,totals:totals(foodsOn(d))})),logged=series.filter(d=>foodsOn(d.date).length),calavg=avg(logged.map(d=>d.totals.calories)),proavg=avg(logged.map(d=>d.totals.protein)),wateravg=avg(days.map(d=>activity(d).water)),stepsavg=avg(days.map(d=>activity(d).steps)),change=latest&&start?latest.kg-start.kg:null,goalGap=latest&&goal?latest.kg-goal:null;return `${title("Progress","A clearer view of your logged habits and trends.")}<div class="grid">${stat("CURRENT WEIGHT",latest?round(latest.kg,1):"—",latest?"kg":"")}${stat("CHANGE SINCE START",change===null?"—":(change>0?"+":"")+round(change,1),change===null?"":"kg",start?`Since ${fmt(start.date)}`:"Log weigh-ins")}${stat("14-DAY AVG CALORIES",calavg===null?"—":Math.round(calavg),"kcal",`${logged.length} days with food logs`)}${stat("14-DAY AVG PROTEIN",proavg===null?"—":round(proavg,1),"g","On logged-food days")}</div><div class="card"><h2>Weight trend</h2>${chart(ws.slice(-30).map(w=>({label:fmt(w.date),value:w.kg})),"var(--accent)","Weight trend")}</div><div class="card"><h2>Calories · last 14 days</h2>${chart(series.map(d=>({label:fmt(d.date),value:d.totals.calories})),"var(--blue)","Calorie intake")}<p class="hint">Days without food entries may be incomplete logs, not zero intake.</p></div><div class="card"><h2>Protein · last 14 days</h2>${chart(series.map(d=>({label:fmt(d.date),value:d.totals.protein})),"var(--accent)","Protein intake")}</div><div class="card"><h2>Steps and water · last 14 days</h2><div class="grid">${stat("AVERAGE STEPS",Math.round(stepsavg||0).toLocaleString(),"per day")}${stat("AVERAGE WATER",round(wateravg||0,2),"L per day")}</div></div><div class="card"><h2>Goal progress</h2>${goal>0?`<p>Goal weight: <strong>${round(goal,1)} kg</strong></p><p>${latest?`${round(Math.abs(goalGap),1)} kg ${goalGap>0?"above":"below"} goal weight`:"Log a weigh-in to see progress."}</p>`:"Set your goal weight in Settings."}<div class="notice">Weight projections and day-to-day changes are uncertain. Compare trends over several weeks.</div>${btn("Edit targets","gosettings","primary")}</div><div class="card"><h2>Nutrition insights</h2>${btn("View macro and micronutrient trends","gonutrition","primary")}</div>`}
function weekStart(s){const d=dateObj(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function renderWeekly(){const start=shift(weekStart(today()),weeklyOffset*7),days=Array.from({length:7},(_,i)=>shift(start,i)),rows=days.map(date=>({date,foods:foodsOn(date),totals:totals(foodsOn(date)),activity:activity(date)})),logged=rows.filter(d=>d.foods.length),cal=avg(logged.map(d=>d.totals.calories)),pro=avg(logged.map(d=>d.totals.protein)),water=avg(rows.filter(d=>d.activity.water>0).map(d=>d.activity.water)),steps=avg(rows.filter(d=>d.activity.steps>0).map(d=>d.activity.steps)),w1=weightBefore(start),w2=weightBefore(shift(start,6)),delta=w1&&w2?w2.kg-w1.kg:null,proteinDays=logged.filter(d=>d.totals.protein>=num(data.targets.protein,150)).length;return `${title("Weekly report",`${fmt(start)} – ${fmt(shift(start,6))}`)}<div class="between">${btn("← Previous","weekprev")}${btn("This week","weektoday")}${btn("Next →","weeknext")}</div><div class="grid">${stat("AVG CALORIES",cal===null?"—":Math.round(cal),"kcal",`${logged.length} logged days`)}${stat("AVG PROTEIN",pro===null?"—":round(pro,1),"g","Logged-food days")}${stat("AVG STEPS",steps===null?"—":Math.round(steps).toLocaleString(),"","Days with steps recorded")}${stat("WEIGHT CHANGE",delta===null?"—":(delta>0?"+":"")+round(delta,2),"kg","Nearest weigh-ins")}${stat("AVG WATER",water===null?"—":round(water,2),"L","Days with water recorded")}${stat("PROTEIN GOAL",`${proteinDays}/7`,"days","Days logged and target met")}</div><div class="card"><h2>Food logging consistency</h2><div class="big">${Math.round(logged.length/7*100)}%</div>${progressBar(logged.length,7)}<p class="hint">${logged.length} of 7 days have food entries. This measures logging, not food quality.</p></div><div class="card"><h2>Daily breakdown</h2>${rows.map(d=>`<div class="entry"><div class="grow"><div class="name">${dateObj(d.date).toLocaleDateString(undefined,{weekday:"short"})} · ${fmt(d.date)}</div><div class="sub">${d.foods.length} foods · ${Math.round(d.activity.steps).toLocaleString()} steps · ${round(d.activity.water,2)}L water</div></div><div class="cal">${Math.round(d.totals.calories)} kcal<br><span class="sub">${round(d.totals.protein,1)}g protein</span></div></div>`).join("")}</div><div class="card"><h2>Weekly nutrition data</h2><p class="hint">Average nutrient values on days with recorded data:</p>${weeklyNutrientSummary()}</div><div class="card"><h2>Weekly notes</h2><p class="muted">${logged.length<7?"Some days have no food entries. Weekly calorie averages may be misleading if logs are incomplete.":"Food entries are present for all seven days; check portions and completeness for accuracy."}</p>${btn("Export this week's report","exportweek","primary")}</div>`}

function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.foods)||!Array.isArray(parsed.weights)||!parsed.activity||typeof parsed.activity!=="object")throw new Error("This doesn't look like a complete FuelTrack backup.");if(parsed.foods.some(f=>!f||typeof f.name!=="string"||!Number.isFinite(Number(f.calories))||!Number.isFinite(Number(f.protein)))||parsed.weights.some(w=>!w||!Number.isFinite(Number(w.kg))||Number(w.kg)<=0))throw new Error("Some records have invalid data.");if(!confirm(`Restore this backup? This replaces the current records in this browser.\n\nFood entries: ${parsed.foods.length}\nWeigh-ins: ${parsed.weights.length}\n\nYour exported backup remains unchanged.`))return;data=normalize(parsed);if(save()){page="today";searchResults=[];render();alert("Backup restored. Check your records and targets.")}}catch(e){alert("Couldn't restore this file: "+e.message)}$("importFile").value=""};r.onerror=()=>alert("Could not read this file. Try selecting the JSON backup again.");r.readAsText(file)}
function mapNutrients(n){const x={};const keys={carbs:["carbohydrates_100g","carbohydrates_value"],fat:["fat_100g","fat_value"],fiber:["fiber_100g","fiber_value"],saturatedFat:["saturated-fat_100g","saturated-fat_value"],sugar:["sugars_100g","sugars_value"],sodium:["sodium_100g"],potassium:["potassium_100g"],calcium:["calcium_100g"],iron:["iron_100g"],magnesium:["magnesium_100g"],zinc:["zinc_100g"],vitaminA:["vitamin-a_100g"],vitaminC:["vitamin-c_100g"],vitaminD:["vitamin-d_100g"],vitaminE:["vitamin-e_100g"],vitaminB12:["vitamin-b12_100g"],folate:["folates_100g"]};for(const [key,aliases] of Object.entries(keys)){let v=null;for(const a of aliases){if(n[a]!==undefined&&n[a]!==null&&n[a]!==""&&Number.isFinite(Number(n[a]))){v=Number(n[a]);break}}if(v!==null){if(key==="sodium"||key==="potassium"||key==="calcium"||key==="iron"||key==="magnesium"||key==="zinc")v*=1000; x[key]=Math.max(0,v)}}return x}

xportweek")exportWeek()}

 function ensureActive(){if(!data.fitness.active)data.fitness.active={id:uid(),name:'My workout',date:today(),startedAt:new Date().toISOString(),exercises:[]};return data.fitness.active;}
 const fa=(label,action,classes='')=>`<button type="button" class="btn ${classes}" data-ft="${E(action)}">${label}</button>`;
 const rowSet=(e,s,i)=>`<div class="ft-set"><span>${i+1}</span><label><span class="hint">${e.timed?'Seconds':'Reps'}</span><input aria-label="${e.timed?'Seconds':'Reps'} for set ${i+1}" data-set="${E(e.id)}" data-index="${i}" data-field="reps" type="number" min="1" max="10000" step="1" value="${E(s.reps??'')}"></label><label><span class="hint">${e.equipment==='Bodyweight'?'Added kg':'Weight kg'}</span><input aria-label="Weight for set ${i+1}" data-set="${E(e.id)}" data-index="${i}" data-field="kg" type="number" min="0" max="2000" step=".5" value="${E(s.kg??'')}"></label><label class="ft-check"><input type="checkbox" aria-label="Set ${i+1} complete" data-set="${E(e.id)}" data-index="${i}" data-field="done" ${s.done?'checked':''}> Done</label>${fa('×','remove-set:'+e.id+':'+i,'small')}</div>`;
 function renderLibrary(){return `<div class="card"><h2>Exercise library</h2><input id="ft-query" aria-label="Search exercises" placeholder="Search exercises…" value="${E(query)}"><div class="formgrid"><div><label for="ft-kind">Training</label><select id="ft-kind"><option value="">All training</option>${['strength','cardio'].map(x=>`<option value="${x}" ${kind===x?'selected':''}>${x==='strength'?'Bodybuilding':'Cardio'}</option>`).join('')}</select></div><div><label for="ft-muscle">Muscle group</label><select id="ft-muscle"><option value="">All groups</option>${[...new Set(all().map(e=>e.muscle))].sort().map(x=>`<option ${muscle===x?'selected':''}>${E(x)}</option>`).join('')}</select></div><div><label for="ft-equipment">Equipment</label><select id="ft-equipment"><option value="">All equipment</option>${[...new Set(all().map(e=>e.equipment))].sort().map(x=>`<option ${equipment===x?'selected':''}>${E(x)}</option>`).join('')}</select></div><div><label><input id="ft-favs" type="checkbox" ${onlyFav?'checked':''}> Favourites only</label></div></div><div id="ft-results">${results()}</div></div><details><summary>Add your own exercise</summary><form id="ft-custom"><label for="ft-custom-name">Exercise name</label><input id="ft-custom-name" maxlength="100" required><div class="formgrid"><div><label for="ft-custom-type">Type</label><select id="ft-custom-type"><option value="strength">Bodybuilding</option><option value="cardio">Cardio</option></select></div><div><label for="ft-custom-muscle">Muscle group</label><input id="ft-custom-muscle" maxlength="40" placeholder="e.g. Chest" required></div></div><label for="ft-custom-equipment">Equipment</label><input id="ft-custom-equipment" maxlength="40" required><label for="ft-custom-cue">Your notes</label><textarea id="ft-custom-cue" maxlength="1000"></textarea><button class="btn primary full" style="margin-top:12px">Save exercise</button></form></details>`;}
 function results(){const list=all().filter(e=>(!kind||e.type===kind)&&(!muscle||e.muscle===muscle)&&(!equipment||e.equipment===equipment)&&(!onlyFav||data.fitness.favorites.includes(e.id))&&`${e.name} ${e.muscle} ${e.equipment}`.toLowerCase().includes(query.toLowerCase().trim()));return `<p class="hint">${list.length} exercises</p>${list.map(e=>`<div class="entry ft-exercise"><div class="grow"><strong>${E(e.name)}</strong><div class="sub">${E(e.muscle)} · ${E(e.equipment)}</div></div>${fa(data.fitness.favorites.includes(e.id)?'★':'☆','fav:'+e.id,'small')}${fa('Details','detail:'+e.id,'small')}${fa('+','add:'+e.id,'small primary')}</div>`).join('')||empty('No matching exercises. Change your filters or add your own.')}`;}
 function renderWorkout(){const a=data.fitness.active;if(!a)return `<div class="card"><h2>Start a workout</h2><p class="muted">Add exercises from the library or choose a routine. Log the load and repetitions you actually complete.</p>${fa('Start empty workout','start','primary')}</div>${renderRoutines()}`;return `<div class="card"><h2>Current workout</h2><label for="ft-workout-name">Workout name</label><input id="ft-workout-name" maxlength="100" value="${E(a.name)}"><label for="ft-workout-date">Date</label><input id="ft-workout-date" type="date" value="${E(a.date)}"><div class="row wrap" style="margin-top:12px">${fa('+ Add exercises','tab:library','primary')}${fa('Finish & save','finish','primary')}${fa('Discard','discard','danger')}</div></div><div class="card"><div class="between"><h2>Rest timer</h2><strong id="ft-timer" role="timer">${timerText()}</strong></div><div class="row wrap">${[60,90,120].map(s=>fa(s+' sec','rest:'+s,'small')).join('')}${fa('Stop','rest:0','small')}</div><p class="hint">Timer continues while you change tabs. Keep the app open to see it.</p></div>${a.exercises.map(e=>`<div class="card"><div class="between"><div><h2>${E(e.name)}</h2><p class="hint">${E(e.muscle)} · ${E(e.equipment)}</p></div>${fa('Remove','remove:'+e.id,'small danger')}</div>${e.type==='cardio'?`<div class="formgrid"><div><label>Duration (minutes)<input data-cardio="${E(e.id)}" data-field="minutes" type="number" min=".1" max="1440" step=".1" value="${E(e.minutes??'')}"></label></div><div><label>Distance (km, optional)<input data-cardio="${E(e.id)}" data-field="km" type="number" min="0" max="10000" step=".01" value="${E(e.km??'')}"></label></div></div><label>Session notes<input data-cardio="${E(e.id)}" data-field="notes" maxlength="500" placeholder="e.g. incline or resistance" value="${E(e.notes||'')}"></label>`:`<p class="hint">${e.timed?'Record hold duration in seconds.':'Dumbbells: enter the weight of one dumbbell. Barbell: total weight including the bar. Bodyweight: added weight, or 0.'}</p>${e.sets.map((s,i)=>rowSet(e,s,i)).join('')}${fa('+ Add set','set:'+e.id,'small')}`}<label>Exercise notes<textarea data-note="${E(e.id)}" maxlength="1000">${E(e.note||'')}</textarea></label></div>`).join('')||empty('Add an exercise to get started.')}`;}
 function renderRoutines(){return `<div class="card"><h2>Bodybuilding routines</h2><p class="hint">Editable starting templates. Each exercise starts with three blank sets.</p>${templates.map((t,i)=>`<div class="entry"><div class="grow"><strong>${E(t.name)}</strong><div class="sub">${t.ids.map(x=>E(find(x).name)).join(' · ')}</div></div>${fa('Start','routine:'+i,'small primary')}</div>`).join('')}</div>`;}
 const volume=e=>(e.sets||[]).filter(s=>s.done&&!e.timed).reduce((v,s)=>v+num(s.kg)*num(s.reps),0);
 function renderHistory(){const ss=[...data.fitness.sessions].sort((a,b)=>b.date.localeCompare(a.date)||String(b.finishedAt).localeCompare(String(a.finishedAt)));return ss.map(s=>`<div class="card"><div class="between"><div><h2>${E(s.name)}</h2><p class="hint">${E(s.date)} · ${s.exercises.length} exercises</p></div>${fa('Delete','delete:'+s.id,'small danger')}</div><details><summary>Session details</summary>${s.exercises.map(e=>`<div class="entry"><div class="grow"><strong>${E(e.name)}</strong><div class="sub">${e.type==='cardio'?`${round(e.minutes,1)} min${e.km!=null?' · '+round(e.km,2)+' km':''}`:(e.sets||[]).map(x=>e.timed?`${x.reps} sec`:`${x.reps} reps × ${x.kg} kg`).join(' / ')}${e.note?' · '+E(e.note):''}${e.notes?' · '+E(e.notes):''}</div></div></div>`).join('')}</details>${fa('Repeat exercises','repeat:'+s.id,'small')}</div>`).join('')||empty('Completed workouts appear here.');}
 function detailHTML(){const e=find(detail);if(!e)return '';const sessions=data.fitness.sessions.flatMap(s=>s.exercises.filter(x=>x.exerciseId===e.id).map(x=>({date:s.date,e:x}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<div class="card" id="ft-detail"><div class="between"><h2>${E(e.name)}</h2>${fa('Close','close','small')}</div><span class="pill">${E(e.muscle)} · ${E(e.equipment)}</span><p style="margin-top:12px">${E(e.cue||'Add your own technique notes.')}</p>${fa('Add to workout','add:'+e.id,'primary')}<h3 style="margin-top:18px">Recent sessions</h3>${sessions.map(s=>`<p class="hint">${E(s.date)} · ${s.e.type==='cardio'?round(s.e.minutes,1)+' min':(s.e.sets||[]).map(x=>e.timed?x.reps+' sec':x.reps+' × '+x.kg+' kg').join(' / ')}</p>`).join('')||'<p class="hint">No sessions recorded for this exercise.</p>'}</div>`;}
 function fitnessHTML(){return `${title('Fitness','Bodybuilding & cardio. Your exercises, your progress.')}<div class="grid">${stat('EXERCISE LIBRARY',all().length,'exercises')}${stat('COMPLETED WORKOUTS',data.fitness.sessions.length,'sessions')}</div><div class="tabs ft-tabs">${[['library','Exercises'],['workout','Workout'+(data.fitness.active?' •':'')],['routines','Routines'],['history','History']].map(([k,label])=>fa(label,'tab:'+k,tab===k?'primary':'')).join('')}</div>${detailHTML()}${tab==='library'?renderLibrary():tab==='workout'?renderWorkout():tab==='routines'?renderRoutines():renderHistory()}`;}
 const originalRender=render;
 render=function(){originalRender();if(page==='fitness')$('app').innerHTML=fitnessHTML();else if(page==='today')$('app').insertAdjacentHTML('beforeend',`<div class="card section"><h2>Fitness</h2><p class="hint">${data.fitness.sessions.filter(s=>s.date===today()).length} workouts logged today${data.fitness.active?' · workout in progress':''}.</p>${fa('Open fitness','open','primary')}</div>`);else if(page==='settings')$('app').insertAdjacentHTML('beforeend','<div class="notice">JSON backups also include your fitness history, exercise favourites, custom exercises and unfinished workout.</div>');};
 function snapshot(e){return {id:uid(),exerciseId:e.id,name:e.name,type:e.type,muscle:e.muscle,equipment:e.equipment,timed:!!e.timed,sets:e.type==='strength'?Array.from({length:3},()=>({reps:'',kg:'',done:false})):[],minutes:'',km:'',notes:'',note:''};}
 function redraw(){render();}
 function finish(){const a=data.fitness.active;if(!a)return;const exercises=[];for(const e of a.exercises){if(e.type==='cardio'){if(e.minutes==='')continue;if(!Number.isFinite(Number(e.minutes))||num(e.minutes)<=0||num(e.minutes)>1440||e.km!==''&&(!Number.isFinite(Number(e.km))||num(e.km)<0||num(e.km)>10000)){alert('Enter a valid cardio duration and distance.');return;}exercises.push({...e,minutes:Number(e.minutes),km:e.km===''?null:Number(e.km)});}else{const sets=e.sets.filter(s=>s.done);if(!sets.length)continue;if(sets.some(s=>s.reps===''||!Number.isInteger(Number(s.reps))||num(s.reps)<=0||num(s.reps)>10000||s.kg===''||!Number.isFinite(Number(s.kg))||num(s.kg)<0||num(s.kg)>2000)){alert('Completed sets need positive whole reps/seconds and a valid weight (0 for bodyweight).');return;}exercises.push({...e,sets:sets.map(s=>({reps:Number(s.reps),kg:Number(s.kg),done:true}))});}}if(!exercises.length){alert('Complete at least one set or enter a cardio duration before saving.');return;}if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||!a.name.trim()){alert('Enter a workout name and date.');return;}if(!confirm('Save completed sets and cardio sessions? Unchecked sets and cardio without a duration will be omitted.'))return;if(commit(()=>{data.fitness.sessions.push({...a,name:a.name.trim(),exercises,finishedAt:new Date().toISOString()});data.fitness.active=null;})){restEnd=0;tab='history';redraw();}}
 function handle(action){const [t,...p]=action.split(':');const v=p.join(':');if(t==='open'){page='fitness';detail=null;redraw();}else if(t==='tab'){tab=v;detail=null;redraw();}else if(t==='fav'){if(commit(()=>{const fs=data.fitness.favorites;data.fitness.favorites=fs.includes(v)?fs.filter(x=>x!==v):[...fs,v];}))redraw();}else if(t==='detail'){detail=v;redraw();$('ft-detail')?.scrollIntoView({block:'start',behavior:'smooth'});}else if(t==='close'){detail=null;redraw();}else if(t==='add'){const e=find(v);if(e&&commit(()=>ensureActive().exercises.push(snapshot(e)))){tab='workout';detail=null;redraw();}}else if(t==='start'){if(commit(()=>ensureActive())){tab='workout';redraw();}}else if(t==='routine'||t==='repeat'){if(data.fitness.active&&!confirm('Replace the unfinished workout?'))return;const template=t==='routine'?templates[Number(v)]:data.fitness.sessions.find(s=>s.id===v);if(!template)return;if(commit(()=>{data.fitness.active={id:uid(),name:template.name,date:today(),startedAt:new Date().toISOString(),exercises:t==='routine'?template.ids.map(x=>snapshot(find(x))):template.exercises.map(e=>({...snapshot(e),exerciseId:e.exerciseId}))};})){restEnd=0;tab='workout';redraw();}}else if(t==='set'){if(commit(()=>{const e=data.fitness.active?.exercises.find(e=>e.id===v);if(e)e.sets.push({reps:'',kg:'',done:false});}))redraw();}else if(t==='remove-set'){if(commit(()=>{const e=data.fitness.active?.exercises.find(e=>e.id===p[0]);if(e)e.sets.splice(Number(p[1]),1);}))redraw();}else if(t==='remove'){if(confirm('Remove this exercise and its current sets?')&&commit(()=>{data.fitness.active.exercises=data.fitness.active.exercises.filter(e=>e.id!==v);}))redraw();}else if(t==='discard'){if(confirm('Discard this unfinished workout?')&&commit(()=>{data.fitness.active=null;})){restEnd=0;redraw();}}else if(t==='delete'){if(confirm('Delete this workout from history?')&&commit(()=>{data.fitness.sessions=data.fitness.sessions.filter(s=>s.id!==v);}))redraw();}else if(t==='finish')finish();else if(t==='rest'){restEnd=num(v)>0?Date.now()+num(v)*1000:0;updateTimer();}}
 function timerText(){if(!restEnd)return 'Ready';const sec=Math.max(0,Math.ceil((restEnd-Date.now())/1000));return sec?`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`:'Rest complete';}
 function updateTimer(){const el=$('ft-timer');if(el)el.textContent=timerText();}
 setInterval(updateTimer,500);
 // Capture extension events before the original global handlers.
 document.addEventListener('click',e=>{const b=e.target.closest('[data-ft]');if(b){e.preventDefault();e.stopImmediatePropagation();handle(b.dataset.ft);}},true);
 document.addEventListener('input',e=>{if(e.target.id==='ft-query'){query=e.target.value;$('ft-results').innerHTML=results();}});
 document.addEventListener('change',e=>{const el=e.target;if(['ft-kind','ft-muscle','ft-equipment','ft-favs'].includes(el.id)){kind=$('ft-kind').value;muscle=$('ft-muscle').value;equipment=$('ft-equipment').value;onlyFav=$('ft-favs').checked;$('ft-results').innerHTML=results();return;}const a=data.fitness.active;if(!a)return;let success=true;if(el.dataset.set)success=commit(()=>{const s=a.exercises.find(x=>x.id===el.dataset.set)?.sets[Number(el.dataset.index)];if(s)s[el.dataset.field]=el.dataset.field==='done'?el.checked:el.value;});else if(el.dataset.cardio)success=commit(()=>{const x=a.exercises.find(x=>x.id===el.dataset.cardio);if(x)x[el.dataset.field]=el.value;});else if(el.dataset.note)success=commit(()=>{const x=a.exercises.find(x=>x.id===el.dataset.note);if(x)x.note=el.value;});else if(el.id==='ft-workout-name')success=commit(()=>{a.name=el.value;});else if(el.id==='ft-workout-date')success=commit(()=>{a.date=el.value;});if(!success)redraw();});
 document.addEventListener('submit',e=>{if(e.target.id!=='ft-custom')return;e.preventDefault();e.stopImmediatePropagation();const name=$('ft-custom-name').value.trim(),type=$('ft-custom-type').value,muscle=$('ft-custom-muscle').value.trim(),equipment=$('ft-custom-equipment').value.trim(),cue=$('ft-custom-cue').value.trim();if(!name||!muscle||!equipment)return;if(commit(()=>data.fitness.custom.push({id:'custom-'+uid(),name,type,muscle:type==='cardio'?'Cardio':muscle,equipment,cue,timed:false})))redraw();},true);
 const style=document.createElement('style');style.id='ft-fitness-style';style.textContent=`nav{grid-template-columns:repeat(8,minmax(0,1fr))}.ft-tabs{margin:14px 0}.ft-set{display:grid;grid-template-columns:18px 1fr 1fr auto auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ft-set label{margin:0}.ft-set input[type=number]{padding:9px 6px}.ft-check{display:flex;align-items:center;gap:4px}.ft-exercise{flex-wrap:wrap}.ft-exercise .grow{flex-basis:150px}#ft-detail{scroll-margin-top:95px}@media(max-width:400px){nav button{font-size:9px}.ft-set{gap:5px;font-size:12px}.ft-set .hint{font-size:10px}}`;document.head.appendChild(style);
 const navButton=document.createElement('button');navButton.dataset.page='fitness';navButton.innerHTML='<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M3 10v4m15-6v8m3-6v4M6 12h12"/></svg></span><span class="nav-label">Fitness</span>';
 $('nav').insertBefore(navButton,$('nav').querySelector('[data-page="nutrition"]'));
 redraw();
})();

</script>
</body>
