let data,page="today",searchResults=[],scanner=null,editingId=null,selectedMeal="Breakfast",weeklyOffset=0;
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const shift=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dateObj=s=>new Date(s+"T12:00:00");
const fmt=s=>dateObj(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const longDate=s=>dateObj(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const num=(v,f=0)=>v===null||v===undefined||v===""?f:(Number.isFinite(Number(v))?Number(v):f);
const round=(v,n=0)=>Number(num(v).toFixed(n));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
const pct=(v,t)=>t>0?Math.max(0,Math.min(100,v/t*100)):0;
const btn=(text,action,cls="")=>`<button class="btn ${cls}" data-action="${action}">${text}</button>`;
const empty=s=>`<div class="empty">${s}</div>`;
function normalize(raw){
 const d=raw&&typeof raw==="object"?raw:{};
 d.targets={...defaults.targets,...(d.targets||{})};
 d.targets.nutrients={...nutrientDefaults,...(d.targets?.nutrients||{})};
 d.foods=Array.isArray(d.foods)?d.foods:[];d.weights=Array.isArray(d.weights)?d.weights:[];d.activity=d.activity&&typeof d.activity==="object"?d.activity:{};
 d.foods=d.foods.map(f=>({...f,id:f.id||id(),date:f.date||today(),name:String(f.name||"Food"),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),meal:f.meal||"Snacks"}));
 d.weights=d.weights.map(w=>({...w,id:w.id||id(),date:w.date||today(),kg:num(w.kg)})).filter(w=>w.kg>0);
 for(const [date,a] of Object.entries(d.activity))d.activity[date]={steps:Math.max(0,num(a?.steps)),water:Math.max(0,num(a?.water))};
 d.favorites=Array.isArray(d.favorites)?d.favorites:[];d.savedMeals=Array.isArray(d.savedMeals)?d.savedMeals:[];d.settings={...defaults.settings,...(d.settings||{})};d.fitness=Fitness.normalize(d.fitness);return d;
}
function load(){try{data=normalize(JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(JSON.stringify(defaults)))}catch(e){data=normalize(JSON.parse(JSON.stringify(defaults)));alert("Saved data could not be read. Do not clear browser data; use your backup if needed.")}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("FuelTrack couldn't save. Export a backup and check browser storage.");return false}}
function theme(){document.documentElement.dataset.theme=data.settings.theme==="light"?"light":"dark";$("themeQuick").innerHTML=data.settings.theme==="light"?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';document.querySelector('meta[name="theme-color"]').content=data.settings.theme==="light"?"#f5f5f8":"#111319"}
function setTheme(v){data.settings.theme=v;save();theme();render()}
function foodsOn(date=today()){return data.foods.filter(f=>f.date===date)}
function totals(fs){return fs.reduce((a,f)=>({calories:a+num(f.calories),protein:a+num(f.protein)}),{calories:0,protein:0})}
function nutrientTotals(fs){const out={};for(const n of nutrientDefs){let sum=0,count=0;for(const f of fs){if(f.nutrients&&f.nutrients[n.key]!==null&&f.nutrients[n.key]!==undefined&&f.nutrients[n.key]!==""&&Number.isFinite(Number(f.nutrients[n.key]))){sum+=Math.max(0,Number(f.nutrients[n.key]));count++}}out[n.key]={value:sum,count,entries:fs.length}}return out}
function activity(date=today()){return data.activity[date]||{steps:0,water:0}}
function weightsSorted(){return [...data.weights].sort((a,b)=>a.date.localeCompare(b.date))}
function latestWeight(){return weightsSorted().slice(-1)[0]}
function weightBefore(date){return weightsSorted().filter(w=>w.date<=date).slice(-1)[0]}
function progressBar(v,t){return `<div class="progress"><div style="width:${pct(v,t)}%"></div></div>`}
function stat(label,value,unit="",sub=""){return `<div class="card"><div class="stat-label">${label}</div><div class="big">${value}<span class="unit"> ${unit}</span></div>${sub?`<div class="hint">${sub}</div>`:""}</div>`}

function ring(v,t){const p=pct(v,t),c=2*Math.PI*43;return `<div style="width:116px;flex:none;position:relative" aria-label="${Math.round(p)} percent of calorie target"><svg viewBox="0 0 100 100" style="display:block;transform:rotate(-90deg)"><circle cx="50" cy="50" r="43" fill="none" stroke="var(--panel2)" stroke-width="6"/><circle cx="50" cy="50" r="43" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><strong style="font-size:22px;letter-spacing:-.6px">${Math.round(p)}%</strong><span style="font-size:10px;color:var(--muted)">of daily target</span></div></div>`;}

function title(t,s=''){return `<div class="page-heading"><div><p class="eyebrow">Your daily rhythm</p><h1>${t}</h1>${s?`<p class="muted">${s}</p>`:''}</div></div>`;}
function chart(points,color="var(--accent)",label="Progress"){if(!points.length)return empty("Log some entries to see your chart.");const W=340,H=165,L=35,R=10,T=12,B=25,vals=points.map(p=>num(p.value));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}min=Math.max(0,min-(max-min)*.1);max+=(max-min)*.1;const x=i=>L+(points.length===1?(W-L-R)/2:i*(W-L-R)/(points.length-1)),y=v=>T+(H-T-B)-(v-min)/(max-min)*(H-T-B);const path=points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.value)).join(" ");const grid=[0,1,2,3].map(i=>{let v=min+(max-min)*i/3,yy=y(v);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${round(v,1)}</text>`}).join("");const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="3" fill="${color}"><title>${esc(p.label)}: ${round(p.value,1)}</title></circle>`).join("");const labels=points.map((p,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(p.label)}</text>`:"").join("");return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg></div>`}
function foodRow(f){return `<div class="entry"><div class="grow"><div class="name">${esc(f.name)} ${data.favorites.includes(f.name)?"★":""}</div><div class="sub">${esc(f.meal)} · ${round(f.protein,1)}g protein${f.date!==today()?" · "+fmt(f.date):""}${f.nutrients&&Object.values(f.nutrients).some(v=>v!==null&&v!==undefined&&v!=="")?" · nutrition details saved":""}</div></div><div class="cal">${Math.round(f.calories)} kcal</div><button class="iconbtn" data-action="editfood:${f.id}" aria-label="Edit food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L9 19l-5 1 1-5Z"/></svg></button><button class="iconbtn" data-action="deletefood:${f.id}" aria-label="Delete food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button></div>`}

function render(){if(scanner)stopScanner();theme();if(page==='nutrition'){page='food';foodView='nutrition';}if(page==='weight'||page==='weekly'){progressView=page;page='progress';}document.querySelectorAll('#nav button').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('settingsButton').setAttribute('aria-pressed',String(page==='settings'));const views={today:renderToday,food:renderFoodHub,fitness:Fitness.render,progress:renderProgressHub,settings:renderSettings};$('app').innerHTML=(views[page]||renderToday)();}

function renderToday(){const fs=foodsOn(),t=totals(fs),a=activity(),nt=nutrientTotals(fs),w=latestWeight(),ct=num(data.targets.calories,1800),pt=num(data.targets.protein,150),wt=num(data.targets.water,2.5),left=ct-t.calories,training=data.fitness.active,todaySessions=data.fitness.sessions.filter(s=>s.date===today());const macro=(label,value,target,known=true)=>`<div><div class="stat-label">${label}</div><strong>${known?round(value):'—'} <span class="unit">g</span></strong>${progressBar(value,target)}<p class="hint">${known?`of ${target}g`:'No data yet'}</p></div>`;return `${title('Make today count.',longDate(today()))}<div class="dashboard-grid"><section class="card hero-card"><div class="section-head"><h2>Daily nutrition</h2><span class="pill accent">${fs.length} entries logged</span></div><div class="hero-main"><div><div class="stat-label">Calories consumed</div><div class="hero-value">${Math.round(t.calories)} <span class="unit">kcal</span></div><p class="hint" style="margin-top:9px"><strong class="${left<0?'red':'accent'}">${Math.round(Math.abs(left))} kcal ${left<0?'over target':'remaining'}</strong> · ${ct} target</p></div>${ring(t.calories,ct)}</div><div class="macro-grid">${macro('Protein',t.protein,pt)}${macro('Carbs',nt.carbs.value,num(data.targets.nutrients.carbs,225),!!nt.carbs.count)}${macro('Fat',nt.fat.value,num(data.targets.nutrients.fat,60),!!nt.fat.count)}</div><div style="margin-top:22px">${uiButton(icon('plus')+' Log food','foodtool:search','primary full')}</div></section><section class="card"><div class="section-head"><h2>Daily check-in</h2><span class="pill">Today</span></div><div class="row"><div class="mini-icon">${icon('water')}</div><div class="grow"><div class="stat-label">Water</div><div class="big">${round(a.water,2)} <span class="unit">/ ${wt} L</span></div></div><span class="pill green">${Math.round(pct(a.water,wt))}%</span></div>${progressBar(a.water,wt)}<div class="water-buttons">${btn('+250 ml','wateradd:0.25','small')}${btn('+500 ml','wateradd:0.5','small')}${uiButton('Edit','wateredit','small')}</div><hr><div class="checkin-row"><div class="row"><div class="mini-icon">${icon('steps')}</div><div><strong>${Math.round(a.steps).toLocaleString()}</strong><div class="hint">Steps today</div></div></div>${uiButton('Update','stepsedit','small')}</div><div class="checkin-row"><div class="row"><div class="mini-icon">${icon('weight')}</div><div><strong>${w?round(w.kg,1)+' kg':'No weigh-in'}</strong><div class="hint">${w?'Latest · '+fmt(w.date):'Track your longer-term trend'}</div></div></div>${uiButton('Log','progressview:weight','small')}</div></section></div><div class="training-banner"><div><p class="eyebrow">Training</p><h2>${training?'Your session is ready to continue':todaySessions.length?'Workout logged. Keep building.':'A little stronger, one session at a time.'}</h2><p class="hint">${training?esc(training.name)+' · '+training.exercises.length+' exercises':todaySessions.length?todaySessions.length+' session'+(todaySessions.length>1?'s':'')+' recorded today':'Choose a routine, log your sets, or make time for cardio.'}</p></div>${uiButton(training?'Continue workout':todaySessions.length?'Open training':'Start a workout','training','primary')}</div><div class="grid section"><section class="card"><div class="section-head"><h2>Meals today</h2>${uiButton('View diary','foodview:diary','small ghost')}</div>${['Breakfast','Lunch','Dinner','Snacks'].map(m=>{const list=fs.filter(f=>f.meal===m);return `<div class="meal-summary"><div class="grow"><strong>${m}</strong><p class="hint">${list.length?list.length+' food'+(list.length>1?'s':'')+' logged':'Not logged yet'}</p></div><span class="cal">${list.length?Math.round(totals(list).calories)+' kcal':'—'}</span>${btn('+ Add','addmeal:'+m,'small')}</div>`}).join('')}</section><section class="card"><div class="section-head"><h2>Your next step</h2>${icon('progress')}</div><p class="muted">Small, consistent entries make your progress easier to see.</p><div class="checkin-row"><div><strong>Nutrition detail</strong><p class="hint" style="margin:3px 0 0">${nutrientDefs.filter(n=>nt[n.key].count).length} of ${nutrientDefs.length} nutrients recorded today</p></div>${uiButton('View','foodview:nutrition','small')}</div><div class="checkin-row"><div><strong>Weekly review</strong><p class="hint" style="margin:3px 0 0">Food, water, steps and training together.</p></div>${uiButton('View','progressview:weekly','small')}</div><p class="hint" style="margin:17px 0 0">Your totals reflect recorded entries. Missing data is never a complete picture of your day.</p></section></div><div class="grid today-checkins"><details id="checkin-water" class="checkin-details"><summary>Edit water total</summary><form id="waterForm"><label for="water">Water consumed today (litres)</label><input id="water" type="number" min="0" step=".05" value="${a.water}" required><button class="btn primary full form-actions">Save water</button></form></details><details id="checkin-steps" class="checkin-details"><summary>Edit step count</summary><form id="stepsForm"><label for="steps">Steps today</label><input id="steps" type="number" min="0" step="1" value="${a.steps}" required><button class="btn primary full form-actions">Save steps</button></form></details></div>`;}
function nutrientRows(fs,editableTargets=false){const sums=nutrientTotals(fs);return ["Macros","Minerals","Vitamins"].map(group=>{const list=nutrientDefs.filter(n=>n.group===group);return `<div class="nutrient-group"><h3>${group}</h3>${list.map(n=>{const s=sums[n.key],target=data.targets.nutrients[n.key],known=s.count>0;return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${known?`${s.count} of ${fs.length} food entries provide this value`:`No recorded values yet`}</div></div><div class="nutrient-amount">${known?`${round(s.value,1)} ${n.unit}`:"—"}${target?`<div class="nutrient-meta">Goal ${round(target,1)} ${n.unit}</div>`:""}</div>${target?progressBar(known?s.value:0,target):""}</div>`}).join("")}</div>`}).join("")}

function renderNutrition(){const fs=foodsOn(diaryDate),sums=nutrientTotals(fs),count=nutrientDefs.filter(n=>sums[n.key].count).length;return `<div class="date-row"><p class="hint" style="margin:0">Nutrient detail for ${diaryDate===today()?'today':fmt(diaryDate)}</p><input type="date" id="diaryDate" aria-label="Nutrition date" value="${diaryDate}"></div><div class="card"><div class="section-head"><h2>Nutrition coverage</h2><span class="pill accent">${count}/${nutrientDefs.length} nutrients</span></div><p class="hint">A dash means there is no recorded value. Totals can be incomplete when some foods lack nutrient data.</p><div class="metric-strip" style="margin-bottom:0">${metric('Carbohydrates',sums.carbs.count?round(sums.carbs.value,1):'—','g')}${metric('Fat',sums.fat.count?round(sums.fat.value,1):'—','g')}${metric('Fibre',sums.fiber.count?round(sums.fiber.value,1):'—','g')}</div></div><div class="card"><h2>Daily nutrient overview</h2>${nutrientRows(fs)}</div><details><summary>Last seven days · nutrient averages</summary><p class="hint">Averages cover the seven days ending today and only include days with recorded values.</p>${weeklyNutrientSummary()}</details><details><summary>Edit nutrient targets</summary><p class="hint">These are editable tracking references. Set a target to 0 to hide its progress bar.</p>${nutrientTargetForm()}</details>`;}
function weeklyNutrientSummary(days=Array.from({length:7},(_,i)=>shift(today(),i-6))){const totalsByKey={};for(const n of nutrientDefs){const vals=[];for(const d of days){const fs=foodsOn(d),sum=nutrientTotals(fs)[n.key];if(sum.count)vals.push(sum.value)}totalsByKey[n.key]={value:avg(vals),days:vals.length}}return ["Macros","Minerals","Vitamins"].map(g=>`<div class="nutrient-group"><h3>${g}</h3>${nutrientDefs.filter(n=>n.group===g).map(n=>{const s=totalsByKey[n.key];return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${s.days} of 7 days with data</div></div><div class="nutrient-amount">${s.value===null?"—":`${round(s.value,1)} ${n.unit}`}</div></div>`}).join("")}</div>`).join("")}

function renderFood(){const fs=foodsOn(diaryDate),t=totals(fs);return `<div class="date-row"><div class="row"><input id="diaryDate" type="date" aria-label="Food diary date" value="${diaryDate}">${diaryDate!==today()?uiButton('Today','diarytoday','small'):''}</div>${uiButton(icon('plus')+' Add food','foodtool:search','primary')}</div><div class="metric-strip">${metric('Calories',Math.round(t.calories),'kcal','Target '+data.targets.calories)}${metric('Protein',round(t.protein,1),'g','Target '+data.targets.protein+'g')}${metric('Entries',fs.length,'foods',diaryDate===today()?'Today':fmt(diaryDate))}</div>${foodTools()}<div class="grid">${['Breakfast','Lunch','Dinner','Snacks'].map(m=>{const list=fs.filter(f=>f.meal===m);return `<section class="card"><div class="mealhead"><div><strong>${m}</strong><p class="hint" style="margin:3px 0 0">${Math.round(totals(list).calories)} kcal</p></div>${btn('+ Add','addmeal:'+m,'small')}</div>${list.length?list.map(foodRow).join(''):'<p class="meal-empty">Nothing logged for this meal yet.</p>'}</section>`}).join('')}</div>${diaryDate===today()?`<details><summary>Diary shortcuts</summary><div class="row wrap">${btn('Copy yesterday’s food','copyyesterday')}${btn('Save today as a meal','savemeal')}${uiButton('Open saved foods','foodview:saved')}</div></details>`:''}`;}
function searchRow(p,i){return `<div class="entry"><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${Math.round(p.calories)} kcal · ${round(p.protein,1)}g protein per 100g</div></div>${btn("Add","searchadd:"+i,"small primary")}</div>`}

function renderWeight(){const ws=weightsSorted(),recent=ws.filter(w=>w.date>=shift(today(),-6)&&w.date<=today()),latest=ws.filter(w=>w.date<=today()).at(-1);return `<div class="grid"><section class="card"><div class="section-head"><h2>Log a weigh-in</h2><span class="pill">kg</span></div><form id="weightForm" class="formgrid"><div><label for="weightDate">Date</label><input type="date" id="weightDate" value="${today()}" required></div><div><label for="weightKg">Weight (kg)</label><input type="number" id="weightKg" min="1" max="500" step=".1" placeholder="e.g. 80.5" required></div><div class="wide form-actions"><button class="btn primary full">Save weight</button></div></form></section><section class="card"><h2>Latest snapshot</h2><div class="metric-strip" style="grid-template-columns:1fr 1fr;margin-bottom:0">${metric('Latest',latest?round(latest.kg,1):'—','kg',latest?fmt(latest.date):'No entries yet')}${metric('7-day average',recent.length?round(avg(recent.map(w=>w.kg)),1):'—','kg',recent.length+' weigh-ins')}</div></section></div><section class="card section"><h2>Weight history</h2>${ws.length?[...ws].reverse().map(w=>`<div class="entry"><div class="grow"><strong>${longDate(w.date)}</strong></div><span class="cal">${round(w.kg,1)} kg</span>${btn('Delete','deleteweight:'+w.id,'small danger')}</div>`).join(''):empty('Add your first weigh-in. Your records and trends will appear here.')}</section>`;}

function renderProgress(){const ws=weightsSorted().filter(w=>w.date<=today()),latest=ws.at(-1),start=num(data.targets.startWeight)||ws[0]?.kg,change=latest&&start?latest.kg-start:null,days=Array.from({length:14},(_,i)=>shift(today(),i-13)),logged=days.filter(d=>foodsOn(d).length),ca=avg(logged.map(d=>totals(foodsOn(d)).calories)),pa=avg(logged.map(d=>totals(foodsOn(d)).protein)),sessions=data.fitness.sessions.filter(s=>s.date>=days[0]&&s.date<=today()),goal=num(data.targets.goalWeight);return `<div class="metric-strip">${metric('Avg calories',ca===null?'—':Math.round(ca),'kcal',logged.length+' logged days / 14')}${metric('Avg protein',pa===null?'—':round(pa,1),'g','On logged-food days')}${metric('Training',sessions.length,'sessions','In the last 14 days')}</div><div class="grid"><div class="card"><div class="section-head"><h2>Weight trend</h2>${uiButton('Log weight','progressview:weight','small')}</div><div class="between"><div class="big">${latest?round(latest.kg,1):'—'} <span class="unit">kg</span></div><span class="pill">${change===null?'No trend yet':(change>0?'+':'')+round(change,1)+' kg since start'}</span></div>${chart(ws.slice(-30).map(w=>({label:fmt(w.date),value:w.kg})),'var(--accent)','Weight trend in kilograms')}</div><div class="card"><h2>Your goal</h2>${goal?`<div class="big">${round(goal,1)} <span class="unit">kg</span></div><p class="hint" style="margin-top:10px">${latest?latest.kg===goal?'You are at your recorded goal weight.':round(Math.abs(latest.kg-goal),1)+' kg '+(latest.kg>goal?'above':'below')+' your goal.':'Add a weigh-in to see your progress.'}</p>`:'<p class="muted">Set a goal weight to put your trend in context.</p>'}${uiButton('Edit targets','settings','small')}<hr><h3>Logging consistency</h3><div class="big">${logged.length}<span class="unit"> / 14 days</span></div>${progressBar(logged.length,14)}<p class="hint">Days with at least one food entry.</p></div><div class="card"><h2>Calories · logged days</h2>${chart(logged.map(d=>({label:fmt(d),value:totals(foodsOn(d)).calories})),'var(--blue)','Calories on logged days')}<p class="hint">Last 14 days. Missing days are excluded; points are spaced by entry.</p></div><div class="card"><h2>Protein · logged days</h2>${chart(logged.map(d=>({label:fmt(d),value:totals(foodsOn(d)).protein})),'var(--accent)','Protein on logged days')}<p class="hint">Last 14 days. A logged day can still be incomplete.</p></div></div>`;}
function weekStart(s){const d=dateObj(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

function renderHistory(){const ss=[...data.fitness.sessions].sort((a,b)=>b.date.localeCompare(a.date)||String(b.finishedAt).localeCompare(String(a.finishedAt)));return `<div class="section-head"><h2>Completed sessions</h2><span class="pill">${ss.length} total</span></div>${ss.length?ss.map(s=>{const sets=s.exercises.reduce((n,e)=>n+(e.type==='strength'?(e.sets||[]).length:0),0),mins=s.exercises.reduce((n,e)=>n+(e.type==='cardio'?num(e.minutes):0),0);return `<article class="card history-card"><div class="section-head"><h2>${E(s.name)}</h2><span class="pill">${E(s.date)}</span></div><div class="history-meta"><span>${s.exercises.length} exercises</span><span>${sets} sets</span>${mins?`<span>${round(mins,1)} min cardio</span>`:''}</div><details><summary>View session</summary>${s.exercises.map(e=>`<div class="entry"><div class="grow"><div class="name">${E(e.name)}</div><div class="sub">${e.type==='cardio'?`${round(e.minutes,1)} min${e.km!=null?' · '+round(e.km,2)+' km':''}`:(e.sets||[]).map(x=>e.timed?`${x.reps} sec`:`${x.reps} reps × ${x.kg} kg`).join(' / ')}${e.note?' · '+E(e.note):''}${e.notes?' · '+E(e.notes):''}</div></div></div>`).join('')}</details><div class="between">${fa('Repeat exercises','repeat:'+s.id,'small')}${fa('Delete','delete:'+s.id,'small danger')}</div></article>`}).join(''):empty('<strong>Your training story starts here.</strong>Finish a session and it will appear in your history.')}`;}
 function detailHTML(){const e=find(detail);if(!e)return '';const sessions=data.fitness.sessions.flatMap(s=>s.exercises.filter(x=>x.exerciseId===e.id).map(x=>({date:s.date,e:x}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<div class="card" id="ft-detail"><div class="between"><h2>${E(e.name)}</h2>${fa('Close','close','small')}</div><span class="pill">${E(e.muscle)} · ${E(e.equipment)}</span><p style="margin-top:12px">${E(e.cue||'Add your own technique notes.')}</p>${fa('Add to workout','add:'+e.id,'primary')}<h3 style="margin-top:18px">Recent sessions</h3>${sessions.map(s=>`<p class="hint">${E(s.date)} · ${s.e.type==='cardio'?round(s.e.minutes,1)+' min':(s.e.sets||[]).map(x=>e.timed?x.reps+' sec':x.reps+' × '+x.kg+' kg').join(' / ')}</p>`).join('')||'<p class="hint">No sessions recorded for this exercise.</p>'}</div>`;}

function fitnessHTML(){return `${title('Training','Build strength. Make time for movement.')}<div class="tabs ft-tabs" aria-label="Training navigation">${[['workout',data.fitness.active?'Session •':'Session'],['library','Exercises'],['history','History']].map(([k,label])=>fa(label,'tab:'+k,tab===k?'primary':'')).join('')}</div>${detailHTML()}${tab==='library'?renderLibrary():tab==='history'?renderHistory():renderWorkout()}`;}
 function snapshot(e){return {id:uid(),exerciseId:e.id,name:e.name,type:e.type,muscle:e.muscle,equipment:e.equipment,timed:!!e.timed,sets:e.type==='strength'?Array.from({length:3},()=>({reps:'',kg:'',done:false})):[],minutes:'',km:'',notes:'',note:''};}
 function redraw(){render();}
 function finish(){const a=data.fitness.active;if(!a)return;const exercises=[];for(const e of a.exercises){if(e.type==='cardio'){if(e.minutes==='')continue;if(!Number.isFinite(Number(e.minutes))||num(e.minutes)<=0||num(e.minutes)>1440||e.km!==''&&(!Number.isFinite(Number(e.km))||num(e.km)<0||num(e.km)>10000)){alert('Enter a valid cardio duration and distance.');return;}exercises.push({...e,minutes:Number(e.minutes),km:e.km===''?null:Number(e.km)});}else{const sets=e.sets.filter(s=>s.done);if(!sets.length)continue;if(sets.some(s=>s.reps===''||!Number.isInteger(Number(s.reps))||num(s.reps)<=0||num(s.reps)>10000||s.kg===''||!Number.isFinite(Number(s.kg))||num(s.kg)<0||num(s.kg)>2000)){alert('Completed sets need positive whole reps/seconds and a valid weight (0 for bodyweight).');return;}exercises.push({...e,sets:sets.map(s=>({reps:Number(s.reps),kg:Number(s.kg),done:true}))});}}if(!exercises.length){alert('Complete at least one set or enter a cardio duration before saving.');return;}if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||!a.name.trim()){alert('Enter a workout name and date.');return;}if(!confirm('Save completed sets and cardio sessions? Unchecked sets and cardio without a duration will be omitted.'))return;if(commit(()=>{data.fitness.sessions.push({...a,name:a.name.trim(),exercises,finishedAt:new Date().toISOString()});data.fitness.active=null;})){restEnd=0;tab='history';redraw();}}
 function handle(action){const [t,...p]=action.split(':');const v=p.join(':');if(t==='more'){visibleCount+=12;$('ft-results').innerHTML=results();}else if(t==='open'){page='fitness';detail=null;redraw();}else if(t==='tab'){tab=v;detail=null;redraw();}else if(t==='fav'){if(commit(()=>{const fs=data.fitness.favorites;data.fitness.favorites=fs.includes(v)?fs.filter(x=>x!==v):[...fs,v];}))redraw();}else if(t==='detail'){detail=v;redraw();$('ft-detail')?.scrollIntoView({block:'start',behavior:'smooth'});}else if(t==='close'){detail=null;redraw();}else if(t==='add'){const e=find(v);if(e&&commit(()=>ensureActive().exercises.push(snapshot(e)))){tab='workout';detail=null;redraw();}}else if(t==='start'){if(commit(()=>ensureActive())){tab='workout';redraw();}}else if(t==='routine'||t==='repeat'){if(data.fitness.active&&!confirm('Replace the unfinished workout?'))return;const template=t==='routine'?templates[Number(v)]:data.fitness.sessions.find(s=>s.id===v);if(!template)return;if(commit(()=>{data.fitness.active={id:uid(),name:template.name,date:today(),startedAt:new Date().toISOString(),exercises:t==='routine'?template.ids.map(x=>snapshot(find(x))):template.exercises.map(e=>({...snapshot(e),exerciseId:e.exerciseId}))};})){restEnd=0;tab='workout';redraw();}}else if(t==='set'){if(commit(()=>{const e=data.fitness.active?.exercises.find(e=>e.id===v);if(e)e.sets.push({reps:'',kg:'',done:false});}))redraw();}else if(t==='remove-set'){if(commit(()=>{const e=data.fitness.active?.exercises.find(e=>e.id===p[0]);if(e)e.sets.splice(Number(p[1]),1);}))redraw();}else if(t==='remove'){if(confirm('Remove this exercise and its current sets?')&&commit(()=>{data.fitness.active.exercises=data.fitness.active.exercises.filter(e=>e.id!==v);}))redraw();}else if(t==='discard'){if(confirm('Discard this unfinished workout?')&&commit(()=>{data.fitness.active=null;})){restEnd=0;redraw();}}else if(t==='delete'){if(confirm('Delete this workout from history?')&&commit(()=>{data.fitness.sessions=data.fitness.sessions.filter(s=>s.id!==v);}))redraw();}else if(t==='finish')finish();else if(t==='rest'){restEnd=num(v)>0?Date.now()+num(v)*1000:0;updateTimer();}}
 function timerText(){if(!restEnd)return 'Ready';const sec=Math.max(0,Math.ceil((restEnd-Date.now())/1000));return sec?`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`:'Rest complete';}
 function updateTimer(){const el=$('ft-timer');if(el)el.textContent=timerText();}
 setInterval(updateTimer,500);
 // Capture extension events before the original global handlers.
 document.addEventListener('click',e=>{const b=e.target.closest('[data-ft]');if(b){e.preventDefault();e.stopImmediatePropagation();handle(b.dataset.ft);}},true);
 document.addEventListener('input',e=>{if(e.target.id==='ft-query'){query=e.target.value;visibleCount=12;$('ft-results').innerHTML=results();}});
 document.addEventListener('change',e=>{const el=e.target;if(['ft-kind','ft-muscle','ft-equipment','ft-favs'].includes(el.id)){kind=$('ft-kind').value;muscle=$('ft-muscle').value;equipment=$('ft-equipment').value;onlyFav=$('ft-favs').checked;visibleCount=12;$('ft-results').innerHTML=results();return;}const a=data.fitness.active;if(!a)return;let success=true;if(el.dataset.set)success=commit(()=>{const s=a.exercises.find(x=>x.id===el.dataset.set)?.sets[Number(el.dataset.index)];if(s)s[el.dataset.field]=el.dataset.field==='done'?el.checked:el.value;});else if(el.dataset.cardio)success=commit(()=>{const x=a.exercises.find(x=>x.id===el.dataset.cardio);if(x)x[el.dataset.field]=el.value;});else if(el.dataset.note)success=commit(()=>{const x=a.exercises.find(x=>x.id===el.dataset.note);if(x)x.note=el.value;});else if(el.id==='ft-workout-name')success=commit(()=>{a.name=el.value;});else if(el.id==='ft-workout-date')success=commit(()=>{a.date=el.value;});if(!success)redraw();});
 document.addEventListener('submit',e=>{if(e.target.id!=='ft-custom')return;e.preventDefault();e.stopImmediatePropagation();const name=$('ft-custom-name').value.trim(),type=$('ft-custom-type').value,muscle=$('ft-custom-muscle').value.trim(),equipment=$('ft-custom-equipment').value.trim(),cue=$('ft-custom-cue').value.trim();if(!name||!muscle||!equipment)return;if(commit(()=>data.fitness.custom.push({id:'custom-'+uid(),name,type,muscle:type==='cardio'?'Cardio':muscle,equipment,cue,timed:false})))redraw();},true);
 return {render:fitnessHTML,normalize:normalizeFitness,open(view='workout'){tab=view;detail=null;page='fitness';render();}};
})();
load();theme();render();

</script>
