{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.datebar h1{font-size:24px;letter-spacing:-.7px;margin:0}.datebar p{margin:3px 0 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;padding:0 0 12px;margin-bottom:8px;scrollbar-width:none}.tab{white-space:nowrap;display:flex;align-items:center;gap:7px;padding:10px 13px;color:var(--muted)}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:750}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);min-width:0}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.card h2,.card h3{margin:0;font-size:16px;letter-spacing:-.2px}.sub{color:var(--muted);font-size:12px}.muted{color:var(--muted)}.hero{background:linear-gradient(135deg,#3b2360,#221735 70%);border-color:#68429a}.hero .sub{color:#d4c3ed}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.hero h2{font-size:18px}.calbig{font-size:42px;font-weight:850;letter-spacing:-1.8px;line-height:1.1;margin:12px 0 4px}.calbig small{font-size:14px;font-weight:500;letter-spacing:0;color:#d4c3ed}.progress{height:8px;background:color-mix(in srgb,var(--muted) 18%,transparent);border-radius:99px;overflow:hidden;margin:9px 0}.progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}.hero .progress>i{background:#e9d5ff}.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.macro{padding:12px;background:#ffffff0c;border:1px solid #ffffff12;border-radius:14px}.macro b{display:block;font-size:18px}.macro small{color:#d4c3ed;font-size:11px}.macro .progress{height:5px}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:14px;background:var(--panel2);border-radius:14px;border:1px solid var(--line)}.stat .value{font-size:24px;font-weight:800;letter-spacing:-.6px}.stat .label{color:var(--muted);font-size:12px}.stat .hint{font-size:11px;margin-top:5px}.meal{padding:13px 0;border-bottom:1px solid var(--line)}.meal:last-child{border:0;padding-bottom:0}.mealhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.mealhead strong{font-size:14px}.foodline{display:flex;align-items:center;gap:10px;padding:9px 0}.foodemoji{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:19px;flex-shrink:0}.foodinfo{flex:1;min-width:0}.foodinfo strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foodinfo small{color:var(--muted);font-size:11px}.foodcal{text-align:right;font-weight:750;font-size:13px;white-space:nowrap}.foodcal small{display:block;color:var(--muted);font-weight:400;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.smallbtn{padding:6px 9px;font-size:12px;border-radius:9px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px}input[type=checkbox]{width:auto;accent-color:var(--accent)}.inlinefield{display:flex;gap:8px}.inlinefield>*:first-child{flex:1;min-width:0}.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:11px;color:var(--muted)}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.empty .emoji{font-size:28px;margin-bottom:8px}.section-title{font-size:22px;letter-spacing:-.6px;margin:0 0 4px}.section-desc{margin:0 0 17px;color:var(--muted);font-size:13px}.water-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.water-buttons button{padding:12px 4px}.water-buttons b{display:block}.water-buttons small{font-size:10px;color:var(--muted)}.chart{width:100%;height:210px;display:block}.chart text{fill:var(--muted);font-size:10px}.chart .gridline{stroke:var(--line);stroke-width:1}.chart .line{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:var(--accent);opacity:.12}.chart .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}.daylist{display:grid;gap:8px}.dayrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px;background:var(--panel2);border-radius:12px}.dayrow .dayname{font-size:12px;color:var(--muted)}.dayrow b{font-size:13px}.dayrow .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.dayrow .bar i{display:block;height:100%;background:var(--accent)}.workout-exercise{border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0}.setrow{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:7px;align-items:center;margin-top:7px}.setrow input{padding:8px}.setrow .setnum{text-align:center;color:var(--muted);font-size:12px}.badge{font-size:10px;border-radius:99px;padding:4px 7px;background:#6ee7b720;color:var(--good)}.notice{padding:12px;border-radius:12px;background:#8b5cf61a;border:1px solid #8b5cf640;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--line);margin:15px 0}.modalback{position:fixed;inset:0;background:#0009;z-index:30;display:grid;place-items:center;padding:14px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:19px;width:min(540px,100%);max-height:90dvh;overflow:auto;box-shadow:0 24px 70px #0007}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:18px}.toast{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:90vw;font-size:13px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:none;justify-content:space-around}.bottomnav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center;padding:4px}.bottomnav button span{font-size:19px}.bottomnav button.active{color:var(--accent)}.checkrow{display:flex;gap:9px;align-items:center;font-size:13px}.settingsrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.settingsrow:last-child{border:0}.settingsrow strong{display:block;font-size:13px}.settingsrow small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tablewrap{overflow:auto}.simpletable{width:100%;border-collapse:collapse;font-size:12px}.simpletable th,.simpletable td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.simpletable th{color:var(--muted);font-weight:600}.red{color:var(--bad)}.green{color:var(--good)}

</style></head>
<body><header><div class="brand"><div class="logo">F</div><div>FuelTrack<small>TRAIN · FUEL · PROGRESS</small></div></div><div class="header-actions"><button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☼</button><button class="iconbtn" id="quickAddBtn" title="Quick add" aria-label="Quick add">＋</button></div></header><main class="wrap"><div class="datebar"><div><h1 id="greeting">Today</h1><p id="dateLabel"></p></div><div class="actions"><button class="btn ghost" id="prevDay">‹</button><button class="btn ghost" id="todayBtn">Today</button><button class="btn ghost" id="nextDay">›</button></div></div><nav class="tabs" id="tabs"></nav><div id="app"></div></main><nav class="bottomnav" id="bottomnav"></nav><div id="modalroot"></div><div id="toastroot"></div>
<script>
(()=>{'use strict';
const KEY='fueltrack-v1', $=id=>document.getElementById(id), today=()=>dateISO(new Date()), dateISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, parseDate=s=>{const [y,m,d]=String(s||today()).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12)}, shift=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return dateISO(d)}, fmtDate=(s,opt={weekday:'short',day:'numeric',month:'short'})=>parseDate(s).toLocaleDateString('en-GB',opt), num=v=>{const n=Number(v);return Number.isFinite(n)?n:0}, clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), round=(n,d=1)=>Math.round(num(n)*10**d)/10**d, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), kcal=n=>Math.round(num(n)), pretty=n=>Number(num(n).toFixed(1)).toLocaleString('en-GB'), dateTime=()=>new Date().toISOString();
const defaults={targets:{calories:2200,protein:160,carbs:250,fat:70,water:2.5,steps:8000,goalWeight:null,startWeight:null},foods:[],weights:[],activity:{},workouts:[],measurements:[],savedMeals:[],favorites:[],theme:'dark',profile:{goal:'muscle',units:'kg'}};
let data, page='Today', selectedDate=today(), weekOffset=0, searchTimer=null, scanner=null;
function normalize(raw){const d={...structuredClone(defaults),...(raw||{})};d.targets={...defaults.targets,...(raw?.targets||{})};d.profile={...defaults.profile,...(raw?.profile||{})};d.foods=Array.isArray(d.foods)?d.foods:[];d.weights=Array.isArray(d.weights)?d.weights:[];d.activity=d.activity&&typeof d.activity==='object'?d.activity:{};d.workouts=Array.isArray(d.workouts)?d.workouts:[];d.measurements=Array.isArray(d.measurements)?d.measurements:[];d.savedMeals=Array.isArray(d.savedMeals)?d.savedMeals:[];d.favorites=Array.isArray(d.favorites)?d.favorites:[];
// Migrate v2/v3 string favourites to safe structured templates when possible.
const favNames=new Set(d.favorites.filter(x=>typeof x==='string'));d.favorites=d.favorites.filter(x=>x&&typeof x==='object'&&x.name);for(const name of favNames){const old=d.foods.slice().reverse().find(f=>f.name===name);d.favorites.push(old?{id:uid(),name:old.name,calories:old.calories,protein:old.protein,carbs:old.carbs||0,fat:old.fat||0,serving:old.serving||'1 serving'}:{id:uid(),name,calories:0,protein:0,carbs:0,fat:0,serving:'1 serving'});}
// Keep existing activity values and make newly introduced fields safe.
for(const [day,a] of Object.entries(d.activity)){if(a&&typeof a==='object')d.activity[day]={steps:Math.max(0,num(a.steps)),water:Math.max(0,num(a.water))};else d.activity[day]={steps:0,water:0};}
// Normalize existing food records without discarding fields or IDs.
d.foods=d.foods.map(f=>({...f,id:f.id||uid(),date:f.date||today(),meal:f.meal||'Other',name:String(f.name||'Food'),serving:f.serving||'1 serving',quantity:Math.max(.01,num(f.quantity)||1),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),carbs:Math.max(0,num(f.carbs)),fat:Math.max(0,num(f.fat))}));d.weights=d.weights.map(w=>({...w,id:w.id||uid(),date:w.date||today(),kg:Math.max(0,num(w.kg))})).filter(w=>w.kg>0);d.workouts=d.workouts.map(w=>({...w,id:w.id||uid(),date:w.date||today(),exercises:Array.isArray(w.exercises)?w.exercises:[]}));return d;}
function load(){try{const raw=localStorage.getItem(KEY);return normalize(raw?JSON.parse(raw):null)}catch(e){return normalize(null)}}data=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Could not save: your browser storage may be full. Export a backup.');return false}}
function toast(msg){$('toastroot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('toastroot').innerHTML='',2600)}
function activity(date=selectedDate){return data.activity[date]||{steps:0,water:0}}
function foods(date=selectedDate){return data.foods.filter(f=>f.date===date)}
function totals(list){return list.reduce((t,f)=>{t.calories+=num(f.calories);t.protein+=num(f.protein);t.carbs+=num(f.carbs);t.fat+=num(f.fat);return t},{calories:0,protein:0,carbs:0,fat:0})}
function target(k){return Math.max(0,num(data.targets[k]))}
function pct(v,t){return t>0?clamp(v/t*100,0,100):0}
function bar(v,t,extra=''){return `<div class="progress ${extra}"><i style="width:${pct(v,t)}%"></i></div>`}
function foodMacroRows(t){return `<div class="macro-grid">${[['Protein','protein','g'],['Carbs','carbs','g'],['Fat','fat','g']].map(([l,k,u])=>`<div class="macro"><small>${l}</small><b>${pretty(t[k])}<small> / ${pretty(target(k))}${u}</small></b>${bar(t[k],target(k))}</div>`).join('')}</div>`}
function nav(){const items=[['Today','⌂'],['Food','◉'],['Train','▣'],['Weight','↗'],['Progress','◌'],['Weekly','▤'],['Settings','⚙']];$('tabs').innerHTML=items.map(([p,i])=>`<button class="tab ${page===p?'active':''}" data-page="${p}">${i} ${p}</button>`).join('');$('bottomnav').innerHTML=items.filter(([p])=>['Today','Food','Train','Weight','Progress'].includes(p)).map(([p,i])=>`<button class="${page===p?'active':''}" data-page="${p}"><span>${i}</span>${p}</button>`).join('')}
function foodRow(f){return `<div class="foodline"><div class="foodemoji">${f.source==='barcode'?'▦':'🍽️'}</div><div class="foodinfo"><strong>${esc(f.name)}</strong><small>${esc(f.serving||'serving')} · ${pretty(f.protein)}g protein · ${pretty(f.carbs||0)}g carbs</small></div><div class="foodcal">${kcal(f.calories)}<small>kcal</small></div><button class="smallbtn" data-action="editfood" data-id="${esc(f.id)}" aria-label="Edit food">✎</button><button class="smallbtn" data-action="deletefood" data-id="${esc(f.id)}" aria-label="Delete food">×</button></div>`}
function mealHTML(name,list){return `<div class="meal"><div class="mealhead"><strong>${name}</strong><span class="sub">${kcal(totals(list).calories)} kcal</span></div>${list.length?list.map(foodRow).join(''):`<div class="sub">Nothing logged yet</div>`}<div style="margin-top:8px"><button class="smallbtn" data-action="addfood" data-meal="${name}">＋ Add food</button></div></div>`}
function dailyForm(a){return `<form id="activityForm" class="formgrid"><div class="field"><label for="steps">Steps today</label><input id="steps" name="steps" type="number" min="0" step="1" value="${num(a.steps)}"></div><div class="field"><label for="water">Water (litres)</label><input id="water" name="water" type="number" min="0" step="0.1" value="${num(a.water)}"></div><div class="field full"><button class="btn primary" type="submit">Save daily check-in</button></div></form><div class="water-buttons"><button class="btn" data-action="wateradd" data-amount="0.25">💧 <b>+250 ml</b><small>Water</small></button><button class="btn" data-action="wateradd" data-amount="0.5">💧 <b>+500 ml</b><small>Water</small></button><button class="btn" 
data-action="wateradd" data-amount="1">💧 <b>+1 litre</b><small>Water</small></button></div>`}
function renderToday(){const fs=foods(),t=totals(fs),a=activity(),w=latestWeight(selectedDate),work=data.workouts.filter(x=>x.date===selectedDate),remain=target('calories')-t.calories;return `<div class="grid"><section class="card hero span8"><div class="hero-top"><div><h2>Daily fuel</h2><div class="sub">${selectedDate===today()?'Fuel your next session.':fmtDate(selectedDate,{weekday:'long',day:'numeric',month:'long'})}</div></div><span class="pill">${remain>=0?`${kcal(remain)} kcal left`:`${kcal(-remain)} over target`}</span></div><div class="calbig">${kcal(t.calories)} <small>/ ${kcal(target('calories'))} kcal</small></div>${bar(t.calories,target('calories'))}<div class="sub">${Math.round(pct(t.calories,target('calories')))}% of calorie target</div>${foodMacroRows(t)}</section><section class="card span4"><div class="cardhead"><h2>Daily signals</h2><span>✦</span></div><div class="stat-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><div class="value">${pretty(a.steps)}</div><div class="label">Steps</div><div class="hint">Target ${pretty(target('steps'))}</div>${bar(a.steps,target('steps'))}</div><div class="stat"><div class="value">${pretty(a.water)}L</div><div class="label">Water</div><div class="hint">Target ${pretty(target('water'))}L</div>${bar(a.water,target('water'))}</div><div class="stat"><div class="value">${w?pretty(w.kg):'—'}</div><div class="label">Latest kg</div><div class="hint">${w?fmtDate(w.date,{day:'numeric',month:'short'}):'Add a weigh-in'}</div></div><div class="stat"><div class="value">${work.length}</div><div class="label">Workouts</div><div class="hint">Logged today</div></div></div><div style="margin-top:13px"><button class="btn" style="width:100%" data-page="Train">${work.length?'View workout':'＋ Log a workout'}</button></div></section><section class="card span7"><div class="cardhead"><h2>Food diary</h2><button class="btn primary" data-action="addfood">＋ Add food</button></div>${['Breakfast','Lunch','Dinner','Snacks','Other'].map(m=>mealHTML(m,fs.filter(f=>f.meal===m))).join('')}</section><section class="card span5"><div class="cardhead"><h2>Daily check-in</h2><span class="pill">Habits</span></div>${dailyForm(a)}<div class="divider"></div><div class="cardhead"><h3>Quick actions</h3></div><div class="actions"><button class="btn" data-action="addweight">＋ Weight</button><button class="btn" data-page="Food">Search foods</button><button class="btn" data-page="Progress">View progress</button></div></section><section class="card span12"><div class="cardhead"><h2>Muscle-building focus</h2><span class="pill">Today</span></div><div class="stat-grid"><div class="stat"><div class="label">Protein target</div><div class="value">${Math.max(0,kcal(target('protein')-t.protein))}g</div><div class="hint">${t.protein>=target('protein')?'Target reached':'protein still to go'}</div>${bar(t.protein,target('protein'))}</div><div class="stat"><div class="label">Training</div><div class="value">${work.length?work.reduce((s,x)=>s+x.exercises.length,0):'—'}</div><div class="hint">Exercises logged</div></div><div class="stat"><div class="label">Consistency</div><div class="value">${habitScore(t,a,work)}%</div><div class="hint">Calories · protein · steps · water</div></div></div></section></div>`}

t(w);break}case'deleteworkout':if(confirm('Delete this workout?')){data.workouts=data.workouts.filter(w=>w.id!==id);if(save())render()}break;case'addexercise':{const list=$('exerciseList');const n=list.querySelectorAll('.workout-exercise').length;list.insertAdjacentHTML('beforeend',exerciseFormHTML({name:'',sets:[{reps:8,weight:0}]},n));break}case'removeexercise':el.closest('.workout-exercise')?.remove();break;case'addset':{const box=el.closest('.workout-exercise'),i=box.querySelectorAll('.set-reps').length+1;el.insertAdjacentHTML('beforebegin',`<div class="setrow"><span class="setnum">${i}</span><input type="number" class="set-reps" min="1" max="1000" value="8" aria-label="Reps"><input type="number" class="set-weight" min="0" max="2000" step="0.5" value="0" aria-label="Weight in kg"><input type="number" class="set-rpe" min="1" max="10" step="0.5" placeholder="—" aria-label="RPE"></div>`);break}case'weekprev':weekOffset--;render();break;case'weeknext':if(weekOffset<0)weekOffset++;render();break;case'theme':data.theme=data.theme==='light'?'dark':'light';if(save())render();break;case'export':exportData();break;case'import':$('importFile').click();break;case'clear':if(confirm('This permanently clears FuelTrack data in this browser. Export a backup first. Continue?')&&confirm('Final check: clear all food, weight, workout, settings and history data?')){localStorage.removeItem(KEY);data=normalize(null);save();selectedDate=today();page='Today';render();toast('FuelTrack data cleared')}break;case'closemodal':closeModal();break;case'deleteweight':if(confirm('Delete this weigh-in?')){data.weights=data.weights.filter(w=>w.id!==id);if(save())render()}break;case'deletemeasure':if(confirm('Delete this measurement record?')){data.measurements=data.measurements.filter(m=>m.id!==id);if(save())render()}break;}}

$('app').addEventListener('submit',e=>{if(e.target.id==='activityForm'){e.preventDefault();const old=activity();data.activity[selectedDate]={...old,steps:Math.max(0,num($('steps').value)),water:Math.max(0,num($('water').value))};if(save()){render();toast('Check-in saved')}}else if(e.target.id==='searchForm'){e.preventDefault();searchFoods($('foodSearch').value)}else if(e.target.id==='weightForm'){e.preventDefault();const kg=num($('weightKg').value),date=$('weightDate').value;if(kg<20||kg>400||!date)return toast('Enter a valid weight and date.');data.weights.push({id:uid(),date,kg:round(kg,2),note:$('weightNote').value.trim()});selectedDate=date;if(save()){render();toast('Weight saved')}}else if(e.target.id==='measureForm'){e.preventDefault();const m={id:uid(),date:$('measureDate').value};[['waist','measureWaist'],['chest','measureChest'],['arm','measureArm'],['thigh','measureThigh']].forEach(([k,id])=>{const v=$(id).value;m[k]=v===''?null:Math.max(0,num(v))});if(!m.date||![m.waist,m.chest,m.arm,m.thigh].some(v=>v!==null))return toast('Enter a date and at least one measurement.');data.measurements.push(m);selectedDate=m.date;if(save()){render();toast('Measurements saved')}}else if(e.target.id==='foodForm')saveFoodForm(e);else if(e.target.id==='workoutForm'){e.preventDefault();const id=$('workoutId').value,old=data.workouts.find(w=>w.id===id),w={id:id||uid(),name:$('workoutName').value.trim()||'Workout',date:$('workoutDate').value,duration:Math.max(0,num($('workoutDuration').value)),notes:$('workoutNotes').value.trim(),exercises:readExercises()};if(!w.date)return toast('Choose a workout date.');if(!w.exercises.length)return toast('Add at least one named exercise.');if(old)data.workouts=data.workouts.map(x=>x.id===id?w:x);else data.workouts.push(w);selectedDate=w.date;if(save()){closeModal();render();toast('Workout saved')}}else if(e.target.id==='targetsForm'){e.preventDefault();data.targets={...data.targets,calories:clamp(num($('targetCalories').value),500,10000),protein:clamp(num($('targetProtein').value),0,500),carbs:clamp(num($('targetCarbs').value),0,1000),fat:clamp(num($('targetFat').value),0,500),water:clamp(num($('targetWater').value),0,15),steps:clamp(num($('targetSteps').value),0,100000),startWeight:$('startWeight').value===''?null:clamp(num($('startWeight').value),20,400),goalWeight:$('goalWeight').value===''?null:clamp(num($('goalWeight').value),20,400)};if(save()){render();toast('Targets saved')}}else if(e.target.id==='saveMealForm'){e.preventDefault();const name=$('savedMealName').value.trim();if(!name)return;data.savedMeals.push({id:uid(),name,items:foods().map(f=>({name:f.name,meal:f.meal,serving:f.serving,quantity:f.quantity,calories:f.calories,protein:f.protein,carbs:f.carbs,fat:f.fat,source:f.source}))});if(save()){closeModal();render();toast('Meal saved')}}});
$('app').addEventListener('change',e=>{if(e.target.id==='goalSelect'){data.profile.goal=e.target.value;if(save())toast('Goal updated')}});$('app').addEventListener('input',e=>{if(e.target.id==='foodSearch'){clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchFoods(e.target.value),550)}});
$('modalroot').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='closemodal'){closeModal();return}if(a==='addexercise'){const list=$('exerciseList');const n=list.querySelectorAll('.workout-exercise').length;list.insertAdjacentHTML('beforeend',exerciseFormHTML({name:'',sets:[{reps:8,weight:0}]},n));return}if(a==='removeexercise'){b.closest('.workout-exercise')?.remove();return}if(a==='addset'){const box=b.closest('.workout-exercise'),i=box.querySelectorAll('.set-reps').length+1;b.insertAdjacentHTML('beforebegin',`<div class="setrow"><span class="setnum">${i}</span><input type="number" class="set-reps" min="1" max="1000" value="8"><input type="number" class="set-weight" min="0" max="2000" step="0.5" value="0"><input type="number" class="set-rpe" min="1" max="10" step="0.5" placeholder="—"></div>`);return}});
$('prevDay').addEventListener('click',()=>{selectedDate=shift(selectedDate,-1);render()});$('nextDay').addEventListener('click',()=>{if(selectedDate<today()){selectedDate=shift(selectedDate,1);render()}});$('todayBtn').addEventListener('click',()=>{selectedDate=today();render()});$('themeBtn').addEventListener('click',()=>{data.theme=data.theme==='light'?'dark':'light';if(save())render()});$('quickAddBtn').addEventListener('click',()=>openModal(`<div class="modalhead"><h2>Quick add</h2><button class="iconbtn" data-action="closemodal">×</button></div><div class="grid"><button class="btn" data-action="modalmanual">🍽️ Add food</button><button class="btn" data-action="modalweight">⚖️ Log weight</button><button class="btn" data-action="modalworkout">🏋️ Log workout</button><button class="btn" data-action="modalwater">💧 Add 500ml water</button></div>`));
$('modalroot').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'modalmanual':closeModal();openManual();break;case'modalweight':closeModal();changePage('Weight');setTimeout(()=>$('weightKg')?.focus(),0);break;case'modalworkout':closeModal();openWorkout({date:selectedDate});break;case'modalwater':{const a=activity();data.activity[selectedDate]={...a,water:round(a.water+.5,2)};if(save()){closeModal();render();toast('Added 500ml water')}break}}});
$('importFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importData(f);e.target.value=''});
async function startScanner(){const box=$('scannerBox');if(!box)return;box.innerHTML='<div class="notice" style="margin-top:12px">Camera access requires HTTPS and permission. You can also search by product name.</div><div id="reader" style="margin-top:10px"></div><button class="btn" id="stopScanner" style="margin-top:8px">Stop scanner</button>';try{if(!window.Html5Qrcode){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:160}},async code=>{await stopScanner();$('foodSearch').value=code;await searchBarcode(code)},()=>{});$('stopScanner').onclick=stopScanner}catch(e){box.innerHTML='<div class="notice">Barcode scanning could not start. Allow camera access on HTTPS, or search the product name instead.</div>'}}
async function stopScanner(){try{if(scanner){await scanner.stop();scanner.clear();scanner=null}}catch(e){}const box=$('scannerBox');if(box)box.innerHTML=''}
async function searchBarcode(code){const box=$('searchResults');box.innerHTML='<div class="empty">Looking up barcode…</div>';try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity,nutriments,code');const j=await r.json();const p=j.product;if(!p||j.status!==1)throw Error('Not found');const n=p.nutriments||{},prod={name:[p.product_name,p.brands].filter(Boolean).join(' · ')||code,serving:'100g',calories:Math.round(num(n['energy-kcal_100g']??n['energy-kcal_value']??(num(n.energy_100g)/4.184))),protein:round(n.proteins_100g,1),carbs:round(n.carbohydrates_100g,1),fat:round(n.fat_100g,1),source:'barcode'};box.innerHTML=`<div class="foodline"><div class="foodemoji">▦</div><div class="foodinfo"><strong>${esc(prod.name)}</strong><small>Per 100g · ${prod.calories} kcal · ${prod.protein}g protein</small></div><button class="smallbtn" id="barcodeAdd">Add</button></div>`;$('barcodeAdd').onclick=()=>addFromProduct(prod)}catch(e){box.innerHTML='<div class="notice">No product found for that barcode. Try searching by name or use manual entry.</div>'}}
// Preserve any older app records; only the new features are additive.
if(!localStorage.getItem(KEY))save();render();
})();
