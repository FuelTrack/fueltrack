<script>
"use strict";
const KEY="fueltrack-v1";
const nutrientDefs=[
 {key:"carbs",label:"Carbohydrates",unit:"g",group:"Macros",target:225},
 {key:"fat",label:"Total fat",unit:"g",group:"Macros",target:60},
 {key:"fiber",label:"Fibre",unit:"g",group:"Macros",target:30},
 {key:"saturatedFat",label:"Saturated fat",unit:"g",group:"Macros",target:20},
 {key:"sugar",label:"Sugars",unit:"g",group:"Macros",target:null},
 {key:"sodium",label:"Sodium",unit:"mg",group:"Minerals",target:2000},
 {key:"potassium",label:"Potassium",unit:"mg",group:"Minerals",target:3500},
 {key:"calcium",label:"Calcium",unit:"mg",group:"Minerals",target:1000},
 {key:"iron",label:"Iron",unit:"mg",group:"Minerals",target:14},
 {key:"magnesium",label:"Magnesium",unit:"mg",group:"Minerals",target:300},
 {key:"zinc",label:"Zinc",unit:"mg",group:"Minerals",target:10},
 {key:"vitaminA",label:"Vitamin A",unit:"µg",group:"Vitamins",target:800},
 {key:"vitaminC",label:"Vitamin C",unit:"mg",group:"Vitamins",target:80},
 {key:"vitaminD",label:"Vitamin D",unit:"µg",group:"Vitamins",target:10},
 {key:"vitaminE",label:"Vitamin E",unit:"mg",group:"Vitamins",target:12},
 {key:"vitaminB12",label:"Vitamin B12",unit:"µg",group:"Vitamins",target:2.4},
 {key:"folate",label:"Folate",unit:"µg",group:"Vitamins",target:200}
];
const nutrientDefaults=Object.fromEntries(nutrientDefs.filter(n=>n.target!==null).map(n=>[n.key,n.target]));
const defaults={targets:{calories:1800,protein:150,water:2.5,goalWeight:null,startWeight:null,nutrients:nutrientDefaults},foods:[],weights:[],activity:{},favorites:[],savedMeals:[],settings:{theme:"light"}};
let data,page="today",searchResults=[],scanner=null,editingId=null,selectedMeal="Breakfast",weeklyOffset=0;
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const shift=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dateObj=s=>new Date(s+"T12:00:00");
const fmt=s=>dateObj(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const longDate=s=>dateObj(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const num=(v,f=0)=>v===null||v===undefined||v===""?f:(Number.isFinite(Number(v))?Number(v):f);
const round=(v,n=0)=>Number(num(v).toFixed(n));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
const pct=(v,t)=>t>0?Math.max(0,Math.min(100,v/t*100)):0;
const btn=(text,action,cls="")=>`<button class="btn ${cls}" data-action="${action}">${text}</button>`;
const empty=s=>`<div class="empty">${s}</div>`;
function normalize(raw){
 const d=raw&&typeof raw==="object"?raw:{};
 d.targets={...defaults.targets,...(d.targets||{})};
 d.targets.nutrients={...nutrientDefaults,...(d.targets?.nutrients||{})};
 d.foods=Array.isArray(d.foods)?d.foods:[];d.weights=Array.isArray(d.weights)?d.weights:[];d.activity=d.activity&&typeof d.activity==="object"?d.activity:{};
 d.foods=d.foods.map(f=>({...f,id:f.id||id(),date:f.date||today(),name:String(f.name||"Food"),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),meal:f.meal||"Snacks"}));
 d.weights=d.weights.map(w=>({...w,id:w.id||id(),date:w.date||today(),kg:num(w.kg)})).filter(w=>w.kg>0);
 for(const [date,a] of Object.entries(d.activity))d.activity[date]={steps:Math.max(0,num(a?.steps)),water:Math.max(0,num(a?.water))};
 d.favorites=Array.isArray(d.favorites)?d.favorites:[];d.savedMeals=Array.isArray(d.savedMeals)?d.savedMeals:[];d.settings={...defaults.settings,...(d.settings||{})};d.fitness=Fitness.normalize(d.fitness);return d;
}
function load(){try{data=normalize(JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(JSON.stringify(defaults)))}catch(e){data=normalize(JSON.parse(JSON.stringify(defaults)));alert("Saved data could not be read. Do not clear browser data; use your backup if needed.")}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("FuelTrack couldn't save. Export a backup and check browser storage.");return false}}
function theme(){document.documentElement.dataset.theme=data.settings.theme==="light"?"light":"dark";$("themeQuick").innerHTML=data.settings.theme==="light"?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';document.querySelector('meta[name="theme-color"]').content=data.settings.theme==="light"?"#f5f5f8":"#111319"}
function setTheme(v){data.settings.theme=v;save();theme();render()}
function foodsOn(date=today()){return data.foods.filter(f=>f.date===date)}
function totals(fs){return fs.reduce((a,f)=>({calories:a+num(f.calories),protein:a+num(f.protein)}),{calories:0,protein:0})}
function nutrientTotals(fs){const out={};for(const n of nutrientDefs){let sum=0,count=0;for(const f of fs){if(f.nutrients&&f.nutrients[n.key]!==null&&f.nutrients[n.key]!==undefined&&f.nutrients[n.key]!==""&&Number.isFinite(Number(f.nutrients[n.key]))){sum+=Math.max(0,Number(f.nutrients[n.key]));count++}}out[n.key]={value:sum,count,entries:fs.length}}return out}
function activity(date=today()){return data.activity[date]||{steps:0,water:0}}
function weightsSorted(){return [...data.weights].sort((a,b)=>a.date.localeCompare(b.date))}
function latestWeight(){return weightsSorted().slice(-1)[0]}
function weightBefore(date){return weightsSorted().filter(w=>w.date<=date).slice(-1)[0]}
function progressBar(v,t){return `<div class="progress"><div style="width:${pct(v,t)}%"></div></div>`}
function stat(label,value,unit="",sub=""){return `<div class="card"><div class="stat-label">${label}</div><div class="big">${value}<span class="unit"> ${unit}</span></div>${sub?`<div class="hint">${sub}</div>`:""}</div>`}

function ring(v,t){const p=pct(v,t),c=2*Math.PI*43;return `<div style="width:116px;flex:none;position:relative" aria-label="${Math.round(p)} percent of calorie target"><svg viewBox="0 0 100 100" style="display:block;transform:rotate(-90deg)"><circle cx="50" cy="50" r="43" fill="none" stroke="var(--panel2)" stroke-width="6"/><circle cx="50" cy="50" r="43" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><strong style="font-size:22px;letter-spacing:-.6px">${Math.round(p)}%</strong><span style="font-size:10px;color:var(--muted)">of daily target</span></div></div>`;}

function title(t,s=''){return `<div class="page-heading"><div><p class="eyebrow">Your daily rhythm</p><h1>${t}</h1>${s?`<p class="muted">${s}</p>`:''}</div></div>`;}
function chart(points,color="var(--accent)",label="Progress"){if(!points.length)return empty("Log some entries to see your chart.");const W=340,H=165,L=35,R=10,T=12,B=25,vals=points.map(p=>num(p.value));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}min=Math.max(0,min-(max-min)*.1);max+=(max-min)*.1;const x=i=>L+(points.length===1?(W-L-R)/2:i*(W-L-R)/(points.length-1)),y=v=>T+(H-T-B)-(v-min)/(max-min)*(H-T-B);const path=points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.value)).join(" ");const grid=[0,1,2,3].map(i=>{let v=min+(max-min)*i/3,yy=y(v);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${round(v,1)}</text>`}).join("");const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="3" fill="${color}"><title>${esc(p.label)}: ${round(p.value,1)}</title></circle>`).join("");const labels=points.map((p,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(p.label)}</text>`:"").join("");return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg></div>`}
function foodRow(f){return `<div class="entry"><div class="grow"><div class="name">${esc(f.name)} ${data.favorites.includes(f.name)?"★":""}</div><div class="sub">${esc(f.meal)} · ${round(f.protein,1)}g protein${f.date!==today()?" · "+fmt(f.date):""}${f.nutrients&&Object.values(f.nutrients).some(v=>v!==null&&v!==undefined&&v!=="")?" · nutrition details saved":""}</div></div><div class="cal">${Math.round(f.calories)} kcal</div><button class="iconbtn" data-action="editfood:${f.id}" aria-label="Edit food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L9 19l-5 1 1-5Z"/></svg></button><button class="iconbtn" data-action="deletefood:${f.id}" aria-label="Delete food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button></div>`}

function render(){if(scanner)stopScanner();theme();if(page==='nutrition'){page='food';foodView='nutrition';}if(page==='weight'||page==='weekly'){progressView=page;page='progress';}document.querySelectorAll('#nav button').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('settingsButton').setAttribute('aria-pressed',String(page==='settings'));const views={today:renderToday,food:renderFoodHub,fitness:Fitness.render,progress:renderProgressHub,settings:renderSettings};$('app').innerHTML=(views[page]||renderToday)();}

function renderToday(){const fs=foodsOn(),t=totals(fs),a=activity(),nt=nutrientTotals(fs),w=latestWeight(),ct=num(data.targets.calories,1800),pt=num(data.targets.protein,150),wt=num(data.targets.water,2.5),left=ct-t.calories,training=data.fitness.active,todaySessions=data.fitness.sessions.filter(s=>s.date===today());const macro=(label,value,target,known=true)=>`<div><div class="stat-label">${label}</div><strong>${known?round(value):'—'} <span class="unit">g</span></strong>${progressBar(value,target)}<p class="hint">${known?`of ${target}g`:'No data yet'}</p></div>`;return `${title('Make today count.',longDate(today()))}<div class="dashboard-grid"><section class="card hero-card"><div class="section-head"><h2>Daily nutrition</h2><span class="pill accent">${fs.length} entries logged</span></div><div class="hero-main"><div><div class="stat-label">Calories consumed</div><div class="hero-value">${Math.round(t.calories)} <span class="unit">kcal</span></div><p class="hint" style="margin-top:9px"><strong class="${left<0?'red':'accent'}">${Math.round(Math.abs(left))} kcal ${left<0?'over target':'remaining'}</strong> · ${ct} target</p></div>${ring(t.calories,ct)}</div><div class="macro-grid">${macro('Protein',t.protein,pt)}${macro('Carbs',nt.carbs.value,num(data.targets.nutrients.carbs,225),!!nt.carbs.count)}${macro('Fat',nt.fat.value,num(data.targets.nutrients.fat,60),!!nt.fat.count)}</div><div style="margin-top:22px">${uiButton(icon('plus')+' Log food','foodtool:search','primary full')}</div></section><section class="card"><div class="section-head"><h2>Daily check-in</h2><span class="pill">Today</span></div><div class="row"><div class="mini-icon">${icon('water')}</div><div class="grow"><div class="stat-label">Water</div><div class="big">${round(a.water,2)} <span class="unit">/ ${wt} L</span></div></div><span class="pill green">${Math.round(pct(a.water,wt))}%</span></div>${progressBar(a.water,wt)}<div class="water-buttons">${btn('+250 ml','wateradd:0.25','small')}${btn('+500 ml','wateradd:0.5','small')}${uiButton('Edit','wateredit','small')}</div><hr><div class="checkin-row"><div class="row"><div class="mini-icon">${icon('steps')}</div><div><strong>${Math.round(a.steps).toLocaleString()}</strong><div class="hint">Steps today</div></div></div>${uiButton('Update','stepsedit','small')}</div><div class="checkin-row"><div class="row"><div class="mini-icon">${icon('weight')}</div><div><strong>${w?round(w.kg,1)+' kg':'No weigh-in'}</strong><div class="hint">${w?'Latest · '+fmt(w.date):'Track your longer-term trend'}</div></div></div>${uiButton('Log','progressview:weight','small')}</div></section></div><div class="training-banner"><div><p class="eyebrow">Training</p><h2>${training?'Your session is ready to continue':todaySessions.length?'Workout logged. Keep building.':'A little stronger, one session at a time.'}</h2><p class="hint">${training?esc(training.name)+' · '+training.exercises.length+' exercises':todaySessions.length?todaySessions.length+' session'+(todaySessions.length>1?'s':'')+' recorded today':'Choose a routine, log your sets, or make time for cardio.'}</p></div>${uiButton(training?'Continue workout':todaySessions.length?'Open training':'Start a workout','training','primary')}</div><div class="grid section"><section class="card"><div class="section-head"><h2>Meals today</h2>${uiButton('View diary','foodview:diary','small ghost')}</div>${['Breakfast','Lunch','Dinner','Snacks'].map(m=>{const list=fs.filter(f=>f.meal===m);return `<div class="meal-summary"><div class="grow"><strong>${m}</strong><p class="hint">${list.length?list.length+' food'+(list.length>1?'s':'')+' logged':'Not logged yet'}</p></div><span class="cal">${list.length?Math.round(totals(list).calories)+' kcal':'—'}</span>${btn('+ Add','addmeal:'+m,'small')}</div>`}).join('')}</section><section class="card"><div class="section-head"><h2>Your next step</h2>${icon('progress')}</div><p class="muted">Small, consistent entries make your progress easier to see.</p><div class="checkin-row"><div><strong>Nutrition detail</strong><p class="hint" style="margin:3px 0 0">${nutrientDefs.filter(n=>nt[n.key].count).length} of ${nutrientDefs.length} nutrients recorded today</p></div>${uiButton('View','foodview:nutrition','small')}</div><div class="checkin-row"><div><strong>Weekly review</strong><p class="hint" style="margin:3px 0 0">Food, water, steps and training together.</p></div>${uiButton('View','progressview:weekly','small')}</div><p class="hint" style="margin:17px 0 0">Your totals reflect recorded entries. Missing data is never a complete picture of your day.</p></section></div><div class="grid today-checkins"><details id="checkin-water" class="checkin-details"><summary>Edit water total</summary><form id="waterForm"><label for="water">Water consumed today (litres)</label><input id="water" type="number" min="0" step=".05" value="${a.water}" required><button class="btn primary full form-actions">Save water</button></form></details><details id="checkin-steps" class="checkin-details"><summary>Edit step count</summary><form id="stepsForm"><label for="steps">Steps today</label><input id="steps" type="number" min="0" step="1" value="${a.steps}" required><button class="btn primary full form-actions">Save steps</button></form></details></div>`;}
function nutrientRows(fs,editableTargets=false){const sums=nutrientTotals(fs);return ["Macros","Minerals","Vitamins"].map(group=>{const list=nutrientDefs.filter(n=>n.group===group);return `<div class="nutrient-group"><h3>${group}</h3>${list.map(n=>{const s=sums[n.key],target=data.targets.nutrients[n.key],known=s.count>0;return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${known?`${s.count} of ${fs.length} food entries provide this value`:`No recorded values yet`}</div></div><div class="nutrient-amount">${known?`${round(s.value,1)} ${n.unit}`:"—"}${target?`<div class="nutrient-meta">Goal ${round(target,1)} ${n.unit}</div>`:""}</div>${target?progressBar(known?s.value:0,target):""}</div>`}).join("")}</div>`}).join("")}

function renderNutrition(){const fs=foodsOn(diaryDate),sums=nutrientTotals(fs),count=nutrientDefs.filter(n=>sums[n.key].count).length;return `<div class="date-row"><p class="hint" style="margin:0">Nutrient detail for ${diaryDate===today()?'today':fmt(diaryDate)}</p><input type="date" id="diaryDate" aria-label="Nutrition date" value="${diaryDate}"></div><div class="card"><div class="section-head"><h2>Nutrition coverage</h2><span class="pill accent">${count}/${nutrientDefs.length} nutrients</span></div><p class="hint">A dash means there is no recorded value. Totals can be incomplete when some foods lack nutrient data.</p><div class="metric-strip" style="margin-bottom:0">${metric('Carbohydrates',sums.carbs.count?round(sums.carbs.value,1):'—','g')}${metric('Fat',sums.fat.count?round(sums.fat.value,1):'—','g')}${metric('Fibre',sums.fiber.count?round(sums.fiber.value,1):'—','g')}</div></div><div class="card"><h2>Daily nutrient overview</h2>${nutrientRows(fs)}</div><details><summary>Last seven days · nutrient averages</summary><p class="hint">Averages cover the seven days ending today and only include days with recorded values.</p>${weeklyNutrientSummary()}</details><details><summary>Edit nutrient targets</summary><p class="hint">These are editable tracking references. Set a target to 0 to hide its progress bar.</p>${nutrientTargetForm()}</details>`;}
function weeklyNutrientSummary(days=Array.from({length:7},(_,i)=>shift(today(),i-6))){const totalsByKey={};for(const n of nutrientDefs){const vals=[];for(const d of days){const fs=foodsOn(d),sum=nutrientTotals(fs)[n.key];if(sum.count)vals.push(sum.value)}totalsByKey[n.key]={value:avg(vals),days:vals.length}}return ["Macros","Minerals","Vitamins"].map(g=>`<div class="nutrient-group"><h3>${g}</h3>${nutrientDefs.filter(n=>n.group===g).map(n=>{const s=totalsByKey[n.key];return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${s.days} of 7 days with data</div></div><div class="nutrient-amount">${s.value===null?"—":`${round(s.value,1)} ${n.unit}`}</div></div>`}).join("")}</div>`).join("")}

function searchRow(p,i){return `<div class="entry"><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${Math.round(p.calories)} kcal · ${round(p.protein,1)}g protein per 100g</div></div>${btn("Add","searchadd:"+i,"small primary")}</div>`}

function renderWeight(){const ws=weightsSorted(),recent=ws.filter(w=>w.date>=shift(today(),-6)&&w.date<=today()),latest=ws.filter(w=>w.date<=today()).at(-1);return `<div class="grid"><section class="card"><div class="section-head"><h2>Log a weigh-in</h2><span class="pill">kg</span></div><form id="weightForm" class="formgrid"><div><label for="weightDate">Date</label><input type="date" id="weightDate" value="${today()}" required></div><div><label for="weightKg">Weight (kg)</label><input type="number" id="weightKg" min="1" max="500" step=".1" placeholder="e.g. 80.5" required></div><div class="wide form-actions"><button class="btn primary full">Save weight</button></div></form></section><section class="card"><h2>Latest snapshot</h2><div class="metric-strip" style="grid-template-columns:1fr 1fr;margin-bottom:0">${metric('Latest',latest?round(latest.kg,1):'—','kg',latest?fmt(latest.date):'No entries yet')}${metric('7-day average',recent.length?round(avg(recent.map(w=>w.kg)),1):'—','kg',recent.length+' weigh-ins')}</div></section></div><section class="card section"><h2>Weight history</h2>${ws.length?[...ws].reverse().map(w=>`<div class="entry"><div class="grow"><strong>${longDate(w.date)}</strong></div><span class="cal">${round(w.kg,1)} kg</span>${btn('Delete','deleteweight:'+w.id,'small danger')}</div>`).join(''):empty('Add your first weigh-in. Your records and trends will appear here.')}</section>`;}

function renderProgress(){const ws=weightsSorted().filter(w=>w.date<=today()),latest=ws.at(-1),start=num(data.targets.startWeight)||ws[0]?.kg,change=latest&&start?latest.kg-start:null,days=Array.from({length:14},(_,i)=>shift(today(),i-13)),logged=days.filter(d=>foodsOn(d).length),ca=avg(logged.map(d=>totals(foodsOn(d)).calories)),pa=avg(logged.map(d=>totals(foodsOn(d)).protein)),sessions=data.fitness.sessions.filter(s=>s.date>=days[0]&&s.date<=today()),goal=num(data.targets.goalWeight);return `<div class="metric-strip">${metric('Avg calories',ca===null?'—':Math.round(ca),'kcal',logged.length+' logged days / 14')}${metric('Avg protein',pa===null?'—':round(pa,1),'g','On logged-food days')}${metric('Training',sessions.length,'sessions','In the last 14 days')}</div><div class="grid"><div class="card"><div class="section-head"><h2>Weight trend</h2>${uiButton('Log weight','progressview:weight','small')}</div><div class="between"><div class="big">${latest?round(latest.kg,1):'—'} <span class="unit">kg</span></div><span class="pill">${change===null?'No trend yet':(change>0?'+':'')+round(change,1)+' kg since start'}</span></div>${chart(ws.slice(-30).map(w=>({label:fmt(w.date),value:w.kg})),'var(--accent)','Weight trend in kilograms')}</div><div class="card"><h2>Your goal</h2>${goal?`<div class="big">${round(goal,1)} <span class="unit">kg</span></div><p class="hint" style="margin-top:10px">${latest?latest.kg===goal?'You are at your recorded goal weight.':round(Math.abs(latest.kg-goal),1)+' kg '+(latest.kg>goal?'above':'below')+' your goal.':'Add a weigh-in to see your progress.'}</p>`:'<p class="muted">Set a goal weight to put your trend in context.</p>'}${uiButton('Edit targets','settings','small')}<hr><h3>Logging consistency</h3><div class="big">${logged.length}<span class="unit"> / 14 days</span></div>${progressBar(logged.length,14)}<p class="hint">Days with at least one food entry.</p></div><div class="card"><h2>Calories · logged days</h2>${chart(logged.map(d=>({label:fmt(d),value:totals(foodsOn(d)).calories})),'var(--blue)','Calories on logged days')}<p class="hint">Last 14 days. Missing days are excluded; points are spaced by entry.</p></div><div class="card"><h2>Protein · logged days</h2>${chart(logged.map(d=>({label:fmt(d),value:totals(foodsOn(d)).protein})),'var(--accent)','Protein on logged days')}<p class="hint">Last 14 days. A logged day can still be incomplete.</p></div></div>`;}
function weekStart(s){const d=dateObj(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

function renderWeekly(){const start=shift(weekStart(today()),weeklyOffset*7),end=shift(start,6),days=Array.from({length:7},(_,i)=>shift(start,i)),rows=days.map(date=>({date,foods:foodsOn(date),totals:totals(foodsOn(date)),activity:activity(date)})),logged=rows.filter(d=>d.foods.length),ca=avg(logged.map(d=>d.totals.calories)),pa=avg(logged.map(d=>d.totals.protein)),sessions=data.fitness.sessions.filter(s=>s.date>=start&&s.date<=end),water=rows.filter(d=>d.activity.water>0),steps=rows.filter(d=>d.activity.steps>0),w1=weightBefore(start),w2=weightBefore(end),delta=w1&&w2?w2.kg-w1.kg:null;return `<div class="week-nav">${btn('←','weekprev','small')}<div style="text-align:center"><strong>${fmt(start)} – ${fmt(end)}</strong><div>${btn('This week','weektoday','small ghost')}</div></div><button class="btn small" data-action="weeknext" ${weeklyOffset===0?'disabled':''} aria-label="Next week">→</button></div><div class="metric-strip">${metric('Avg calories',ca===null?'—':Math.round(ca),'kcal',logged.length+' logged days')}${metric('Avg protein',pa===null?'—':round(pa,1),'g','Logged-food days')}${metric('Training',sessions.length,'sessions','This selected week')}</div><div class="grid"><section class="card"><h2>Daily breakdown</h2>${rows.map(d=>`<div class="entry"><div class="grow"><div class="name">${dateObj(d.date).toLocaleDateString(undefined,{weekday:'short'})} · ${fmt(d.date)}</div><div class="sub">${Math.round(d.activity.steps).toLocaleString()} steps · ${round(d.activity.water,2)} L water</div></div><div class="cal">${d.foods.length?Math.round(d.totals.calories)+' kcal':'Not logged'}<div class="sub">${d.foods.length?round(d.totals.protein,1)+'g protein':''}</div></div></div>`).join('')}</section><section class="card"><h2>Weekly summary</h2><div class="checkin-row"><span class="hint">Average steps</span><strong>${steps.length?Math.round(avg(steps.map(d=>d.activity.steps))).toLocaleString():'—'}</strong></div><div class="checkin-row"><span class="hint">Average water</span function renderSettings(){return `<div class="page-heading"><div><p class="eyebrow">Make it yours</p><h1>Settings</h1><p class="muted">Your targets, preferences and backups.</p></div>${uiButton('Done','back','small')}</div><div class="settings-grid"><section class="card wide"><h2>Daily targets</h2><form id="targetsForm" class="formgrid"><div><label for="targetCalories">Calories (kcal)</label><input id="targetCalories" type="number" min="1" max="10000" value="${num(data.targets.calories,1800)}" required></div><div><label for="targetProtein">Protein (g)</label><input id="targetProtein" type="number" min="1" max="1000" value="${num(data.targets.protein,150)}" required></div><div><label for="targetWater">Water (litres)</label><input id="targetWater" type="number" min=".1" max="15" step=".1" value="${num(data.targets.water,2.5)}" required></div><div><label for="startWeight">Starting weight (kg)</label><input id="startWeight" type="number" min="1" max="500" step=".1" value="${esc(data.targets.startWeight??'')}" placeholder="Optional"></div><div><label for="goalWeight">Goal weight (kg)</label><input id="goalWeight" type="number" min="1" max="500" step=".1" value="${esc(data.targets.goalWeight??'')}" placeholder="Optional"></div><div class="wide form-actions"><button class="btn primary">Save targets</button></div></form><p class="hint" style="margin-top:14px">Targets are personal tracking references.</p></section><section class="card"><h2>Appearance</h2><p class="hint">Choose the view that feels right for you.</p><div class="row wrap">${btn('Light','theme:light',data.settings.theme==='light'?'primary':'')}${btn('Dark','theme:dark',data.settings.theme!=='light'?'primary':'')}</div></section><section class="card"><h2>Backup & restore</h2><p class="hint">Your records are saved in this browser. Export a backup before switching devices or replacing the app.</p><div class="row wrap">${btn('Export backup','export','primary')}${btn('Restore backup','import')}</div><p class="hint" s function nutrientInputs(old={}){return `<details><summary>Advanced nutrition (optional)</summary><p class="hint">Enter nutrient values for the portion you are logging, not per 100g. Leave unknown values blank.</p><div class="formgrid">${nutrientDefs.map(n=>`<div><label for="nut_${n.key}">${n.label} (${n.unit})</label><input id="nut_${n.key}" type="number" min="0" max="100000" step=".01" value="${old.nutrients&&old.nutrients[n.key]!=null?esc(old.nutrients[n.key]):""}" placeholder="Unknown / not provided"></div>`).join("")}</div></details>`}
function legacyOpenManual(f=null,meal=null){const old=f||{},m=meal||old.meal||selectedMeal||"Snacks";$("editorOverlay")?.remove();const html=`<div id="editorOverlay" class="card"><div class="between"><h2>${f?"Edit food":"Manual food entry"}</h2>${btn("Cancel","cancelmanual","small")}</div><form id="manualForm" class="formgrid"><div class="wide"><label for="foodName">Food name</label><input id="foodName" required maxlength="160" value="${esc(old.name||"")}" placeholder="e.g. Chicken breast"></div><div><label for="foodCalories">Calories for one portion (kcal)</label><input id="foodCalories" type="number" min="0" max="100000" step=".1" required value="${old.calories??""}"></div><div><label for="foodProtein">Protein for one portion (g)</label><input id="foodProtein" type="number" min="0" max="10000" step=".1" required value="${old.protein??""}"></div><div><label for="foodQuantity">Number of portions</label><input id="foodQuantity" type="number" min=".01" max="1000" step=".01" value="1" required></div><div><label for="foodMeal">Meal</label><select id="foodMeal">${["Breakfast","Lunch","Dinner","Snacks"].map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select></div><div><label for="foodDate">Date</label><input id="foodDate" type="date" value="${old.date||today()}" required></div><div><label><input id="makeFavorite" type="checkbox" ${data.favorites.includes(old.name)?"checked":""}> Save as favourite</label></div><div class="wide">${nutrientInputs(old)}<p class="hint">Enter nutrition for one portion; calories, protein and nutrient values are multiplied by the portion count.</p><button class="btn primary full">Save food</button></div></form></div>`;$("app").insertAdjacentHTML("afterbegin",html);editingId=f?.id||null}
function saveManual(){const name=$("foodName").value.trim(),cal=num($("foodCalories").value,-1),pro=num($("foodProtein").value,-1),quantity=num($("foodQuantity").value,0),meal=$("foodMeal").value,date=$("foodDate").value;if(!name||cal<0||pro<0||quantity<=0||!date){alert("Please enter valid food details and a portion amount.");return}diaryDate=date;const nutrients={};for(const n of nutrientDefs){const el=$("nut_"+n.key);nutrients[n.key]=el&&el.value.trim()!==""?round(Math.max(0,num(el.value)),3):null}const totalCal=round(cal*quantity,2),totalPro=round(pro*quantity,2);const duplicate=data.foods.some(f=>f.id!==editingId&&f.date===date&&f.meal===meal&&f.name.toLowerCase()===name.toLowerCase()&&num(f.calories)===totalCal&&num(f.protein)===totalPro);if(duplicate&&!confirm("An identical food entry already exists for this meal and date. Add another anyway?"))return;const f={id:editingId||id(),date,name,calories:totalCal,protein:totalPro,meal,nutrients:Object.fromEntries(Object.entries(nutrients).map(([k,v])=>[k,v===null?null:round(v*quantity,3)]))};if(editingId){const i=data.foods.findIndex(x=>x.id===editingId);if(i>=0)data.foods[i]={...data.foods[i],...f};else data.foods.push(f)}else data.foods.push(f);if($("makeFavorite").checked&&!data.favorites.includes(name))data.favorites.push(name);if(!$("makeFavorite").checked)data.favorites=data.favorites.filter(n=>n!==name);if(save()){page="food";foodView="diary";render()}}
function addFood(o){const name=String(o.name||"Food"),meal=o.meal||selectedMeal||"Snacks",date=o.date||diaryDate,cal=Math.max(0,num(o.calories)),pro=Math.max(0,num(o.protein)),nutrients=o.nutrients||{};const duplicate=data.foods.some(f=>f.date===date&&f.meal===meal&&f.name.toLowerCase()===name.toLowerCase()&&num(f.calories)===cal&&num(f.protein)===pro);if(duplicate&&!confirm("This looks identical to an entry already logged for this meal. Add it again?"))return;data.foods.push({id:id(),date,name,calories:cal,protein:pro,meal,nutrients});if(save()){searchResults=[];page="food";foodView="diary";foodTool="";render()}}
function addSearchFood(p){const grams=num(prompt(`How many grams of ${p.name}?\nNutrition shown is per 100g.`, "100"),-1);if(grams<=0)return;const nutrients={};for(const n of nutrientDefs)nutrients[n.key]=p.nutrients&&p.nutrients[n.key]!=null?round(p.nutrients[n.key]*grams/100,3):null;addFood({name:p.name,calories:p.calories*grams/100,protein:p.protein*grams/100,nutrients,meal:selectedMeal})}
function saveWeight(date,kg){const old=data.weights.find(w=>w.date===date);if(old)old.kg=kg;else data.weights.push({id:id(),date,kg});data.weights.sort((a,b)=>a.date.localeCompare(b.date));if(save()){page="weight";render()}}
function saveMeal(){const fs=foodsOn();if(!fs.length){alert("Log at least one food today before saving a meal.");return}const name=prompt("Name this saved meal:");if(!name?.trim())return;const t=totals(fs);data.savedMeals.push({id:id(),name:name.trim(),foods:fs.map(f=>({name:f.name,calories:f.calories,protein:f.protein,meal:f.meal||"Snacks",nutrients:f.nutrients||{}})),calories:t.calories,protein:t.protein});if(save())render()}
function addSavedMeal(i){diaryDate=today();const m=data.savedMeals[i];if(!m)return;const fs=Array.isArray(m.foods)&&m.foods.length?m.foods:[{name:m.name,calories:m.calories,protein:m.protein,meal:selectedMeal}];if(fs.some(f=>foodsOn().some(x=>x.name===f.name&&x.calories===f.calories&&x.protein===f.protein))&&!confirm("Some foods in this saved meal already appear today. Add the meal anyway?"))return;fs.forEach(f=>data.foods.push({id:id(),date:today(),name:String(f.name||"Food"),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),meal:f.meal||selectedMeal,nutrients:f.nutrients||{}}));if(save()){page="food";foodView="diary";render()}}
function copyYesterday(){diaryDate=today();const prev=foodsOn(shift(today(),-1));if(!prev.length){alert("There are no food entries logged for yesterday.");return}if(!confirm(`Copy ${prev.length} food entries from yesterday into today? This adds copies and leaves yesterday unchanged.`))return;prev.forEach(f=>data.foods.push({...f,id:id(),date:today(),nutrients:f.nutrients?{...f.nutrients}:{}}));if(save()){page="food";foodView="diary";render()}}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){downloadJSON({...data,exportedAt:new Date().toISOString(),app:"FuelTrack",version:4.2},`fueltrack-backup-${today()}.json`)}
function exportWeek(){const start=shift(weekStart(today()),weeklyOffset*7),days=Array.from({length:7},(_,i)=>shift(start,i));downloadJSON({app:"FuelTrack",type:"weekly-report",trainingSessions:data.fitness.sessions.filter(s=>days.includes(s.date)),weekStart:start,weekEnd:days[6],days:days.map(date=>({date,calories:totals(foodsOn(date)).calories,protein:totals(foodsOn(date)).protein,nutrients:nutrientTotals(foodsOn(date)),foodEntries:foodsOn(date).length,steps:activity(date).steps,water:activity(date).water})),exportedAt:new Date().toISOString()},`fueltrack-week-${start}.json`)}
function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.foods)||!Array.isArray(parsed.weights)||!parsed.activity||typeof parsed.activity!=="object")throw new Error("This doesn't look like a complete FuelTrack backup.");if(parsed.foods.some(f=>!f||typeof f.name!=="string"||!Number.isFinite(Number(f.calories))||!Number.isFinite(Number(f.protein)))||parsed.weights.some(w=>!w||!Number.isFinite(Number(w.kg))||Number(w.kg)<=0))throw new Error("Some records have invalid data.");if(!confirm(`Restore this backup? This replaces the current records in this browser.\n\nFood entries: ${parsed.foods.length}\nWeigh-ins: ${parsed.weights.length}\n\nYour exported backup remains unchanged.`))return;data=normalize(parsed);if(save()){page="today";searchResults=[];render();alert("Backup restored. Check your records and targets.")}}catch(e){alert("Couldn't restore this file: "+e.message)}$("importFile").value=""};r.onerror=()=>alert("Could not read this file. Try selecting the JSON backup again.");r.readAsText(file)}
function mapNutrients(n){const x={};const keys={carbs:["carbohydrates_100g","carbohydrates_value"],fat:["fat_100g","fat_value"],fiber:["fiber_100g","fiber_value"],saturatedFat:["saturated-fat_100g","saturated-fat_value"],sugar:["sugars_100g","sugars_value"],sodium:["sodium_100g"],potassium:["potassium_100g"],calcium:["calcium_100g"],iron:["iron_100g"],magnesium:["magnesium_100g"],zinc:["zinc_100g"],vitaminA:["vitamin-a_100g"],vitaminC:["vitamin-c_100g"],vitaminD:["vitamin-d_100g"],vitaminE:["vitamin-e_100g"],vitaminB12:["vitamin-b12_100g"],folate:["folates_100g"]};for(const [key,aliases] of Object.entries(keys)){let v=null;for(const a of aliases){if(n[a]!==undefined&&n[a]!==null&&n[a]!==""&&Number.isFinite(Number(n[a]))){v=Number(n[a]);break}}if(v!==null){if(key==="sodium"||key==="potassium"||key==="calcium"||key==="iron"||key==="magnesium"||key==="zinc")v*=1000; x[key]=Math.max(0,v)}}return x}
async function searchFood(q){const box=$("searchResults");if(box)box.innerHTML=empty("Searching…");try{const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=12");if(!r.ok)throw new Error("Search unavailable");const j=await r.json();searchResults=(j.products||[]).map(p=>{const n=p.nutriments||{};return {name:p.product_name||p.product_name_en||p.generic_name||"",calories:num(n["energy-kcal_100g"],num(n["energy-kcal_value"],num(n["energy_100g"])/4.284)),protein:num(n.proteins_100g),barcode:p.code||"",nutrients:mapNutrients(n)}}).filter(p=>p.name);if(box)box.innerHTML=searchResults.length?searchResults.map(searchRow).join(""):empty("No results. Try another search or manual entry.")}catch(e){if(box)box.innerHTML=empty("Food search couldn't connect. Check your internet connection or use manual entry.")}}

function action(s){const [type,...parts]=s.split(":");const v=parts.join(":");if(type==="wateradd"){const a=activity();data.activity[today()]={...a,water:round(a.water+Math.max(0,num(v)),2)};if(save())render()}else if(type==="gofood"){page="food";render()}else if(type==="gofitness"){page="fitness";render()}else if(type==="gonutrition"){page="nutrition";render()}else if(type==="goweight"){page="weight";render()}else if(type==="gosettings"){page="settings";render()}else if(type==="addmeal"){if(page==="today")diaryDate=today();selectedMeal=v;page="food";render();openManual(null,v)}else if(type==="manualform")openManual();else if(type==="cancelmanual"){$("editorOverlay")?.remove();editingId=null}else if(type==="editfood"){const f=data.foods.find(f=>f.id===v);if(f)openManual({...f})}else if(type==="deletefood"){if(confirm("Delete this food entry?")){data.foods=data.foods.filter(f=>f.id!==v);if(save())render()}}else if(type==="deleteweight"){if(confirm("Delete this weigh-in?")){data.weights=data.weights.filter(w=>w.id!==v);if(save())render()}}else if(type==="searchadd"){const p=searchResults[Number(v)];if(p)addSearchFood(p)}else if(type==="favadd"){const n=decodeURIComponent(v);openManual({name:n,calories:"",protein:"",meal:selectedMeal})}else if(type==="favremove"){data.favorites=data.favorites.filter(n=>n!==decodeURIComponent(v));if(save())render()}else if(type==="savedmeal")addSavedMeal(Number(v));else if(type==="delsavedmeal"){if(confirm("Delete this saved meal?")){data.savedMeals.splice(Number(v),1);if(save())render()}}else if(type==="savemeal")saveMeal();else if(type==="copyyesterday")copyYesterday();else if(type==="export")exportJSON();else if(type==="import")$("importFile").click();else if(type==="theme")setTheme(v);else if(type==="startscan")startScanner();else if(type==="stopscan"){stopScanner();if($("scanMessage"))$("scanMessage").textContent="Scanner stopped."}else if(type==="weekprev"){weeklyOffset--;render()}else if(type==="weeknext"){if(weeklyOffset<0)weeklyOffset++;render()}else if(type==="weektoday"){weeklyOffset=0;render()}else if(type==="exportweek")exportWeek()}

plan-fields">${e.type==='cardio'?builderInput(e,'targetMinutes','Duration (min)',{min:.1,max:1440,step:.1})+builderInput(e,'targetKm','Distance (km, optional)',{max:10000,step:.01,placeholder:'Optional'}):builderInput(e,'setCount','Sets',{min:1,max:30})+builderInput(e,'targetReps',e.timed?'Hold (seconds)':'Reps per set',{min:1})+builderInput(e,'targetKg',e.equipment==='Bodyweight'?'Added kg, optional':'Load (kg, optional)',{max:2000,step:.5,placeholder:'Choose in session'})}${builderInput(e,'restSeconds','Rest (seconds)',{max:3600})}</div>${e.equipment==='Dumbbells'?'<p class="hint" style="margin-top:12px">Enter the weight of one dumbbell.</p>':''}</section>`).join('')||(!builderPicking?empty('Add exercises to build this workout.'):'')}<div class="builder-footer"><div class="row wrap">${fa('Save workout','save-plan','primary')}${fa('Discard draft','discard-draft','danger')}</div><p class="hint">Targets guide the workout. You’ll log the repetitions and load you actually complete during the session.</p></div>`;}
 function renderExample(){const p=examples().find(p=>p.id===exampleId);if(!p)return renderWorkouts();return `<div class="section-head">${fa('← All workouts','tab:workouts','small ghost')}<span class="pill">EDITABLE EXAMPLE</span></div><section class="card"><p class="eyebrow">${E(p.focus)}</p><h2 style="font-size:27px">${E(p.name)}</h2><p class="hint">Example targets, with no assumed working weight. Adjust them to suit your session.</p><div class="row wrap">${fa('Copy & customise','copy-example:'+p.id,'primary')}${fa('Start example','start-example:'+p.id)}</div></section>${p.exercises.map((e,i)=>`<div class="card"><div class="section-head"><div><p class="eyebrow">Exercise ${i+1}</p><h3>${E(e.name)}</h3><p class="hint">${E(targetText(e))} · ${e.restSeconds}s rest</p></div>${fa('Exercise details','detail:'+e.exerciseId,'small')}</div><p class="hint">${E(find(e.exerciseId)?.cue||'')}</p></div>`).join('')}`;}
 function sessionRow(e,s,i){return `<div class="ft-set"><span>${i+1}</span><label><span class="hint">${e.timed?'Seconds':'Actual reps'}</span><input aria-label="${e.timed?'Seconds':'Reps'} for set ${i+1} of ${E(e.name)}" data-set="${E(e.id)}" data-index="${i}" data-field="reps" type="number" min="1" max="10000" step="1" value="${E(s.reps)}" placeholder="${E(e.targetReps||'—')}"></label><label><span class="hint">${e.equipment==='Bodyweight'?'Added kg':'Actual kg'}</span><input aria-label="Weight for set ${i+1} of ${E(e.name)}" data-set="${E(e.id)}" data-index="${i}" data-field="kg" type="number" min="0" max="2000" step=".5" value="${E(s.kg)}" placeholder="${E(e.targetKg!==''?e.targetKg:'—')}"></label><label class="ft-check"><input type="checkbox" aria-label="Set ${i+1} of ${E(e.name)} completed" data-set="${E(e.id)}" data-index="${i}" data-field="done" ${s.done?'checked':''}>Done</label>${fa('×','remove-set:'+e.id+':'+i,'small')}</div>`;}
 function renderSession(){const a=data.fitness.active;if(!a)return renderWorkouts();const done=countSets(a),planned=a.exercises.reduce((n,e)=>n+e.sets.length,0);return `<div class="section-head">${fa('← Workouts','tab:workouts','small ghost')}<span class="pill ${a.runningSince!==null?'green':''}">${a.runningSince!==null?'LIVE SESSION':'PAUSED'}</span></div><section class="session-timer-card"><div><p class="eyebrow">${E(a.name)}</p><div class="session-big-clock" data-session-clock role="timer" aria-live="off">${clock(elapsed(a))}</div><p class="hint">Session time · pauses excluded</p></div><div class="session-timer-controls">${fa(a.runningSince!==null?'Pause timer':'Resume timer','toggle-timer')}${fa('Finish session','finish','primary')}</div><div class="session-timer-meta"><span><strong id="ft-completed-count">${done}</strong> / ${planned} sets complete</span><span>${a.exercises.length} exercises</span><span>${E(a.date)}</span></div></section>${a.planNotes?`<details><summary>Workout notes</summary><p class="hint">${E(a.planNotes)}</p></details>`:''}<div class="session-layout"><div><div class="section-head"><h2>Your exercises</h2>${fa('+ Add exercises','tab:library','small primary')}</div>${a.exercises.map((e,index)=>{const prev=previous(e.exerciseId,a.date);return `<section class="card"><div class="section-head align-start"><div><p class="eyebrow">Exercise ${index+1}</p><h2>${E(e.name)}</h2><p class="hint">${E(e.muscle)} · ${E(e.equipment)}</p></div><div class="row wrap">${demoButton(e.exerciseId)}${fa('Details','detail:'+e.exerciseId,'small')}</div></div><div class="target-strip"><div><span class="hint">Planned target</span><strong>${E(targetText({...e,setCount:e.sets.length}))}</strong></div>${fa('Use targets','use-targets:'+e.id,'small')}</div>${prev?`<div class="previous-strip"><div><span class="hint">Last time · ${E(prev.session.date)}</span><p>${E(actualText(prev.exercise))}</p></div>${fa('Use last','use-last:'+e.id,'small')}</div>`:'<p class="hint">Your first recorded session with this exercise.</p>'}${e.type==='cardio'?`<div class="formgrid"><label>Actual duration (minutes)<input data-cardio="${E(e.id)}" data-field="minutes" type="number" min=".1" max="1440" step=".1" value="${E(e.minutes)}" placeholder="${E(e.targetMinutes||'0')}"></label><label>Distance (km, optional)<input data-cardio="${E(e.id)}" data-field="km" type="number" min="0" max="10000" step=".01" value="${E(e.km)}" placeholder="Optional"></label></div>`:`${e.sets.map((s,i)=>sessionRow(e,s,i)).join('')}<div class="form-actions">${fa('+ Add set','set:'+e.id,'small')}</div>`}<details><summary>Rest, notes & options</summary><div class="formgrid"><label>Rest after each set (seconds)<input data-live-rest="${E(e.id)}" type="number" min="0" max="3600" step="1" value="${E(e.restSeconds)}"></label><div><label>Logging guide</label><p class="hint">${e.type==='cardio'?'Enter the actual duration of this activity.':e.timed?'Log hold time in seconds. Use 0 kg for an unweighted hold.':e.equipment==='Dumbbells'?'Use the weight of one dumbbell.':e.equipment==='Bodyweight'?'Use 0 kg, or your added load.':'For barbells, include the bar in the total load.'}</p></div></div><label>Exercise notes<textarea data-note="${E(e.id)}" maxlength="1000">${E(e.note||'')}</textarea></label>${fa('Remove exercise','remove:'+e.id,'small danger')}</details></section>`;}).join('')||empty('Add an exercise to begin your session.')}<section class="card"><h2>How was your session?</h2><div class="formgrid"><div><label for="session-effort">Overall effort, optional</label><select id="session-effort" data-session-field="effort"><option value="">Not recorded</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${Number(a.effort)===i+1?'selected':''}>${i+1}${i===0?' · Very easy':i===9?' · Maximum effort':''}</option>`).join('')}</select></div><div><label for="ft-workout-date">Session date</label><input type="date" id="ft-workout-date" data-session-field="date" value="${E(a.date)}"></div><div class="wide"><label for="session-notes">Session notes</label><textarea id="session-notes" data-session-field="notes" maxlength="1000" placeholder="What went well? What would you change?">${E(a.notes||'')}</textarea></div></div></section></div><aside class="session-side"><section class="card rest-panel"><div class="section-head"><h2>Rest countdown</h2><span class="pill">Between sets</span></div><div class="timer-value" id="ft-rest-clock" role="timer" aria-live="off">${restText(a)}</div><p class="hint" id="ft-rest-status">${E(a.rest.label||'Start when you need a break')}</p><div class="row wrap">${[60,90,120].map(n=>fa(n+'s','rest:'+n,'small')).join('')}${fa('Clear','rest:0','small')}</div><label class="auto-rest-toggle"><input type="checkbox" id="auto-rest" ${a.autoRest?'checked':''}> Auto-start after a completed set</label><p class="hint">Uses the exercise’s rest time. Pausing the session pauses the rest countdown too.</p><hr><label for="ft-workout-name">Session name</label><input id="ft-workout-name" data-session-field="name" maxlength="100" value="${E(a.name)}"><div class="form-actions">${fa('Finish session','finish','primary full')}</div><details><summary>More session options</summary>${fa('Save exercises as a workout','session-to-plan','small')}${fa('Discard session','discard','small danger')}</details><p class="hint">Timers recover after reopening. Keep the app open to see when rest finishes.</p></section></aside></div>`;}
function renderLibrary(){return `<div class="card"><div class="section-head"><h2>Exercise library</h2><span class="pill">${all().length} exercises</span></div><input id="ft-query" aria-label="Search exercises" placeholder="Search by exercise, muscle or equipment…" value="${E(query)}"><details><summary>Filter exercises${kind||muscle||equipment||onlyFav?' · filters applied':''}</summary><div class="formgrid"><div><label for="ft-kind">Training type</label><select id="ft-kind"><option value="">All training</option>${['strength','cardio'].map(x=>`<option value="${x}" ${kind===x?'selected':''}>${x==='strength'?'Bodybuilding':'Cardio'}</option>`).join('')}</select></div><div><label for="ft-muscle">Muscle group</label><select id="ft-muscle"><option value="">All groups</option>${[...new Set(all().map(e=>e.muscle))].sort().map(x=>`<option ${muscle===x?'selected':''}>${E(x)}</option>`).join('')}</select></div><div><label for="ft-equipment">Equipment</label><select id="ft-equipment"><option value="">All equipment</option>${[...new Set(all().map(e=>e.equipment))].sort().map(x=>`<option ${equipment===x?'selected':''}>${E(x)}</option>`).join('')}</select></div><div><label><input id="ft-favs" type="checkbox" ${onlyFav?'checked':''}> Favourites only</label></div></div></details></div><div id="ft-results">${results()}</div><details><summary>Add a custom exercise</summary><form id="ft-custom"><label for="ft-custom-name">Exercise name</label><input id="ft-custom-name" maxlength="100" required><div class="formgrid"><div><label for="ft-custom-type">Type</label><select id="ft-custom-type"><option value="strength">Bodybuilding</option><option value="cardio">Cardio</option></select></div><div><label for="ft-custom-muscle">Muscle group</label><input id="ft-custom-muscle" maxlength="40" placeholder="e.g. Chest or Cardio" required></div></div><label for="ft-custom-equipment">Equipment</label><input id="ft-custom-equipment" maxlength="40" placeholder="e.g. Dumbbells" required><label for="ft-custom-cue">Your notes</label><textarea id="ft-custom-cue" maxlength="1000"></textarea><button class="btn primary form-actions">Save exercise</button></form></details>`;}
function results(){const list=all().filter(e=>(!kind||e.type===kind)&&(!muscle||e.muscle===muscle)&&(!equipment||e.equipment===equipment)&&(!onlyFav||data.fitness.favorites.includes(e.id))&&`${e.name} ${e.muscle} ${e.equipment}`.toLowerCase().includes(query.toLowerCase().trim()));return `<p class="hint">${list.length} exercises${list.length>visibleCount?' · showing '+visibleCount:''}</p>${list.length?`<div class="exercise-grid">${list.slice(0,visibleCount).map(e=>`<article class="exercise-card"><div class="exercise-top"><span class="exercise-letter">${E(e.muscle.slice(0,2).toUpperCase())}</span><div><h3>${E(e.name)}</h3><p class="hint">${E(e.muscle)} · ${E(e.equipment)}</p></div></div><div class="row">${demoButton(e.id)}${fa('Details','detail:'+e.id,'small')}${fa(data.fitness.favorites.includes(e.id)?'★ Saved':'☆ Save','fav:'+e.id,'small')}${fa('+ Session','add:'+e.id,'small primary')}</div></article>`).join('')}</div>`:empty('No matches. Try a different search or remove a filter.')}${list.length>visibleCount?`<div style="text-align:center;margin:20px 0">${fa('Show more exercises','more','small')}</div>`:''}`;}
 function relatedExamples(e){const exact=exampleSpecs.filter(p=>p.ids.includes(e.id));if(exact.length)return {label:'Example workouts with this exercise',list:exact};return {label:'Examples for the same muscle group',list:exampleSpecs.filter(p=>p.ids.some(id=>find(id)?.muscle===e.muscle)).slice(0,3)};}
 function detailHTML(){const e=find(detail);if(!e)return '';const prev=previous(e.id),related=relatedExamples(e),saved=data.fitness.plans.filter(p=>p.exercises.some(x=>x.exerciseId===e.id));return `<section class="card" id="ft-detail"><div class="section-head"><div><p class="eyebrow">EXERCISE DETAILS</p><h2>${E(e.name)}</h2></div>${fa('Close','close','small')}</div><span class="pill">${E(e.muscle)} · ${E(e.equipment)}</span><p style="margin-top:16px">${E(e.cue||'Add your own exercise notes.')}</p>${demoPanel(e)}<div class="row wrap">${fa('Add to session','add:'+e.id,'primary')}${fa('Build a workout with this','plan-from-exercise:'+e.id)}</div><hr><h3>Previous performance</h3>${prev?`<p class="hint">${E(prev.session.date)} · ${E(prev.session.name)}</p><p>${E(actualText(prev.exercise))}</p>`:'<p class="hint">Complete a session with this exercise to compare it next time.</p>'}${related.list.length?`<h3 class="section">${related.label}</h3>${related.list.map(p=>`<div class="entry"><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.focus)} · ${p.ids.length} exercises</div></div>${fa('Preview','example:'+p.id,'small')}</div>`).join('')}`:''}${saved.length?`<h3 class="section">Your workouts with this exercise</h3>${saved.map(p=>`<div class="entry"><div class="grow"><strong>${E(p.name)}</strong></div>${fa('Edit workout','edit-plan:'+p.id,'small')}</div>`).join('')}`:''}</section>`;}
 function sessionStats(s){return {sets:countSets(s),cardio:s.exercises.reduce((n,e)=>n+(e.type==='cardio'?num(e.minutes):0),0),duration:s.durationMs!==null&&s.durationMs!==undefined?clock(s.durationMs):'Not timed'};}
 function renderHistory(){const list=[...data.fitness.sessions].sort((a,b)=>b.date.localeCompare(a.date)||String(b.finishedAt).localeCompare(String(a.finishedAt)));return `<div class="section-head"><h2>Session history</h2><span class="pill">${list.length} completed</span></div>${list.length?list.map(s=>{const stats=sessionStats(s);return `<article class="card history-card"><div class="section-head"><h2>${E(s.name)}</h2><span class="pill">${E(s.date)}</span></div><div class="history-meta"><span>${stats.duration}</span><span>${stats.sets} sets</span><span>${s.exercises.length} exercises</span>${stats.cardio?`<span>${round(stats.cardio,1)} min cardio</span>`:''}</div><div class="row wrap">${fa('View summary','summary:'+s.id,'primary small')}${fa('Repeat','repeat:'+s.id,'small')}${fa('Save as workout','history-to-plan:'+s.id,'small')}${fa('Delete','delete:'+s.id,'small danger')}</div></article>`}).join(''):empty('<strong>Your training story starts here.</strong>Finish a session and it will appear here with your exercises, sets and time.')}`;}
 function renderSummary(){const s=data.fitness.sessions.find(s=>s.id===summaryId);if(!s)return renderHistory();const stats=sessionStats(s);return `<div class="section-head">${fa('← History','tab:history','small ghost')}<span class="pill green">SESSION COMPLETE</span></div><section class="card"><p class="eyebrow">${E(s.date)}</p><h2 style="font-size:28px">${E(s.name)}</h2><div class="metric-strip">${metric('Session time',stats.duration)}${metric('Completed sets',stats.sets)}${metric('Cardio',round(stats.cardio,1),'min')}</div><div class="row wrap">${fa('Save as workout','history-to-plan:'+s.id,'primary')}${fa('Repeat exercises','repeat:'+s.id)}</div>${s.effort?`<p class="hint" style="margin-top:16px">Session effort: ${E(s.effort)} / 10</p>`:''}${s.notes?`<div class="notice">${E(s.notes)}</div>`:''}</section><div class="card"><h2>What you completed</h2>${s.exercises.map(e=>`<div class="entry"><div class="grow"><div class="name">${E(e.name)}</div><div class="sub">${E(actualText(e))}</div>${e.note?`<p class="hint">${E(e.note)}</p>`:''}${e.notes?`<p class="hint">${E(e.notes)}</p>`:''}</div></div>`).join('')}</div>`;}
 function fitnessHTML(){const section=['session','builder','example'].includes(tab)?'workouts':['workout','routines'].includes(tab)?'workouts':tab;const views={workouts:renderWorkouts,workout:renderWorkouts,routines:renderWorkouts,library:renderLibrary,history:renderHistory,builder:renderBuilder,example:renderExample,session:renderSession,summary:renderSummary};return title('Training','Plan your session. Track every step forward.')+`<div class="tabs ft-tabs" aria-label="Training navigation">${[['workouts','Workouts'],['library','Exercises'],['history','History']].map(([key,label])=>fa(label,'tab:'+key,(section===key||tab==='summary'&&key==='history')?'primary':'')).join('')}</div>`+detailHTML()+(views[tab]||renderWorkouts)();}
 function validSet(s){return s.reps!==''&&Number.isInteger(Number(s.reps))&&num(s.reps)>0&&num(s.reps)<=10000&&s.kg!==''&&finitePositive(s.kg)&&num(s.kg)<=2000;}
 function finish(){const a=data.fitness.active;if(!a)return;const exercises=[];for(const e of a.exercises){if(e.type==='cardio'){if(e.minutes==='')continue;if(!finitePositive(e.minutes)||num(e.minutes)<.1||num(e.minutes)>1440||e.km!==''&&(!finitePositive(e.km)||num(e.km)>10000)){alert('Enter a valid cardio duration and optional distance.');return;}exercises.push({...clone(e),minutes:Number(e.minutes),km:e.km===''?null:Number(e.km)});}else{const sets=e.sets.filter(s=>s.done);if(!sets.length)continue;if(sets.some(s=>!validSet(s))){alert('Completed sets need positive whole reps or seconds and a valid load. Use 0 kg for unweighted exercises.');return;}exercises.push({...clone(e),sets:sets.map(s=>({...s,reps:Number(s.reps),kg:Number(s.kg),done:true}))});}}if(!exercises.length){alert('Complete a set or enter a cardio duration before finishing.');return;}if(!a.name.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(a.date)){alert('Enter a session name and date.');return;}if(a.effort!==''&&(!Number.isInteger(Number(a.effort))||num(a.effort)<1||num(a.effort)>10)){alert('Choose an effort rating from 1 to 10, or leave it blank.');return;}if(!confirm('Finish this session? Completed sets and cardio entries will be saved; unchecked sets are omitted.'))return;const savedId=a.id;if(commit(()=>{const record=clone(a);pauseTimer(record);record.durationMs=record.timerUsed?record.elapsedMs:null;record.rest=blankRest();record.exercises=exercises;record.finishedAt=new Date().toISOString();data.fitness.sessions.push(record);data.fitness.active=null;})){summaryId=savedId;tab='summary';detail=null;redraw();}}
 function handle(value){const [type,...args]=value.split(':'),v=args.join(':');const f=data.fitness;if(type==='demo'){openDemo(v);return;}if(type.startsWith('demo-')){demoAction(type);return;}if(type==='tab'){tab=v;detail=null;redraw();return;}if(type==='open'){page='fitness';tab=f.active?'session':'workouts';detail=null;redraw();return;}if(type==='session'){tab='session';detail=null;redraw();return;}if(type==='more'){visibleCount+=12;$('ft-results').innerHTML=results();return;}if(type==='new-plan'){beginBuilder();return;}if(type==='edit-draft'){tab='builder';redraw();return;}if(type==='save-plan'){savePlan();return;}if(type==='discard-draft'){if(confirm('Discard this workout draft?')&&commit(()=>{f.draftPlan=null;})){tab='workouts';redraw();}return;}if(type==='toggle-picker'){builderPicking=!builderPicking;redraw();return;}if(type==='plan-add'){const e=find(v);if(e&&f.draftPlan&&commit(()=>f.draftPlan.exercises.push(planExercise(e)))){redraw();notifySaved('Exercise added to your workout');}return;}if(['plan-up','plan-down','plan-remove'].includes(type)){const p=f.draftPlan;if(!p)return;const i=p.exercises.findIndex(e=>e.id===v);if(i<0)return;if(type==='plan-remove'&&!confirm('Remove this exercise from the workout draft?'))return;if(commit(()=>{if(type==='plan-remove')p.exercises.splice(i,1);else{const j=i+(type==='plan-up'?-1:1);if(j>=0&&j<p.exercises.length)[p.exercises[i],p.exercises[j]]=[p.exercises[j],p.exercises[i]];}}))redraw();return;}
 if(['edit-plan','copy-plan','start-plan','delete-plan'].includes(type)){const p=f.plans.find(p=>p.id===v);if(!p)return;if(type==='edit-plan')beginBuilder(p);if(type==='copy-plan')beginBuilder({...clone(p),id:uid(),name:(p.name+' copy').slice(0,100)});if(type==='start-plan')startPlan(p);if(type==='delete-plan'&&confirm('Delete this saved workout? Completed sessions are kept.')&&commit(()=>{f.plans=f.plans.filter(p=>p.id!==v);}))redraw();return;}
 if(['example','copy-example','start-example','routine'].includes(type)){const p=examples().find(p=>p.id===v)||examples()[Number(v)];if(!p)return;if(type==='example'){exampleId=p.id;detail=null;tab='example';redraw();}else if(type==='copy-example')beginBuilder({...clone(p),id:uid()});else startPlan(p);return;}
 if(type==='plan-from-exercise'){const e=find(v);if(e)beginBuilder({id:uid(),name:e.muscle+' workout',notes:'',exercises:[planExercise(e)]});return;}if(type==='history-to-plan'||type==='repeat'){const s=f.sessions.find(s=>s.id===v);if(!s)return;const p=planFromSession(s);if(type==='history-to-plan')beginBuilder(p);else startPlan(p);return;}if(type==='session-to-plan'){if(f.active)beginBuilder(planFromSession(f.active));return;}if(type==='summary'){summaryId=v;tab='summary';detail=null;redraw();return;}if(type==='delete'){if(confirm('Delete this completed session?')&&commit(()=>{f.sessions=f.sessions.filter(s=>s.id!==v);}))redraw();return;}
 if(type==='start'){if(f.active){tab='session';redraw();}else if(commit(()=>{f.active=newSession();})){tab='session';redraw();}return;}if(type==='add'){const e=find(v);if(e&&commit(()=>{if(!f.active)f.active=newSession();f.active.exercises.push(sessionExercise(planExercise(e)));})){tab='session';detail=null;redraw();}return;}if(type==='fav'){if(commit(()=>{f.favorites=f.favorites.includes(v)?f.favorites.filter(x=>x!==v):[...f.favorites,v];}))redraw();return;}if(type==='detail'){detail=v;redraw();$('ft-detail')?.scrollIntoView({block:'start',behavior:'smooth'});return;}if(type==='close'){detail=null;redraw();return;}
 const a=f.active;if(!a)return;if(type==='toggle-timer'){if(commit(()=>{if(a.runningSince!==null)pauseTimer(a);else resumeTimer(a);}))redraw();return;}if(type==='rest'){if(commit(()=>{if(num(v)>0)beginRest(a,num(v));else a.rest=blankRest();}))updateTimers();return;}if(type==='finish'){finish();return;}if(type==='discard'){if(confirm('Discard the current session and its timer?')&&commit(()=>{f.active=null;})){tab='workouts';detail=null;redraw();}return;}if(type==='remove-set'){const e=a.exercises.find(e=>e.id===args[0]),i=Number(args[1]);if(!e)return;if(e.sets[i]?.done&&!confirm('Remove this completed set?'))return;if(commit(()=>e.sets.splice(i,1)))redraw();return;}
 const e=a.exercises.find(e=>e.id===v);if(!e)return;if(type==='remove'){if(confirm('Remove this exercise and its logged sets?')&&commit(()=>{a.exercises=a.exercises.filter(e=>e.id!==v);}))redraw();}else if(type==='set'){if(commit(()=>e.sets.push({reps:'',kg:'',done:false})))redraw();}else if(type==='use-targets'){if(commit(()=>{if(e.type==='cardio'){e.minutes=valueOrBlank(e.targetMinutes);e.km=valueOrBlank(e.targetKm);}else e.sets.forEach(s=>{if(!s.done){s.reps=valueOrBlank(e.targetReps);s.kg=valueOrBlank(e.targetKg);}});}))redraw();}else if(type==='use-last'){const prev=previous(e.exerciseId,a.date);if(!prev)return;if(e.sets.some(s=>s.done)&&!confirm('Replace these sets with your previous session values? Completion ticks will be cleared.'))return;if(commit(()=>{if(e.type==='cardio'){e.minutes=prev.exercise.minutes;e.km=prev.exercise.km??'';}else e.sets=prev.exercise.sets.filter(s=>s.done).map(s=>({...clone(s),done:false}));}))redraw();}}
 document.addEventListener('click',event=>{const b=event.target.closest('[data-ft]');if(!b)return;event.preventDefault();event.stopImmediatePropagation();handle(b.dataset.ft);},true);
 document.addEventListener('input',event=>{const el=event.target;if(el.id==='ft-query'){query=el.value;visibleCount=12;$('ft-results').innerHTML=results();}else if(el.id==='builder-search'){builderQuery=el.value;$('builder-results').innerHTML=builderResults();}});
 document.addEventListener('change',event=>{const el=event.target,d=el.dataset,f=data.fitness;let ok=true;
 if(['ft-kind','ft-muscle','ft-equipment','ft-favs'].includes(el.id)){kind=$('ft-kind').value;muscle=$('ft-muscle').value;equipment=$('ft-equipment').value;onlyFav=$('ft-favs').checked;visibleCount=12;$('ft-results').innerHTML=results();return;}
 if(d.planHeader&&f.draftPlan){if(['name','notes'].includes(d.planHeader))ok=commit(()=>{f.draftPlan[d.planHeader]=el.value;});}
 else if(d.planEntry&&f.draftPlan){const e=f.draftPlan.exercises.find(e=>e.id===d.planEntry);if(e&&['setCount','targetReps','targetKg','targetMinutes','targetKm','restSeconds'].includes(d.planField))ok=commit(()=>{e[d.planField]=el.value;});}
 else {const a=f.active;if(!a)return;
 if(d.set){const e=a.exercises.find(x=>x.id===d.set),s=e?.sets[Number(d.index)];if(!s)return;if(d.field==='done'){if(el.checked&&!validSet(s)){el.checked=false;alert('Enter the actual reps or seconds and load first. Use 0 kg for unweighted exercises.');return;}ok=commit(()=>{s.done=el.checked;if(s.done&&a.autoRest&&num(e.restSeconds)>0)beginRest(a,e.restSeconds,e.name);});}else if(['reps','kg'].includes(d.field)){ok=commit(()=>{s[d.field]=el.value;});}}
 else if(d.cardio){const e=a.exercises.find(x=>x.id===d.cardio);if(e&&['minutes','km','notes'].includes(d.field))ok=commit(()=>{e[d.field]=el.value;});}
 else if(d.note){const e=a.exercises.find(x=>x.id===d.note);if(e)ok=commit(()=>{e.note=el.value;});}
 else if(d.liveRest){const e=a.exercises.find(x=>x.id===d.liveRest);if(!finitePositive(el.value)||num(el.value)>3600){alert('Rest time must be between 0 and 3,600 seconds.');el.value=e?.restSeconds||90;return;}if(e)ok=commit(()=>{e.restSeconds=el.value;});}
 else if(d.sessionField&&['name','date','effort','notes'].includes(d.sessionField))ok=commit(()=>{a[d.sessionField]=el.value;});
 else if(el.id==='auto-rest')ok=commit(()=>{a.autoRest=el.checked;});
 }
 if(!ok)redraw();else updateTimers();
 });
 document.addEventListener('submit',event=>{if(event.target.id!=='ft-custom')return;event.preventDefault();event.stopImmediatePropagation();const name=$('ft-custom-name').value.trim(),type=$('ft-custom-type').value,muscle=$('ft-custom-muscle').value.trim(),equipment=$('ft-custom-equipment').value.trim(),cue=$('ft-custom-cue').value.trim();if(!name||!muscle||!equipment)return;if(commit(()=>data.fitness.custom.push({id:'custom-'+uid(),name,type,muscle:type==='cardio'?'Cardio':muscle,equipment,cue,timed:false})))redraw();},true);
 return {render:fitnessHTML,normalize:normalizeFitness,open(view='workouts'){tab=view==='workout'?(data.fitness.active?'session':'workouts'):view;detail=null;page='fitness';render();}};
})();

load();theme();render();
