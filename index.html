@media(max-width:540px){.today-quick-actions{gap:7px}.today-quick-actions .btn{font-size:11px;padding:10px 12px;flex:1}.today-quick-actions .btn:first-child{flex-basis:calc(50% - 7px)}.daily-intake-hero{padding:23px}.daily-intake-hero .section-head{flex-wrap:wrap}.daily-intake-hero .hero-value{font-size:40px}.daily-intake-hero .hero-main{gap:12px}.daily-intake-hero .hero-main svg{width:95px;height:95px;flex:none}.today-nutrition-side{grid-template-columns:1fr}.today-target.card{padding:21px}.today-habit-strip{padding:16px 0}.today-habit-strip>div{padding:0 12px}.today-habit-strip strong{font-size:18px}.today-habit-strip .hint{font-size:8px}.today-habit-strip small{font-size:9px}.welcome-card{padding:22px}.food-date-bar{flex-wrap:wrap}.food-date-bar>.row{flex-wrap:wrap;gap:7px}.food-date-bar input[type=date]{width:153px}.food-date-bar>.btn{font-size:11px}.food-intake-card{padding:21px}.food-intake-card .section-head{flex-wrap:wrap}.food-intake-metrics{gap:10px}.food-intake-metrics .big{font-size:24px}.food-intake-metrics .unit{font-size:9px}.food-intake-metrics .stat-label{font-size:8px}.food-quick-list .section-head{gap:12px}.recent-food-card{padding:16px}.recent-food-card strong{font-size:12px}.food-diary-meals,.food-plan-grid{grid-template-columns:1fr}.food-entry{gap:5px}.food-entry .cal{font-size:10px}.food-entry .name{font-size:12px}.food-meal-card .mealhead h3{font-size:15px}.nutrition-day-grid{gap:5px}.nutrition-day{padding:10px 2px}.nutrition-day span{font-size:7px}.nutrition-day small{font-size:8px}.plan-composer,.shopping-panel{padding:19px}.food-sheet-inner{padding:22px}.food-sheet-inner .formgrid{gap:12px}.food-sheet-inner h2{font-size:21px}.target-summary{font-size:11px}.trend-legend{gap:13px;font-size:9px}}

<body>
<header><div class="header-inner"><div class="brand-lockup"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18V6h12M6 12h9M14 18l4-6"/></svg></span><div><div class="brand">Fuel<span>Track</span></div><div class="version">NUTRITION & TRAINING</div></div></div><div class="header-actions"><button class="iconbtn" id="themeQuick" aria-label="Toggle light or dark appearance"></button><button class="iconbtn header-settings" id="settingsButton" data-ui="settings" aria-label="Open settings" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4m6 0h8M3 17h10m6 0h2"/><circle cx="10" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg></button></div></div></header>

<script>
"use strict";
const KEY="fueltrack-v1";
const nutrientDefs=[
 {key:"carbs",label:"Carbohydrates",unit:"g",group:"Macros",target:225},
 {key:"fat",label:"Total fat",unit:"g",group:"Macros",target:60},
 {key:"fiber",label:"Fibre",unit:"g",group:"Macros",target:30},
 {key:"saturatedFat",label:"Saturated fat",unit:"g",group:"Macros",target:20},
 {key:"sugar",label:"Sugars",unit:"g",group:"Macros",target:null},
 {key:"sodium",label:"Sodium",unit:"mg",group:"Minerals",target:2000},
 {key:"potassium",label:"Potassium",unit:"mg",group:"Minerals",target:3500},
 {key:"calcium",label:"Calcium",unit:"mg",group:"Minerals",target:1000},
 {key:"iron",label:"Iron",unit:"mg",group:"Minerals",target:14},
 {key:"magnesium",label:"Magnesium",unit:"mg",group:"Minerals",target:300},
 {key:"zinc",label:"Zinc",unit:"mg",group:"Minerals",target:10},
 {key:"vitaminA",label:"Vitamin A",unit:"µg",group:"Vitamins",target:800},
 {key:"vitaminC",label:"Vitamin C",unit:"mg",group:"Vitamins",target:80},
 {key:"vitaminD",label:"Vitamin D",unit:"µg",group:"Vitamins",target:10},
 {key:"vitaminE",label:"Vitamin E",unit:"mg",group:"Vitamins",target:12},
 {key:"vitaminB12",label:"Vitamin B12",unit:"µg",group:"Vitamins",target:2.4},
 {key:"folate",label:"Folate",unit:"µg",group:"Vitamins",target:200}
];
const nutrientDefaults=Object.fromEntries(nutrientDefs.filter(n=>n.target!==null).map(n=>[n.key,n.target]));
const defaults={targets:{calories:1800,protein:150,water:2.5,goalWeight:null,startWeight:null,nutrients:nutrientDefaults},foods:[],weights:[],activity:{},favorites:[],savedMeals:[],settings:{theme:"dark"}};
let data,page="today",searchResults=[],scanner=null,editingId=null,selectedMeal="Breakfast",weeklyOffset=0;
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const shift=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dateObj=s=>new Date(s+"T12:00:00");
const fmt=s=>dateObj(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const longDate=s=>dateObj(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const num=(v,f=0)=>v===null||v===undefined||v===""?f:(Number.isFinite(Number(v))?Number(v):f);
const round=(v,n=0)=>Number(num(v).toFixed(n));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
const pct=(v,t)=>t>0?Math.max(0,Math.min(100,v/t*100)):0;
const btn=(text,action,cls="")=>`<button class="btn ${cls}" data-action="${action}">${text}</button>`;
const empty=s=>`<div class="empty">${s}</div>`;
function normalize(raw){
 const d=raw&&typeof raw==="object"?raw:{};
 d.targets={...defaults.targets,...(d.targets||{})};
 d.targets.nutrients={...nutrientDefaults,...(d.targets?.nutrients||{})};
 d.foods=Array.isArray(d.foods)?d.foods:[];d.weights=Array.isArray(d.weights)?d.weights:[];d.activity=d.activity&&typeof d.activity==="object"?d.activity:{};
 d.foods=d.foods.map(f=>({...f,id:f.id||id(),date:f.date||today(),name:String(f.name||"Food"),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),meal:f.meal||"Snacks"}));
 d.weights=d.weights.map(w=>({...w,id:w.id||id(),date:w.date||today(),kg:num(w.kg)})).filter(w=>w.kg>0);
 for(const [date,a] of Object.entries(d.activity))d.activity[date]={steps:Math.max(0,num(a?.steps)),water:Math.max(0,num(a?.water))};
 d.favorites=Array.isArray(d.favorites)?d.favorites:[];d.savedMeals=Array.isArray(d.savedMeals)?d.savedMeals:[];d.settings={...defaults.settings,...(d.settings||{})};d.fitness=Fitness.normalize(d.fitness);return FoodPlus.normalize(d);
}
function load(){try{data=normalize(JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(JSON.stringify(defaults)))}catch(e){data=normalize(JSON.parse(JSON.stringify(defaults)));alert("Saved data could not be read. Do not clear browser data; use your backup if needed.")}}
function save(){try{if(globalThis.FuelTrackCloud?.canSave&&!FuelTrackCloud.canSave())return false;localStorage.setItem(KEY,JSON.stringify(data));globalThis.FuelTrackCloud?.changed();return true}catch(e){alert("FuelTrack couldn't save. Export a backup and check browser storage.");return false}}
function theme(){document.documentElement.dataset.theme=data.settings.theme==="light"?"light":"dark";$("themeQuick").innerHTML=data.settings.theme==="light"?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';document.querySelector('meta[name="theme-color"]').content=data.settings.theme==="light"?"#f6f5fa":"#121017"}
function setTheme(v){data.settings.theme=v;save();theme();render()}
function foodsOn(date=today()){return data.foods.filter(f=>f.date===date)}
function totals(fs){return fs.reduce((a,f)=>({calories:a.calories+num(f.calories),protein:a.protein+num(f.protein)}),{calories:0,protein:0})}
function nutrientTotals(fs){const out={};for(const n of nutrientDefs){let sum=0,count=0;for(const f of fs){if(f.nutrients&&f.nutrients[n.key]!==null&&f.nutrients[n.key]!==undefined&&f.nutrients[n.key]!==""&&Number.isFinite(Number(f.nutrients[n.key]))){sum+=Math.max(0,Number(f.nutrients[n.key]));count++}}out[n.key]={value:sum,count,entries:fs.length}}return out}
function activity(date=today()){return data.activity[date]||{steps:0,water:0}}
function weightsSorted(){return [...data.weights].sort((a,b)=>a.date.localeCompare(b.date))}
function latestWeight(){return weightsSorted().slice(-1)[0]}
function weightBefore(date){return weightsSorted().filter(w=>w.date<=date).slice(-1)[0]}
function progressBar(v,t){return `<div class="progress"><div style="width:${pct(v,t)}%"></div></div>`}
function stat(label,value,unit="",sub=""){return `<div class="card"><div class="stat-label">${label}</div><div class="big">${value}<span class="unit"> ${unit}</span></div>${sub?`<div class="hint">${sub}</div>`:""}</div>`}

function ring(v,t){const p=pct(v,t),c=2*Math.PI*43;return `<div style="width:116px;flex:none;position:relative" aria-label="${Math.round(p)} percent of calorie target"><svg viewBox="0 0 100 100" style="display:block;transform:rotate(-90deg)"><circle cx="50" cy="50" r="43" fill="none" stroke="var(--panel2)" stroke-width="6"/><circle cx="50" cy="50" r="43" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><strong style="font-size:22px;letter-spacing:-.6px">${Math.round(p)}%</strong><span style="font-size:10px;color:var(--muted)">of daily target</span></div></div>`;}

function title(t,s=''){return `<div class="page-heading"><div><p class="eyebrow">Your daily rhythm</p><h1>${t}</h1>${s?`<p class="muted">${s}</p>`:''}</div></div>`;}
function chart(points,color="var(--accent)",label="Progress"){if(!points.length)return empty("Log some entries to see your chart.");const W=340,H=165,L=35,R=10,T=12,B=25,vals=points.map(p=>num(p.value));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}min=Math.max(0,min-(max-min)*.1);max+=(max-min)*.1;const x=i=>L+(points.length===1?(W-L-R)/2:i*(W-L-R)/(points.length-1)),y=v=>T+(H-T-B)-(v-min)/(max-min)*(H-T-B);const path=points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.value)).join(" ");const grid=[0,1,2,3].map(i=>{let v=min+(max-min)*i/3,yy=y(v);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${round(v,1)}</text>`}).join("");const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="3" fill="${color}"><title>${esc(p.label)}: ${round(p.value,1)}</title></circle>`).join("");const labels=points.map((p,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(p.label)}</text>`:"").join("");return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg></div>`}
function foodRow(f){return `<div class="entry"><div class="grow"><div class="name">${esc(f.name)} ${data.favorites.includes(f.name)?"★":""}</div><div class="sub">${esc(f.meal)} · ${round(f.protein,1)}g protein${f.date!==today()?" · "+fmt(f.date):""}${f.nutrients&&Object.values(f.nutrients).some(v=>v!==null&&v!==undefined&&v!=="")?" · nutrition details saved":""}</div></div><div class="cal">${Math.round(f.calories)} kcal</div><button class="iconbtn" data-action="editfood:${f.id}" aria-label="Edit food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L9 19l-5 1 1-5Z"/></svg></button><button class="iconbtn" data-action="deletefood:${f.id}" aria-label="Delete food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button></div>`}

function render(){if(scanner)stopScanner();theme();if(page==='nutrition'){page='food';foodView='nutrition';}if(page==='weight'||page==='weekly'){progressView=page;page='progress';}document.querySelectorAll('#nav button').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('settingsButton').setAttribute('aria-pressed',String(page==='settings'));const views={today:renderToday,food:renderFoodHub,fitness:Fitness.render,progress:renderProgressHub,settings:renderSettings};$('app').innerHTML=(views[page]||renderToday)();}

function legacyRenderToday(){const fs=foodsOn(),t=totals(fs),a=activity(),nt=nutrientTotals(fs),w=latestWeight(),ct=num(data.targets.calories,1800),pt=num(data.targets.protein,150),wt=num(data.targets.water,2.5),left=ct-t.calories,training=data.fitness.active,todaySessions=data.fitness.sessions.filter(s=>s.date===today());const macro=(label,value,target,known=true)=>`<div><div class="stat-label">${label}</div><strong>${known?round(value):'—'} <span class="unit">g</span></strong>${progressBar(value,target)}<p class="hint">${known?`of ${target}g`:'No data yet'}</p></div>`;return `${title('Make today count.',longDate(today()))}<div class="dashboard-grid"><section class="card hero-card"><div class="section-head"><h2>Daily nutrition</h2><span class="pill accent">${fs.length} entries logged</span></div><div class="hero-main"><div><div class="stat-label">Calories consumed</div><div class="hero-value">${Math.round(t.calories)} <span class="unit">kcal</span></div><p class="hint" style="margin-top:9px"><strong class="${left<0?'red':'accent'}">${Math.round(Math.abs(left))} kcal ${left<0?'over target':'remaining'}</strong> · ${ct} target</p></div>${ring(t.calories,ct)}</div><div class="macro-grid">${macro('Protein',t.protein,pt)}${macro('Carbs',nt.carbs.value,num(data.targets.nutrients.carbs,225),!!nt.carbs.count)}${macro('Fat',nt.fat.value,num(data.targets.nutrients.fat,60),!!nt.fat.count)}</div><div style="margin-top:22px">${uiButton(icon('plus')+' Log food','foodtool:search','primary full')}</div></section><section class="card"><div class="section-head"><h2>Daily check-in</h2><span class="pill">Today</span></div><div class="row"><div class="mini-icon">${icon('water')}</div><div class="grow"><div class="stat-label">Water</div><div class="big">${round(a.water,2)} <span class="unit">/ ${wt} L</span></div></div><span class="pill green">${Math.round(pct(a.water,wt))}%</span></div>${progressBar(a.water,wt)}<div class="water-buttons">${btn('+250 ml','wateradd:0.25','small')}${btn('+500 ml','wateradd:0.5','small')}${uiButton('Edit','wateredit','small')}</div><hr><div class="checkin-row"><div class="row"><div class="mini-icon">${icon('steps')}</div><div><strong>${Math.round(a.steps).toLocaleString()}</strong><div class="hint">Steps today</div></div></div>${uiButton('Update','stepsedit','small')}</div><div class="checkin-row"><div class="row"><div class="mini-icon">${icon('weight')}</div><div><strong>${w?round(w.kg,1)+' kg':'No weigh-in'}</strong><div class="hint">${w?'Latest · '+fmt(w.date):'Track your longer-term trend'}</div></div></div>${uiButton('Log','progressview:weight','small')}</div></section></div><div class="training-banner"><div><p class="eyebrow">Training</p><h2>${training?'Your session is ready to continue':todaySessions.length?'Workout logged. Keep building.':'A little stronger, one session at a time.'}</h2><p class="hint">${training?esc(training.name)+' · '+training.exercises.length+' exercises':todaySessions.length?todaySessions.length+' session'+(todaySessions.length>1?'s':'')+' recorded today':'Choose a routine, log your sets, or make time for cardio.'}</p></div>${uiButton(training?'Continue workout':todaySessions.length?'Open training':'Start a workout','training','primary')}</div><div class="grid section"><section class="card"><div class="section-head"><h2>Meals today</h2>${uiButton('View diary','foodview:diary','small ghost')}</div>${['Breakfast','Lunch','Dinner','Snacks'].map(m=>{const list=fs.filter(f=>f.meal===m);return `<div class="meal-summary"><div class="grow"><strong>${m}</strong><p class="hint">${list.length?list.length+' food'+(list.length>1?'s':'')+' logged':'Not logged yet'}</p></div><span class="cal">${list.length?Math.round(totals(list).calories)+' kcal':'—'}</span>${btn('+ Add','addmeal:'+m,'small')}</div>`}).join('')}</section><section class="card"><div class="section-head"><h2>Your next step</h2>${icon('progress')}</div><p class="muted">Small, consistent entries make your progress easier to see.</p><div class="checkin-row"><div><strong>Nutrition detail</strong><p class="hint" style="margin:3px 0 0">${nutrientDefs.filter(n=>nt[n.key].count).length} of ${nutrientDefs.length} nutrients recorded today</p></div>${uiButton('View','foodview:nutrition','small')}</div><div class="checkin-row"><div><strong>Weekly review</strong><p class="hint" style="margin:3px 0 0">Food, water, steps and training together.</p></div>${uiButton('View','progressview:weekly','small')}</div><p class="hint" style="margin:17px 0 0">Your totals reflect recorded entries. Missing data is never a complete picture of your day.</p></section></div><div class="grid today-checkins"><details id="checkin-water" class="checkin-details"><summary>Edit water total</summary><form id="waterForm"><label for="water">Water consumed today (litres)</label><input id="water" type="number" min="0" step=".05" value="${a.water}" required><button class="btn primary full form-actions">Save water</button></form></details><details id="checkin-steps" class="checkin-details"><summary>Edit step count</summary><form id="stepsForm"><label for="steps">Steps today</label><input id="steps" type="number" min="0" step="1" value="${a.steps}" required><button class="btn primary full form-actions">Save steps</button></form></details></div>`;}
function nutrientRows(fs,editableTargets=false){const sums=nutrientTotals(fs);return ["Macros","Minerals","Vitamins"].map(group=>{const list=nutrientDefs.filter(n=>n.group===group);return `<div class="nutrient-group"><h3>${group}</h3>${list.map(n=>{const s=sums[n.key],target=data.targets.nutrients[n.key],known=s.count>0;return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${known?`${s.count} of ${fs.length} food entries provide this value`:`No recorded values yet`}</div></div><div class="nutrient-amount">${known?`${round(s.value,1)} ${n.unit}`:"—"}${target?`<div class="nutrient-meta">Goal ${round(target,1)} ${n.unit}</div>`:""}</div>${target?progressBar(known?s.value:0,target):""}</div>`}).join("")}</div>`}).join("")}

function renderNutrition(){const fs=foodsOn(diaryDate),sums=nutrientTotals(fs),count=nutrientDefs.filter(n=>sums[n.key].count).length;return `<div class="date-row"><p class="hint" style="margin:0">Nutrient detail for ${diaryDate===today()?'today':fmt(diaryDate)}</p><input type="date" id="diaryDate" aria-label="Nutrition date" value="${diaryDate}"></div><div class="card"><div class="section-head"><h2>Nutrition coverage</h2><span class="pill accent">${count}/${nutrientDefs.length} nutrients</span></div><p class="hint">A dash means there is no recorded value. Totals can be incomplete when some foods lack nutrient data.</p><div class="metric-strip" style="margin-bottom:0">${metric('Carbohydrates',sums.carbs.count?round(sums.carbs.value,1):'—','g')}${metric('Fat',sums.fat.count?round(sums.fat.value,1):'—','g')}${metric('Fibre',sums.fiber.count?round(sums.fiber.value,1):'—','g')}</div></div><div class="card"><h2>Daily nutrient overview</h2>${nutrientRows(fs)}</div><details><summary>Last seven days · nutrient averages</summary><p class="hint">Averages cover the seven days ending today and only include days with recorded values.</p>${weeklyNutrientSummary()}</details><details><summary>Edit nutrient targets</summary><p class="hint">These are editable tracking references. Set a target to 0 to hide its progress bar.</p>${nutrientTargetForm()}</details>`;}
function weeklyNutrientSummary(days=Array.from({length:7},(_,i)=>shift(today(),i-6))){const totalsByKey={};for(const n of nutrientDefs){const vals=[];for(const d of days){const fs=foodsOn(d),sum=nutrientTotals(fs)[n.key];if(sum.count)vals.push(sum.value)}totalsByKey[n.key]={value:avg(vals),days:vals.length}}return ["Macros","Minerals","Vitamins"].map(g=>`<div class="nutrient-group"><h3>${g}</h3>${nutrientDefs.filter(n=>n.group===g).map(n=>{const s=totalsByKey[n.key];return `<div class="nutrient-row"><div><div class="nutrient-name">${n.label}</div><div class="nutrient-meta">${s.days} of 7 days with data</div></div><div class="nutrient-amount">${s.value===null?"—":`${round(s.value,1)} ${n.unit}`}</div></div>`}).join("")}</div>`).join("")}

function renderFood(){return FoodPlus.renderFood();}
function searchRow(p,i){return `<div class="entry"><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${Math.round(p.calories)} kcal · ${round(p.protein,1)}g protein per 100g</div></div>${btn("Add","searchadd:"+i,"small primary")}</div>`}

function renderWeight(){const ws=weightsSorted(),recent=ws.filter(w=>w.date>=shift(today(),-6)&&w.date<=today()),latest=ws.filter(w=>w.date<=today()).at(-1);return `<div class="grid"><section class="card"><div class="section-head"><h2>Log a weigh-in</h2><span class="pill">kg</span></div><form id="weightForm" class="formgrid"><div><label for="weightDate">Date</label><input type="date" id="weightDate" value="${today()}" required></div><div><label for="weightKg">Weight (kg)</label><input type="number" id="weightKg" min="1" max="500" step=".1" placeholder="e.g. 80.5" required></div><div class="wide form-actions"><button class="btn primary full">Save weight</button></div></form></section><section class="card"><h2>Latest snapshot</h2><div class="metric-strip" style="grid-template-columns:1fr 1fr;margin-bottom:0">${metric('Latest',latest?round(latest.kg,1):'—','kg',latest?fmt(latest.date):'No entries yet')}${metric('7-day average',recent.length?round(avg(recent.map(w=>w.kg)),1):'—','kg',recent.length+' weigh-ins')}</div></section></div><section class="card section"><h2>Weight history</h2>${ws.length?[...ws].reverse().map(w=>`<div class="entry"><div class="grow"><strong>${longDate(w.date)}</strong></div><span class="cal">${round(w.kg,1)} kg</span>${btn('Delete','deleteweight:'+w.id,'small danger')}</div>`).join(''):empty('Add your first weigh-in. Your records and trends will appear here.')}</section>`;}

function renderProgress(){return FoodPlus.renderProgress();}
function weekStart(s){const d=dateObj(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

function renderWeekly(){const start=shift(weekStart(today()),weeklyOffset*7),end=shift(start,6),days=Array.from({length:7},(_,i)=>shift(start,i)),rows=days.map(date=>({date,foods:foodsOn(date),totals:totals(foodsOn(date)),activity:activity(date)})),logged=rows.filter(d=>d.foods.length),ca=avg(logged.map(d=>d.totals.calories)),pa=avg(logged.map(d=>d.totals.protein)),sessions=data.fitness.sessions.filter(s=>s.date>=start&&s.date<=end),water=rows.filter(d=>d.activity.water>0),steps=rows.filter(d=>d.activity.steps>0),w1=weightBefore(start),w2=weightBefore(end),delta=w1&&w2?w2.kg-w1.kg:null;return `<div class="week-nav">${btn('←','weekprev','small')}<div style="text-align:center"><strong>${fmt(start)} – ${fmt(end)}</strong><div>${btn('This week','weektoday','small ghost')}</div></div><button class="btn small" data-action="weeknext" ${weeklyOffset===0?'disabled':''} aria-label="Next week">→</button></div><div class="metric-strip">${metric('Avg calories',ca===null?'—':Math.round(ca),'kcal',logged.length+' logged days')}${metric('Avg protein',pa===null?'—':round(pa,1),'g','Logged-food days')}${metric('Training',sessions.length,'sessions','This selected week')}</div><div class="grid"><section class="card"><h2>Daily breakdown</h2>${rows.map(d=>`<div class="entry"><div class="grow"><div class="name">${dateObj(d.date).toLocaleDateString(undefined,{weekday:'short'})} · ${fmt(d.date)}</div><div class="sub">${Math.round(d.activity.steps).toLocaleString()} steps · ${round(d.activity.water,2)} L water</div></div><div class="cal">${d.foods.length?Math.round(d.totals.calories)+' kcal':'Not logged'}<div class="sub">${d.foods.length?round(d.totals.protein,1)+'g protein':''}</div></div></div>`).join('')}</section><section class="card"><h2>Weekly summary</h2><div class="checkin-row"><span class="hint">Average steps</span><strong>${steps.length?Math.round(avg(steps.map(d=>d.activity.steps))).toLocaleString():'—'}</strong></div><div class="checkin-row"><span class="hint">Average water</span><strong>${water.length?round(avg(water.map(d=>d.activity.water)),2)+' L':'—'}</strong></div><div class="checkin-row"><span class="hint">Weight change</span><strong>${delta===null?'—':(delta>0?'+':'')+round(delta,2)+' kg'}</strong></div><p class="hint" style="margin-top:12px">Steps and water averages use days with positive entries. Weight change uses the nearest recorded weigh-ins on or before the week boundaries.</p><hr><h3>Food logging</h3><div class="big">${logged.length} <span class="unit">of 7 days</span></div>${progressBar(logged.length,7)}<p class="hint">Logging consistency reflects recorded entries, not food quality.</p></section></div><details><summary>Nutrition averages for this week</summary><p class="hint">Only days with recorded values contribute to each nutrient average.</p>${weeklyNutrientSummary(days)}</details><div class="row wrap">${btn('Export weekly report','exportweek','primary')}</div>`;}

function renderSettings(){return `<div class="page-heading"><div><p class="eyebrow">Make it yours</p><h1>Settings</h1><p class="muted">Your targets, preferences and backups.</p></div>${uiButton('Done','back','small')}</div><div class="settings-grid"><section class="card wide"><h2>Daily targets</h2><form id="targetsForm" class="formgrid"><div><label for="targetCalories">Calories (kcal)</label><input id="targetCalories" type="number" min="1" max="10000" value="${num(data.targets.calories,1800)}" required></div><div><label for="targetProtein">Protein (g)</label><input id="targetProtein" type="number" min="1" max="1000" value="${num(data.targets.protein,150)}" required></div><div><label for="targetWater">Water (litres)</label><input id="targetWater" type="number" min=".1" max="15" step=".1" value="${num(data.targets.water,2.5)}" required></div><div><label for="startWeight">Starting weight (kg)</label><input id="startWeight" type="number" min="1" max="500" step=".1" value="${esc(data.targets.startWeight??'')}" placeholder="Optional"></div><div><label for="goalWeight">Goal weight (kg)</label><input id="goalWeight" type="number" min="1" max="500" step=".1" value="${esc(data.targets.goalWeight??'')}" placeholder="Optional"></div><div class="wide form-actions"><button class="btn primary">Save targets</button></div></form><p class="hint" style="margin-top:14px">Targets are personal tracking references.</p></section><section class="card"><h2>Appearance</h2><p><button class="btn small" type="button" data-food="setup">Review first-use setup</button></p><p class="hint">Choose the view that feels right for you.</p><div class="row wrap">${btn('Light','theme:light',data.settings.theme==='light'?'primary':'')}${btn('Dark','theme:dark',data.settings.theme!=='light'?'primary':'')}</div></section><section class="card"><h2>Backup & restore</h2><p class="hint">Your records are saved in this browser. Export a backup before switching devices or replacing the app.</p><div class="row wrap">${btn('Export backup','export','primary')}${btn('Restore backup','import')}</div><p class="hint" style="margin:12px 0 0">Includes food, weights, activity, saved workout plans, training history, timers and preferences. Restoring replaces current records.</p></section><section class="card wide"><h2>Your records</h2><div class="metric-strip" style="margin-bottom:0">${metric('Food entries',data.foods.length)}${metric('Weigh-ins',data.weights.length)}${metric('Workouts',data.fitness.sessions.length)}</div><details><summary>Advanced nutrient targets</summary>${nutrientTargetForm()}</details><details><summary>Add FuelTrack to your iPhone Home Screen</summary><p class="hint">When FuelTrack is hosted as a website, open it in Safari, tap Share, then Add to Home Screen.</p></details></section><details class="card wide"><summary>Installation & sync · optional</summary>${globalThis.FuelTrackPWA?.card()||""}${globalThis.FuelTrackCloud?.card()||""}</details></div><footer>FuelTrack 4.8 · Nutrition & training, together.</footer>`;}
function nutrientInputs(old={}){return `<details><summary>Advanced nutrition (optional)</summary><p class="hint">Enter nutrient values for the portion you are logging, not per 100g. Leave unknown values blank.</p><div class="formgrid">${nutrientDefs.map(n=>`<div><label for="nut_${n.key}">${n.label} (${n.unit})</label><input id="nut_${n.key}" type="number" min="0" max="100000" step=".01" value="${old.nutrients&&old.nutrients[n.key]!=null?esc(old.nutrients[n.key]):""}" placeholder="Unknown / not provided"></div>`).join("")}</div></details>`}
function legacyOpenManual(f=null,meal=null){const old=f||{},m=meal||old.meal||selectedMeal||"Snacks";$("editorOverlay")?.remove();const html=`<div id="editorOverlay" class="card"><div class="between"><h2>${f?"Edit food":"Manual food entry"}</h2>${btn("Cancel","cancelmanual","small")}</div><form id="manualForm" class="formgrid"><div class="wide"><label for="foodName">Food name</label><input id="foodName" required maxlength="160" value="${esc(old.name||"")}" placeholder="e.g. Chicken breast"></div><div><label for="foodCalories">Calories for one portion (kcal)</label><input id="foodCalories" type="number" min="0" max="100000" step=".1" required value="${old.calories??""}"></div><div><label for="foodProtein">Protein for one portion (g)</label><input id="foodProtein" type="number" min="0" max="10000" step=".1" required value="${old.protein??""}"></div><div><label for="foodQuantity">Number of portions</label><input id="foodQuantity" type="number" min=".01" max="1000" step=".01" value="1" required></div><div><label for="foodMeal">Meal</label><select id="foodMeal">${["Breakfast","Lunch","Dinner","Snacks"].map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select></div><div><label for="foodDate">Date</label><input id="foodDate" type="date" value="${old.date||today()}" required></div><div><label><input id="makeFavorite" type="checkbox" ${data.favorites.includes(old.name)?"checked":""}> Save as favourite</label></div><div class="wide">${nutrientInputs(old)}<p class="hint">Enter nutrition for one portion; calories, protein and nutrient values are multiplied by the portion count.</p><button class="btn primary full">Save food</button></div></form></div>`;$("app").insertAdjacentHTML("afterbegin",html);editingId=f?.id||null}
function saveManual(){return FoodPlus.saveManual();}
function addFood(o){return FoodPlus.addFood(o);}
function addSearchFood(p){const grams=num(prompt(`How many grams of ${p.name}?\nNutrition shown is per 100g.`, "100"),-1);if(grams<=0)return;const nutrients={};for(const n of nutrientDefs)nutrients[n.key]=p.nutrients&&p.nutrients[n.key]!=null?round(p.nutrients[n.key]*grams/100,3):null;addFood({name:p.name,calories:p.calories*grams/100,protein:p.protein*grams/100,nutrients,meal:selectedMeal,portion:{count:grams/100,label:'100 g',calories:p.calories,protein:p.protein,nutrients:p.nutrients||{}}})}
function saveWeight(date,kg){const old=data.weights.find(w=>w.date===date);if(old)old.kg=kg;else data.weights.push({id:id(),date,kg});data.weights.sort((a,b)=>a.date.localeCompare(b.date));if(save()){page="weight";render()}}
function saveMeal(){const fs=foodsOn();if(!fs.length){alert("Log at least one food today before saving a meal.");return}const name=prompt("Name this saved meal:");if(!name?.trim())return;const t=totals(fs);data.savedMeals.push({id:id(),name:name.trim(),foods:fs.map(f=>({name:f.name,calories:f.calories,protein:f.protein,meal:f.meal||"Snacks",nutrients:f.nutrients||{},portion:FoodPlus.portion(f)})),calories:t.calories,protein:t.protein});if(save())render()}
function addSavedMeal(i){diaryDate=today();const m=data.savedMeals[i];if(!m)return;const fs=Array.isArray(m.foods)&&m.foods.length?m.foods:[{name:m.name,calories:m.calories,protein:m.protein,meal:selectedMeal}];if(fs.some(f=>foodsOn().some(x=>x.name===f.name&&x.calories===f.calories&&x.protein===f.protein))&&!confirm("Some foods in this saved meal already appear today. Add the meal anyway?"))return;fs.forEach(f=>data.foods.push({id:id(),date:today(),name:String(f.name||"Food"),calories:Math.max(0,num(f.calories)),protein:Math.max(0,num(f.protein)),meal:f.meal||selectedMeal,nutrients:f.nutrients||{}}));if(save()){page="food";foodView="diary";render()}}
function copyYesterday(){diaryDate=today();const prev=foodsOn(shift(today(),-1));if(!prev.length){alert("There are no food entries logged for yesterday.");return}if(!confirm(`Copy ${prev.length} food entries from yesterday into today? This adds copies and leaves yesterday unchanged.`))return;prev.forEach(f=>data.foods.push({...f,id:id(),date:today(),nutrients:f.nutrients?{...f.nutrients}:{}}));if(save()){page="food";foodView="diary";render()}}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){downloadJSON({...data,exportedAt:new Date().toISOString(),app:"FuelTrack",version:4.3},`fueltrack-backup-${today()}.json`)}
function exportWeek(){const start=shift(weekStart(today()),weeklyOffset*7),days=Array.from({length:7},(_,i)=>shift(start,i));downloadJSON({app:"FuelTrack",type:"weekly-report",trainingSessions:data.fitness.sessions.filter(s=>days.includes(s.date)),weekStart:start,weekEnd:days[6],days:days.map(date=>({date,calories:totals(foodsOn(date)).calories,protein:totals(foodsOn(date)).protein,nutrients:nutrientTotals(foodsOn(date)),foodEntries:foodsOn(date).length,steps:activity(date).steps,water:activity(date).water})),exportedAt:new Date().toISOString()},`fueltrack-week-${start}.json`)}
function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.foods)||!Array.isArray(parsed.weights)||!parsed.activity||typeof parsed.activity!=="object")throw new Error("This doesn't look like a complete FuelTrack backup.");if(parsed.foods.some(f=>!f||typeof f.name!=="string"||!Number.isFinite(Number(f.calories))||!Number.isFinite(Number(f.protein)))||parsed.weights.some(w=>!w||!Number.isFinite(Number(w.kg))||Number(w.kg)<=0))throw new Error("Some records have invalid data.");if(!confirm(`Restore this backup? This replaces the current records in this browser.\n\nFood entries: ${parsed.foods.length}\nWeigh-ins: ${parsed.weights.length}\n\nYour exported backup remains unchanged.`))return;data=normalize(parsed);if(save()){page="today";searchResults=[];render();alert("Backup restored. Check your records and targets.")}}catch(e){alert("Couldn't restore this file: "+e.message)}$("importFile").value=""};r.onerror=()=>alert("Could not read this file. Try selecting the JSON backup again.");r.readAsText(file)}
function mapNutrients(n){const x={};const keys={carbs:["carbohydrates_100g","carbohydrates_value"],fat:["fat_100g","fat_value"],fiber:["fiber_100g","fiber_value"],saturatedFat:["saturated-fat_100g","saturated-fat_value"],sugar:["sugars_100g","sugars_value"],sodium:["sodium_100g"],potassium:["potassium_100g"],calcium:["calcium_100g"],iron:["iron_100g"],magnesium:["magnesium_100g"],zinc:["zinc_100g"],vitaminA:["vitamin-a_100g"],vitaminC:["vitamin-c_100g"],vitaminD:["vitamin-d_100g"],vitaminE:["vitamin-e_100g"],vitaminB12:["vitamin-b12_100g"],folate:["folates_100g"]};for(const [key,aliases] of Object.entries(keys)){let v=null;for(const a of aliases){if(n[a]!==undefined&&n[a]!==null&&n[a]!==""&&Number.isFinite(Number(n[a]))){v=Number(n[a]);break}}if(v!==null){if(key==="sodium"||key==="potassium"||key==="calcium"||key==="iron"||key==="magnesium"||key==="zinc")v*=1000; x[key]=Math.max(0,v)}}return x}
async function searchFood(q){const box=$("searchResults");if(box)box.innerHTML=empty("Searching…");try{const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=12");if(!r.ok)throw new Error("Search unavailable");const j=await r.json();searchResults=(j.products||[]).map(p=>{const n=p.nutriments||{};return {name:p.product_name||p.product_name_en||p.generic_name||"",calories:num(n["energy-kcal_100g"],num(n["energy-kcal_value"],num(n["energy_100g"])/4.184)),protein:num(n.proteins_100g),barcode:p.code||"",nutrients:mapNutrients(n)}}).filter(p=>p.name);if(box)box.innerHTML=searchResults.length?searchResults.map(searchRow).join(""):empty("No results. Try another search or manual entry.")}catch(e){if(box)box.innerHTML=empty("Food search couldn't connect. Check your internet connection or use manual entry.")}}
async function lookupBarcode(code){const msg=$("scanMessage");if(msg)msg.textContent="Looking up barcode…";try{const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json"),j=await r.json(),p=j.product;if(!p)throw new Error();const n=p.nutriments||{},name=p.product_name||p.product_name_en,cal=num(n["energy-kcal_100g"],num(n["energy-kcal_value"],num(n["energy_100g"])/4.184)),pro=num(n.proteins_100g);if(!name)throw new Error();if(confirm(`Found: ${name}\nPer 100g: ${Math.round(cal)} kcal, ${round(pro,1)}g protein.\n\nChoose grams next?`)){const grams=num(prompt("How many grams?","100"),-1);if(grams>0){const nutrients={};for(const [k,v] of Object.entries(mapNutrients(n)))nutrients[k]=v*grams/100;addFood({name,calories:cal*grams/100,protein:pro*grams/100,nutrients,meal:selectedMeal,portion:{count:grams/100,label:'100 g',calories:cal,protein:pro,nutrients:mapNutrients(n)}})}}}catch(e){if(msg)msg.textContent="Couldn't find that product. Try search or manual entry."}}

async function startScanner(){if(!window.Html5Qrcode){alert('The scanner is still loading or unavailable. Try food search or manual entry.');return;}const token=++scanEpoch;await stopScanner(false);if(token!==scanEpoch)return;let instance;try{if(!$('scanner'))return;instance=new Html5Qrcode('scanner');scanner=instance;const msg=$('scanMessage');if(msg)msg.textContent='Requesting camera access…';await instance.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:150}},async code=>{if(scanner!==instance)return;await stopScanner();await lookupBarcode(code)},()=>{});if(scanner!==instance||token!==scanEpoch){if(instance.isScanning)await instance.stop();try{instance.clear()}catch{}return;}if($('scanMessage'))$('scanMessage').textContent='Point your camera at the product barcode.';}catch(e){if(scanner===instance)scanner=null;if($('scanMessage'))$('scanMessage').textContent='Camera unavailable or permission denied. Use search or manual entry.';}}

async function stopScanner(invalidate=true){if(invalidate)scanEpoch++;const instance=scanner;scanner=null;if(instance){try{if(instance.isScanning)await instance.stop();instance.clear();}catch(e){}}}
function action(s){if(FoodPlus.legacyAction(s))return;const [type,...parts]=s.split(":");const v=parts.join(":");if(type==="wateradd"){const a=activity();data.activity[today()]={...a,water:round(a.water+Math.max(0,num(v)),2)};if(save())render()}else if(type==="gofood"){page="food";render()}else if(type==="gofitness"){page="fitness";render()}else if(type==="gonutrition"){page="nutrition";render()}else if(type==="goweight"){page="weight";render()}else if(type==="gosettings"){page="settings";render()}else if(type==="addmeal"){if(page==="today")diaryDate=today();selectedMeal=v;page="food";render();openManual(null,v)}else if(type==="manualform")openManual();else if(type==="cancelmanual"){$("editorOverlay")?.remove();editingId=null}else if(type==="editfood"){const f=data.foods.find(f=>f.id===v);if(f)openManual({...f})}else if(type==="deletefood"){if(confirm("Delete this food entry?")){data.foods=data.foods.filter(f=>f.id!==v);if(save())render()}}else if(type==="deleteweight"){if(confirm("Delete this weigh-in?")){data.weights=data.weights.filter(w=>w.id!==v);if(save())render()}}else if(type==="searchadd"){const p=searchResults[Number(v)];if(p)addSearchFood(p)}else if(type==="favadd"){const n=decodeURIComponent(v);openManual({name:n,calories:"",protein:"",meal:selectedMeal})}else if(type==="favremove"){data.favorites=data.favorites.filter(n=>n!==decodeURIComponent(v));if(save())render()}else if(type==="savedmeal")addSavedMeal(Number(v));else if(type==="delsavedmeal"){if(confirm("Delete this saved meal?")){data.savedMeals.splice(Number(v),1);if(save())render()}}else if(type==="savemeal")saveMeal();else if(type==="copyyesterday")copyYesterday();else if(type==="export")exportJSON();else if(type==="import")$("importFile").click();else if(type==="theme")setTheme(v);else if(type==="startscan")startScanner();else if(type==="stopscan"){stopScanner();if($("scanMessage"))$("scanMessage").textContent="Scanner stopped."}else if(type==="weekprev"){weeklyOffset--;render()}else if(type==="weeknext"){if(weeklyOffset<0)weeklyOffset++;render()}else if(type==="weektoday"){weeklyOffset=0;render()}else if(type==="exportweek")exportWeek()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(b){e.preventDefault();action(b.dataset.action);return}const n=e.target.closest("[data-page]");if(n){stopScanner();page=n.dataset.page;searchResults=[];render();window.scrollTo({top:0,behavior:"smooth"})}});

 function trend(points,key,target,label){const W=480,H=190,L=38,R=16,T=18,B=32,values=points.filter(p=>p.status!=='empty').map(p=>p[key]),max=Math.max(target,...values,1)*1.12,x=i=>L+i*(W-L-R)/Math.max(1,points.length-1),y=v=>T+(H-T-B)*(1-v/max);let path='',previousComplete=false;points.forEach((p,i)=>{if(p.status==='complete'){path+=(previousComplete?' L':' M')+x(i)+' '+y(p[key]);previousComplete=true;}else previousComplete=false;});const dots=points.map((p,i)=>p.status==='empty'?'':`<circle cx="${x(i)}" cy="${y(p[key])}" r="4" fill="${p.status==='complete'?'var(--accent)':'var(--panel)'}" stroke="var(--accent)" stroke-width="2"><title>${esc(fmt(p.date))}: ${round(p[key],1)} · ${p.status==='complete'?'confirmed complete':'partial log'}</title></circle>`).join('');return `<svg class="chart nutrition-trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}; filled dots are complete days and outlined dots are partial logs"><line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--muted)" stroke-dasharray="4 5"/><text x="${W-R}" y="${y(target)-6}" fill="var(--muted)" font-size="9" text-anchor="end">Target ${target}</text>${[0,.5,1].map(f=>`<text x="${L-7}" y="${y(max*f)+3}" fill="var(--muted)" font-size="9" text-anchor="end">${round(max*f)}</text>`).join('')}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}${[0,6,13].filter(i=>i<points.length).map(i=>`<text x="${x(i)}" y="${H-8}" fill="var(--muted)" font-size="9" text-anchor="middle">${esc(fmt(points[i].date))}</text>`).join('')}</svg>`;}

 function handle(value){const [type,...args]=value.split(':'),v=args.join(':');const f=data.fitness;if(plusAction(type,args,v))return;if(type==='demo'){openDemo(v);return;}if(type.startsWith('demo-')){demoAction(type);return;}if(type==='start-set'){startSet(v);return;}if(type==='end-set'){endSet();return;}if(type==='tab'){tab=v;detail=null;redraw();return;}if(type==='open'){page='fitness';tab=f.active?'session':'workouts';detail=null;redraw();return;}if(type==='session'){tab='session';detail=null;redraw();return;}if(type==='more'){visibleCount+=12;$('ft-results').innerHTML=results();return;}if(type==='new-plan'){beginBuilder();return;}if(type==='edit-draft'){tab='builder';redraw();return;}if(type==='save-plan'){savePlan();return;}if(type==='discard-draft'){if(confirm('Discard this workout draft?')&&commit(()=>{f.draftPlan=null;})){tab='workouts';redraw();}return;}if(type==='toggle-picker'){builderPicking=!builderPicking;redraw();return;}if(type==='plan-add'){const e=find(v);if(e&&f.draftPlan&&commit(()=>f.draftPlan.exercises.push(planExercise(e)))){redraw();notifySaved('Exercise added to your workout');}return;}if(['plan-up','plan-down','plan-remove'].includes(type)){const p=f.draftPlan;if(!p)return;const i=p.exercises.findIndex(e=>e.id===v);if(i<0)return;if(type==='plan-remove'&&!confirm('Remove this exercise from the workout draft?'))return;if(commit(()=>{if(type==='plan-remove')p.exercises.splice(i,1);else{const j=i+(type==='plan-up'?-1:1);if(j>=0&&j<p.exercises.length)[p.exercises[i],p.exercises[j]]=[p.exercises[j],p.exercises[i]];}}))redraw();return;}
 if(['edit-plan','copy-plan','start-plan','delete-plan'].includes(type)){const p=f.plans.find(p=>p.id===v);if(!p)return;if(type==='edit-plan')beginBuilder(p);if(type==='copy-plan')beginBuilder({...clone(p),id:uid(),name:(p.name+' copy').slice(0,100)});if(type==='start-plan')startPlan(p);if(type==='delete-plan'&&confirm('Delete this saved workout? Completed sessions are kept.')&&commit(()=>{f.plans=f.plans.filter(p=>p.id!==v);for(const day of Object.keys(f.schedule||{}))if(f.schedule[day]===v)delete f.schedule[day];}))redraw();return;}
 if(['example','copy-example','start-example','routine'].includes(type)){const p=examples().find(p=>p.id===v)||examples()[Number(v)];if(!p)return;if(type==='example'){exampleId=p.id;detail=null;tab='example';redraw();}else if(type==='copy-example')beginBuilder({...clone(p),id:uid()});else startPlan(p);return;}

 const a=f.active;if(!a)return;if(type==='toggle-timer'){if(commit(()=>{if(a.runningSince!==null)pauseTimer(a);else resumeTimer(a);}))redraw();return;}if(type==='rest'){if(a.setTimer&&num(v)>0){alert('End the current set before starting rest.');return;}if(commit(()=>{if(num(v)>0)beginRest(a,num(v));else a.rest=blankRest();}))updateTimers();return;}if(type==='finish'){finish();return;}if(type==='discard'){if(confirm('Discard the current session and its timer?')&&commit(()=>{f.active=null;})){tab='workouts';detail=null;redraw();}return;}if(type==='remove-set'){const e=a.exercises.find(e=>e.id===args[0]),i=Number(args[1]);if(!e)return;if(a.setTimer?.exerciseId===e.id&&a.setTimer.setIndex===i){alert('End this set before removing it.');return;}if(e.sets[i]?.done&&!confirm('Remove this completed set?'))return;if(commit(()=>{e.sets.splice(i,1);if(a.setTimer?.exerciseId===e.id&&i<a.setTimer.setIndex)a.setTimer.setIndex--;}))redraw();return;}

 else if(d.cardio){const e=a.exercises.find(x=>x.id===d.cardio);if(e&&['minutes','km','notes'].includes(d.field))ok=commit(()=>{e[d.field]=el.value;});}

globalThis.FuelTrackCloud=(()=>{

 function validConfig(url,key){const u=new URL(url);if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co')||u.username||u.password||u.port||u.search||u.hash||u.pathname!=='/')throw Error('Use your https://PROJECT.supabase.co Project URL.');

 }
 const button=(label,action,cls='')=>`<button type="button" class="btn ${cls}" data-cloud="${action}">${label}</button>`;

  return `<div class="section-head"><h2>Account & sync</h2><span class="pill" id="cloud-network">${online()?'Online':'Offline'}</span></div><p id="cloud-status" class="hint" role="status">${esc(message)}</p>${session?`<p>Signed in as <strong>${esc(session.user.email||'your account')}</strong></p><p class="hint">${meta.lastSynced?'Last sync: '+esc(new Date(meta.lastSynced).toLocaleString()):'No cloud copy saved yet.'}</p><div class="row wrap">${button('Sync now','sync','primary')}${button('Sign out','logout')}</div>${!ownerMismatch&&(conflict||needsPull)?`<div class="notice"><strong>${needsPull?'New cloud records':'Choose the records to keep'}</strong><p>Copies are replaced as a whole, not merged. Export a backup first. The replaced copy is also retained on this device.</p><div class="row wrap">${remote?button('Use cloud records','pull','primary'):''}${button('Use this device’s records','push')}</div></div>`:''}`:config?`<form id="cloud-login" class="formgrid"><div><label for="cloud-email">Email</label><input id="cloud-email" type="email" autocomplete="username" required></div><div><label for="cloud-password">Password</label><input id="cloud-password" type="password" autocomplete="current-password" required minlength="6"></div><div class="wide"><button class="btn primary">Sign in</button></div></form><p class="hint">Use the account created in your Supabase dashboard. Your password is never saved by FuelTrack.</p>`:'<p>Connect your free Supabase project to use the same records on another device. The app works without an account.</p>'}

  ${!session?`<details><summary>${config?'Cloud connection settings':'Connect your Supabase project'}</summary><form id="cloud-config"><label for="cloud-url">Project URL</label><input id="cloud-url" type="url" placeholder="https://your-project.supabase.co" value="${esc(config?.url||'')}" required><label for="cloud-key">Publishable key (or legacy anon key)</label><input id="cloud-key" autocomplete="off" value="${esc(config?.key||'')}" required><p class="hint">Find these in your Supabase project’s Connect / API settings. Never use a secret or service-role key.</p><button class="btn primary">Save connection</button></form></details>`:''}<p class="hint">Cloud sync is a second copy, not a versioned backup. Keep exporting JSON backups.</p>`;

  if(action==='logout'){epoch++;clearTimeout(debounce);const old=session;localStorage.removeItem(AUTH);session=null;remote=null;conflict=false;needsPull=false;message='Signed out. Records remain on this device. Sign in with the same account to resume.';ui(true);if(old&&config&&online())fetch(config.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:config.key,Authorization:'Bearer '+old.access_token}}).catch(()=>{});return;}
  if(action==='sync'){await sync();return;}
  if(!session||!['pull','push'].includes(action))return;
  if(!confirm(action==='pull'?'Replace this device’s records with the cloud copy? A recovery copy will be retained here.':'Replace cloud records with this device’s records? A recovery copy of the cloud records will be retained here.'))return;
  busy=true;const generation=epoch,seq=meta.seq;
  try{const fresh=await getRemote();if(generation!==epoch)return;if(seq!==meta.seq)throw Error('Your records changed during this check. Try again.');
   if(action==='pull'){if(!fresh)throw Error('No cloud records to load.');if(remote&&fresh.revision!==remote.revision){remote=fresh;message='Cloud records changed again. Review and choose again.';ui(true);return;}applyRemote(fresh);}
   else{if(remote&&fresh?.revision!==remote.revision){remote=fresh;message='Cloud records changed again. Review and choose again.';ui(true);return;}if(fresh)safeCopy(fresh.payload,'Cloud copy before device upload');await upload(fresh?.revision||0);}
  }catch(error){message=error.message;ui();}finally{busy=false;}
 },true);
 window.addEventListener('online',()=>{message='Back online. Checking for changes…';ui();sync();});window.addEventListener('offline',()=>{message='Offline. Your records still save on this device.';ui();});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();});
 // Another tab changing the data must not be silently overwritten by this tab.
 window.addEventListener('storage',event=>{if(event.key===KEY||event.key===AUTH||event.key===CONFIG){epoch++;staleTab=true;conflict=true;message='Another tab changed your records or connection. Reload this tab before continuing.';ui(true);alert(message);}});
 setInterval(()=>{if(document.visibilityState==='visible'&&session&&!conflict&&!needsPull)sync();},60000);
 if(session)setTimeout(sync,1000);
 return {changed,canSave(){if(staleTab){alert('Reload this tab first. Another tab has changed your records.');return false;}return true;},card:()=>`<section class="card wide" id="cloud-card">${cardInner()}</section>`,sync};
})();

</script>
<script>
globalThis.FuelTrackPWA=(()=>{
 let registration=null,installPrompt=null,wakeLock=null,audio=null,seenRest=null,expiredWhileHidden=false,reloading=false;
 const prefs=()=>{try{return JSON.parse(localStorage.getItem('fueltrack-phone-options'))||{};}catch{return {};}};
 let options=prefs(),status=location.protocol==='file:'?'Upload the app folder to GitHub Pages to enable installation and offline access.':'Preparing offline access…';
 function saveOptions(){localStorage.setItem('fueltrack-phone-options',JSON.stringify(options));}
 function card(){return `<section class="card wide" id="phone-card"><h2>Phone & offline access</h2><p class="hint" id="pwa-status" role="status">${esc(status)}</p><p>On iPhone: open your hosted FuelTrack link in Safari, tap Share, then <strong>Add to Home Screen</strong>.</p><div class="row wrap">${installPrompt?'<button class="btn primary" data-phone="install">Install FuelTrack</button>':''}${registration?.waiting?'<button class="btn primary" data-phone="update">Install app update</button>':''}<button class="btn" data-phone="sound">Rest sound: ${options.sound?'on':'off'}</button><button class="btn" data-phone="awake">Keep screen awake: ${options.awake?'on':'off'}</button><button class="btn small" data-phone="test">Test rest sound</button></div><p class="hint">Workouts, manual food entries and timers work offline after the first successful online load. Search, videos and cloud sync need internet. Rest sounds work while the app is open; iPhone may suspend them when locked.</p><p class="hint" id="wake-status">${options.awake?'Screen wake lock is requested during an active workout, where supported.':'Screen wake lock is off.'}</p></section>`;}
 function ui(){const box=$('phone-card');if(box)box.outerHTML=card();}
 function toast(text){let box=$('phone-toast');if(!box){box=document.createElement('div');box.id='phone-toast';box.className='phone-toast';box.setAttribute('role','status');document.body.appendChild(box);}box.textContent=text;box.hidden=false;setTimeout(()=>{box.hidden=true;},7000);}
 async function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')await audio.resume();return audio.state==='running';}catch{return false;}}
 async function chime(){if(!await unlockAudio()){toast('Sound unavailable. Rest alerts will appear on screen.');return;}for(let i=0;i<2;i++){const osc=audio.createOscillator(),gain=audio.createGain(),start=audio.currentTime+i*.32;osc.type='sine';osc.frequency.value=880;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.13,start+.015);gain.gain.exponentialRampToValueAtTime(.001,start+.22);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+.25);}if('vibrate' in navigator)navigator.vibrate([100,70,100]);}
 async function awake(){if(!options.awake||!data.fitness.active||document.visibilityState!=='visible'){if(wakeLock){await wakeLock.release();wakeLock=null;}return;}
  if(wakeLock)return;if(!navigator.wakeLock){const el=$('wake-status');if(el)el.textContent='This browser does not support keeping the screen awake.';return;}
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch{const el=$('wake-status');if(el)el.textContent='Screen wake lock is unavailable right now.';}
 }
 function checkRest(){const active=data.fitness.active,rest=active?.rest;if(!active||!rest?.endsAt){seenRest=null;awake();return;}
  if(seenRest!==rest.endsAt){seenRest=rest.endsAt;expiredWhileHidden=rest.endsAt<=Date.now();}
  if(Date.now()>=rest.endsAt&&!expiredWhileHidden){expiredWhileHidden=true;if(document.visibilityState==='visible'){toast('Rest complete — ready for your next set.');if(options.sound)chime();}}
  awake();
 }
 document.addEventListener('click',async event=>{const el=event.target.closest('[data-phone]');if(!el)return;event.preventDefault();event.stopImmediatePropagation();const action=el.dataset.phone;
  if(action==='sound'){options.sound=!options.sound;if(options.sound)await unlockAudio();saveOptions();ui();}
  if(action==='test')await chime();
  if(action==='awake'){options.awake=!options.awake;saveOptions();ui();await awake();}
  if(action==='install'&&installPrompt){await installPrompt.prompt();installPrompt=null;ui();}
  if(action==='update'&&registration?.waiting){if(data.fitness.active&&!confirm('Install the update and reopen FuelTrack? Your workout is saved, and the timer will continue.'))return;if(!save())return;registration.waiting.postMessage({type:'ACTIVATE_UPDATE'});}
 },true);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){awake();checkRest();registration?.update().catch(()=>{});}});
 window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;ui();});window.addEventListener('appinstalled',()=>{installPrompt=null;toast('FuelTrack installed.');ui();});
 window.addEventListener('online',()=>{toast('Back online. Cloud sync can reconnect.');});window.addEventListener('offline',()=>{toast('Offline — keep logging. Your records save here.');});
 if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('./sw.js').then(async reg=>{registration=reg;await navigator.serviceWorker.ready;status='Offline access ready on this device. Your first home-screen launch should be online.';ui();
   reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){status='An app update is ready. Install it below when convenient.';ui();}});});
  }).catch(()=>{status='Offline access could not be prepared. Check that all app files were uploaded and reload online.';ui();});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;if(registration?.active&&navigator.serviceWorker.controller){reloading=true;location.reload();}});
 }
 // Clicks prime sound permission before the timer completes.
 document.addEventListener('click',()=>{if(options.sound)unlockAudio();},{once:true});
 setInterval(checkRest,500);
 return {card};
})();

</script>
